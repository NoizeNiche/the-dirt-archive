name: Photo content quarantine

on:
  workflow_dispatch:
    inputs:
      audit_artifact:
        description: "Path to an audit CSV available in the checked-out workspace"
        required: true
        default: "/tmp/photo-content-audit.csv"

permissions:
  contents: write

jobs:
  quarantine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install image tooling
        run: |
          python -m pip install --disable-pip-version-check pillow pytesseract

      - name: Download Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Run exhaustive audit
        run: |
          python scripts/audit-photo-content.py --mode all --output /tmp/photo-content-audit.csv

      - name: Quarantine high-confidence contamination
        run: |
          python scripts/quarantine-photo-content.py /tmp/photo-content-audit.csv

      - name: Build facet index
        run: python scripts/build-pedal-facets.py

      - name: Validate
        run: python scripts/validate-archive.py

      - name: Commit quarantine
        run: |
          if git diff --quiet; then
            echo "No catalog/photo changes required."
            exit 0
          fi
          git config user.name "The Dirt Archive bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/PHOTO_CONTENT_QUARANTINE.csv assets/pedals research/PEDAL_FACETS.json
          git commit -m "Quarantine high-confidence contaminated pedal photos"
          git push
