name: Photo source fidelity audit

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 0"

permissions:
  contents: read

jobs:
  audit:
    name: Compare pictured photos to declared sources
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Run source fidelity audit
        env:
          PHOTO_FIDELITY_WORKERS: "12"
          PHOTO_FIDELITY_TIMEOUT_MS: "12000"
          PHOTO_FIDELITY_OUTPUT: photo-source-fidelity-audit.csv
        run: node scripts/audit-photo-source-fidelity.js

      - name: Publish report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dirt-archive-photo-source-fidelity
          path: photo-source-fidelity-audit.csv
          if-no-files-found: warn
          retention-days: 14
