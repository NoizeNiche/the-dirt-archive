# The Dirt Archive deployment pipeline
name: Deploy The Dirt Archive

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'pedal.html'
      - 'pedal-detail.html'
      - 'assets/**'
      - 'research/PEDAL_INDEX.json'
      - 'research/pedals/**'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'scripts/deploy-browser-audit.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows:
      - 'Cache pedal images'
      - 'PRP1 Atomic Intake'
      - 'Sync PRP catalog wiring'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dirt-archive-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate archive structure
        run: python scripts/validate-archive.py

      - name: Cache deploy Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: deploy-playwright-1.63.0-${{ runner.os }}

      - name: Browser audit for all researched pedal pages
        run: |
          node -e "const http=require('http'),fs=require('fs'),path=require('path');const root=process.cwd(),mime={'.html':'text/html; charset=utf-8','.js':'text/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.json':'application/json; charset=utf-8','.md':'text/markdown; charset=utf-8','.webp':'image/webp','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.gif':'image/gif','.svg':'image/svg+xml','.ico':'image/x-icon'};http.createServer((req,res)=>{try{if(req.method!=='GET'&&req.method!=='HEAD'){res.writeHead(405,{'Allow':'GET, HEAD'});return res.end()}const u=new URL(req.url,'http://127.0.0.1:4173'),file=path.resolve(root,decodeURIComponent(u.pathname.replace(/^\\/+/,''))||'index.html');if(file!==root&&!file.startsWith(root+path.sep)){res.writeHead(403);return res.end('Forbidden')}fs.stat(file,(e,s)=>{if(e||!s.isFile()){res.writeHead(404);return res.end('Not found')}res.writeHead(200,{'Content-Type':mime[path.extname(file).toLowerCase()]||'application/octet-stream','Content-Length':s.size,'Cache-Control':'no-store','Connection':'close'});if(req.method==='HEAD')return res.end();fs.createReadStream(file).pipe(res)})}catch(e){res.writeHead(400);res.end('Bad request')}}).listen(4173,'127.0.0.1');" >/tmp/dirt-archive-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT

          npm install --no-save playwright@1.63.0
          if compgen -G "$HOME/.cache/ms-playwright/chromium-*" > /dev/null; then
            echo "Playwright Chromium restored from cache."
          else
            echo "Playwright Chromium cache miss; installing Chromium and dependencies."
            npx playwright install --with-deps chromium
          fi

          node scripts/deploy-browser-audit.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1

      - name: Live audit of every pictured pedal
        env:
          LIVE_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node scripts/live-photo-audit.js

