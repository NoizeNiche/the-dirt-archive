# The Dirt Archive deployment pipeline
name: Deploy The Dirt Archive

on:
  # Publish after any workflow that can change the public catalog, photos,
  # research records, or tracker state. Deployment validation remains the
  # final gate before anything reaches GitHub Pages.
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Cache pedal images"
      - "PRP1 Atomic Intake"
      - "Sync PRP catalog wiring"
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dirt-archive-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify site files and PRP links
        run: |
          test -f index.html
          test -f pedal.html
          test -f pedal-detail.html
          test -f research/PEDAL_INDEX.json
          test -f research/pedals/PEDAL_IMAGES.json
          test -f research/PRP_TRACKER.csv

          python - <<'PY'
          import csv
          import json
          import os
          import re
          from pathlib import Path

          catalog = json.loads(Path("research/PEDAL_INDEX.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("research/pedals/PEDAL_IMAGES.json").read_text(encoding="utf-8"))
          pedals = catalog.get("pedals", [])

          assert catalog.get("count") == len(pedals), "Pedal index count mismatch"

          def key(entry, builder_key, pedal_key):
              return (entry.get(builder_key), entry.get(pedal_key))

          catalog_keys = [key(x, "company", "pedal") for x in pedals]
          manifest_keys = [key(x, "builder", "pedal") for x in manifest]
          assert len(catalog_keys) == len(set(catalog_keys)), "Duplicate Builder + Pedal entries in pedal index"
          assert len(manifest_keys) == len(set(manifest_keys)), "Duplicate Builder + Pedal entries in photo manifest"
          assert len(manifest) == len({x for x in manifest_keys}), "Photo manifest identity count mismatch"

          catalog_by_key = {key(x, "company", "pedal"): x for x in pedals}
          manifest_by_key = {key(x, "builder", "pedal"): x for x in manifest}

          index_records = {x.get("research_record") for x in pedals if x.get("research_record")}
          manifest_records = {x.get("research_record") for x in manifest if x.get("research_record")}
          assert index_records == manifest_records, "Pedal index and photo manifest research records disagree"

          missing_image_keys = []
          for entry in manifest:
              assert "image" in entry, f"Manifest entry lacks explicit image field: {key(entry, 'builder', 'pedal')}"
              rr = entry.get("research_record")
              if rr:
                  path = Path(rr.lstrip("./"))
                  assert path.exists(), f"Missing PRP research file: {rr}"
              k = key(entry, "builder", "pedal")
              assert k in catalog_by_key, f"Manifest entry missing from pedal index: {k}"
              public = catalog_by_key[k]
              assert (entry.get("image") or None) == (public.get("image") or None), f"Photo mismatch between manifest and pedal index: {k}"

          for entry in pedals:
              rr = entry.get("research_record")
              if rr:
                  path = Path(rr.lstrip("./"))
                  assert path.exists(), f"Missing PRP research file: {rr}"
              if entry.get("catalog_role") == "variation":
                  parent_key = (entry.get("company"), entry.get("parent_pedal"))
                  assert parent_key in catalog_by_key, f"Variation has no parent pedal: {key(entry, 'company', 'pedal')}"
                  assert catalog_by_key[parent_key].get("catalog_role") != "variation", f"Variation parent is itself a variation: {key(entry, 'company', 'pedal')}"
              if entry.get("version_of"):
                  assert entry.get("version_of") in {x.get("company") + "\u0000" + x.get("pedal") for x in pedals}, f"Version parent missing: {key(entry, 'company', 'pedal')}"

          linked_records = {"./" + path.as_posix() for path in Path("research/pedals").rglob("*.md")}
          assert linked_records == manifest_records, "Research record files and manifest links are not in one-to-one sync"

          tracker_path = Path("research/PRP_TRACKER.csv")
          with tracker_path.open(newline="", encoding="utf-8") as handle:
              tracker_rows = list(csv.DictReader(handle))
          assert len(tracker_rows) == len(pedals), "PRP tracker row count does not match pedal index"
          tracker_pairs = [(x.get("Builder"), x.get("Pedal")) for x in tracker_rows]
          assert len(tracker_pairs) == len(set(tracker_pairs)), "Duplicate Builder + Pedal entries in PRP tracker"
          assert set(tracker_pairs) == set(catalog_keys), "PRP tracker and pedal index Builder + Pedal identities disagree"

          for row in tracker_rows:
              k = (row.get("Builder"), row.get("Pedal"))
              public = catalog_by_key[k]
              expected_info = bool(public.get("research_record"))
              expected_picture = bool(public.get("image"))
              expected_complete = expected_info and expected_picture
              actual_info = row.get("Pedal Info") == "DONE"
              actual_picture = row.get("Picture") == "DONE"
              actual_complete = row.get("PRP Complete") == "DONE"
              assert actual_info == expected_info, f"Tracker Pedal Info mismatch: {k}"
              assert actual_picture == expected_picture, f"Tracker Picture mismatch: {k}"
              assert actual_complete == expected_complete, f"Tracker PRP Complete mismatch: {k}"
              assert (row.get("Research Record") or "") == (public.get("research_record") or ""), f"Tracker research record mismatch: {k}"

          researched = sum(bool(x.get("research_record")) for x in pedals)
          pictured = sum(bool(x.get("image")) for x in pedals)
          complete = sum(bool(x.get("research_record")) and bool(x.get("image")) for x in pedals)
          incomplete = len(pedals) - complete
          photo_pending = researched - complete

          tracker_researched = sum(x.get("Pedal Info") == "DONE" for x in tracker_rows)
          tracker_pictured = sum(x.get("Picture") == "DONE" for x in tracker_rows)
          tracker_complete = sum(x.get("PRP Complete") == "DONE" for x in tracker_rows)

          assert tracker_researched == researched, "Tracker researched count mismatch"
          assert tracker_pictured == pictured, "Tracker pictured count mismatch"
          assert tracker_complete == complete, "Tracker complete count mismatch"
          assert photo_pending >= 0, f"Invalid researched/photo-pending count: {photo_pending}"

          home = Path("index.html").read_text(encoding="utf-8")
          detail = Path("pedal-detail.html").read_text(encoding="utf-8")
          workflow_text = Path(".github/workflows/deploy-pages.yml").read_text(encoding="utf-8")
          version_match = re.search(r'const DATA_VERSION\s*=\s*[\'"]([^\'"]+)[\'"]', home)
          detail_version_match = re.search(r'const DATA_VERSION\s*=\s*[\'"]([^\'"]+)[\'"]', detail)
          assert version_match and version_match.group(1) == catalog.get("version"), "index.html DATA_VERSION is stale"
          assert detail_version_match and detail_version_match.group(1) == catalog.get("version"), "pedal-detail.html DATA_VERSION is stale"
          assert "No Photo Archived" in home and "No Photo Archived" in detail, "No Photo Archived fallback is missing"
          assert "PEDAL_INDEX.json" in home and "PEDAL_INDEX.json" in detail, "Catalog data source missing from site"

          for entry in pedals:
              image = entry.get("image")
              if not image:
                  continue
              if re.match(r"^https?://", image):
                  continue
              if not re.match(r"^(?:\./)?assets/pedals/", image):
                  raise AssertionError(f"Unsupported catalog image path: {key(entry, 'company', 'pedal')} -> {image}")
              local_path = Path(image.replace("./", "", 1))
              assert local_path.exists(), f"Catalog image file missing: {key(entry, 'company', 'pedal')} -> {image}"
              assert entry.get("image_source_url") or entry.get("source_page"), f"Local image missing provenance source: {key(entry, 'company', 'pedal')}"
              if entry.get("catalog_role") == "variation":
                  assert "/variants/" in image.replace("\\", "/"), f"Variation image is not stored under variants/: {key(entry, 'company', 'pedal')}"
          assert "item.research_record" in detail, "Pedal detail research binding is missing"
          assert r"variationSearchText.get(x.company+'\\u0000'+x.pedal)" not in home, "Variation search null-key bug remains"
          assert "playwright" in workflow_text.lower(), "Browser audit is missing from deployment workflow"

          print(f"Site data verified: {len(pedals)} pedals; {researched} researched; {pictured} pictured; {complete} complete; {incomplete} incomplete; {photo_pending} photo-pending.")
          PY

      - name: Check local photo cache gate
        id: cache_gate
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          catalog = json.loads(Path("research/PEDAL_INDEX.json").read_text(encoding="utf-8"))
          external = [
              f"{x.get('company')} / {x.get('pedal')}"
              for x in catalog.get("pedals", [])
              if x.get("image") and re.match(r"^https?://", x.get("image"))
          ]
          if external:
              print(f"Photo cache pending for {len(external)} pictured entries; waiting for the local cache commit.")
              for item in external[:12]:
                  print(f" - {item}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("ready=false\n")
          else:
              print("All pictured catalog images are local.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("ready=true\n")
          PY


      - name: Browser audit for all researched pedal pages
        if: steps.cache_gate.outputs.ready == 'true'
        run: |
          python -m http.server 4173 >/tmp/dirt-archive-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT

          npm install --no-save playwright
          npx playwright install --with-deps chromium

          node scripts/deploy-browser-audit.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Live audit of every pictured pedal
        env:
          LIVE_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/live-photo-audit.js

