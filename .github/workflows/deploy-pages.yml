# The Dirt Archive deployment pipeline
name: Deploy The Dirt Archive

on:
  # Publish after any workflow that can change the public catalog, photos,
  # research records, or tracker state. Deployment validation remains the
  # final gate before anything reaches GitHub Pages.
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Cache pedal images"
      - "PRP1 Atomic Intake"
      - "Sync PRP catalog wiring"
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dirt-archive-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate archive structure
        run: python scripts/validate-archive.py

      - name: Check local photo cache gate
        id: cache_gate
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          catalog = json.loads(Path("research/PEDAL_INDEX.json").read_text(encoding="utf-8"))
          external = [
              f"{x.get('company')} / {x.get('pedal')}"
              for x in catalog.get("pedals", [])
              if x.get("image") and re.match(r"^https?://", x.get("image"))
          ]
          if external:
              print(f"Photo cache pending for {len(external)} pictured entries; waiting for the local cache commit.")
              for item in external[:12]:
                  print(f" - {item}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("ready=false\n")
          else:
              print("All pictured catalog images are local.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("ready=true\n")
          PY


      - name: Browser audit for all researched pedal pages
        if: steps.cache_gate.outputs.ready == 'true'
        run: |
          python -m http.server 4173 >/tmp/dirt-archive-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT

          npm install --no-save playwright
          npx playwright install --with-deps chromium

          node scripts/deploy-browser-audit.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Live audit of every pictured pedal
        env:
          LIVE_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/live-photo-audit.js

