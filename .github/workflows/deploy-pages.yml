# The Dirt Archive deployment pipeline
name: Deploy The Dirt Archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify site files and PRP links
        run: |
          test -f index.html
          test -f pedal.html
          test -f pedal-detail.html
          test -f research/PEDAL_INDEX.json
          test -f research/pedals/PEDAL_IMAGES.json
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("research/PEDAL_INDEX.json").read_text())
          manifest = json.loads(Path("research/pedals/PEDAL_IMAGES.json").read_text())

          pedals = catalog.get("pedals", [])
          assert catalog.get("count") == len(pedals), "Pedal index count mismatch"

          def key(entry, builder_key, pedal_key):
              return (entry.get(builder_key), entry.get(pedal_key))

          catalog_keys = [key(x, "company", "pedal") for x in pedals]
          manifest_keys = [key(x, "builder", "pedal") for x in manifest]
          assert len(catalog_keys) == len(set(catalog_keys)), "Duplicate Builder + Pedal entries in pedal index"
          assert len(manifest_keys) == len(set(manifest_keys)), "Duplicate Builder + Pedal entries in photo manifest"

          catalog_by_key = {key(x, "company", "pedal"): x for x in pedals}
          manifest_by_key = {key(x, "builder", "pedal"): x for x in manifest}

          index_records = {x.get("research_record") for x in pedals if x.get("research_record")}
          manifest_records = {x.get("research_record") for x in manifest if x.get("research_record")}
          assert index_records == manifest_records, "Pedal index and photo manifest research records disagree"

          for entry in manifest:
              rr = entry.get("research_record")
              if rr:
                  path = Path(rr.lstrip("./"))
                  assert path.exists(), f"Missing PRP research file: {rr}"
              k = key(entry, "builder", "pedal")
              assert k in catalog_by_key, f"Manifest entry missing from pedal index: {k}"
              public = catalog_by_key[k]
              assert entry.get("image") == public.get("image"), f"Photo mismatch between manifest and pedal index: {k}"

          for entry in pedals:
              rr = entry.get("research_record")
              if rr:
                  path = Path(rr.lstrip("./"))
                  assert path.exists(), f"Missing PRP research file: {rr}"
              if entry.get("catalog_role") == "variation":
                  parent_key = (entry.get("company"), entry.get("parent_pedal"))
                  assert parent_key in catalog_by_key, f"Variation has no parent pedal: {key(entry, 'company', 'pedal')}"
                  assert catalog_by_key[parent_key].get("catalog_role") != "variation", f"Variation parent is itself a variation: {key(entry, 'company', 'pedal')}"
              if entry.get("version_of"):
                  assert entry.get("version_of") in {x.get("company") + "\u0000" + x.get("pedal") for x in pedals}, f"Version parent missing: {key(entry, 'company', 'pedal')}"

          for path in Path("research/pedals").rglob("*.md"):
              rel = "./" + path.as_posix()
              assert rel in manifest_records, f"Unlinked PRP research record: {rel}"

          import csv

          tracker_path = Path("research/PRP_TRACKER.csv")
          with tracker_path.open(newline="", encoding="utf-8") as handle:
              tracker_rows = list(csv.DictReader(handle))
          assert len(tracker_rows) == len(pedals), "PRP tracker row count does not match pedal index"
          tracker_pairs = [(x.get("Builder"), x.get("Pedal")) for x in tracker_rows]
          assert len(tracker_pairs) == len(set(tracker_pairs)), "Duplicate Builder + Pedal entries in PRP tracker"
          assert set(tracker_pairs) == set(catalog_keys), "PRP tracker and pedal index Builder + Pedal identities disagree"

          assert "No Photo Archived" in Path("index.html").read_text()
          assert "PEDAL_INDEX.json" in Path("index.html").read_text()
          assert "PEDAL_INDEX.json" in Path("pedal-detail.html").read_text()
          assert "item.research_record" in Path("pedal-detail.html").read_text()
          print("Site data verified: {} pedals; {} research records; {} manifest entries".format(len(pedals), len(index_records), len(manifest)))
          PY


      - name: Browser smoke test for live data and visual readability
        run: |
          python -m http.server 4173 >/tmp/dirt-archive-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node - <<'JS'
          const { chromium } = require('playwright');

          function rgb(value) {
            const m = value.match(/rgba?\(([^)]+)\)/);
            if (!m) return null;
            const parts = m[1].split(',').map(x => Number.parseFloat(x.trim()));
            return parts.slice(0,3);
          }

          function luminance(rgb) {
            if (!rgb) return 0;
            return rgb.map(v => {
              v /= 255;
              return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            }).reduce((a,v,i) => a + v * [0.2126,0.7152,0.0722][i], 0);
          }

          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({ viewport:{width:1440,height:1000} });

            const catalogResponse = await page.request.get('http://127.0.0.1:4173/research/PEDAL_INDEX.json');
            if (!catalogResponse.ok()) throw new Error('Could not load the pedal index for browser audit.');
            const catalog = await catalogResponse.json();

            const researchedParents = (catalog.pedals || []).filter(
              x => x.research_record && x.catalog_role !== 'variation'
            );

            console.log('Auditing researched parent pedal pages:', researchedParents.length);



            await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'networkidle'});
            const cardCount = await page.locator('#grid .card').count();
            if (cardCount > 72) throw new Error('Catalog rendered more than the intended 72-card window.');
            if (await page.locator('.boardRail').count()) throw new Error('Obsolete pedalboard rail elements remain on the page.');

            for (const entry of researchedParents) {
              const url =
                'http://127.0.0.1:4173/pedal-detail.html?builder=' +
                encodeURIComponent(entry.company) +
                '&pedal=' +
                encodeURIComponent(entry.pedal);

              await page.goto(url, {waitUntil:'domcontentloaded'});
              await page.waitForFunction(() => {
                const el = document.querySelector('#research');
                return el && el.textContent.trim().length > 40 &&
                  !/loading pedal information|could not be loaded/i.test(el.textContent);
              }, null, {timeout:10000});

              const result = await page.evaluate(() => {
                const el = document.querySelector('#research');
                const record = document.querySelector('#record');
                const style = getComputedStyle(el);
                const rect = el.getBoundingClientRect();
                return {
                  text: el.textContent.trim(),
                  color: style.color,
                  background: style.backgroundColor,
                  width: rect.width,
                  height: rect.height,
                  recordVisible: record && !record.hidden
                };
              });

              if (!result.recordVisible) {
                throw new Error('Pedal detail record did not become visible: ' + entry.company + ' / ' + entry.pedal);
              }
              if (result.text.length < 40) {
                throw new Error('Pedal Info is unexpectedly short: ' + entry.company + ' / ' + entry.pedal);
              }
              if (result.width < 200 || result.height < 40) {
                throw new Error('Pedal Info container collapsed: ' + entry.company + ' / ' + entry.pedal);
              }

              const fg = luminance(rgb(result.color));
              const bg = luminance(rgb(result.background));
              const contrast = (Math.max(fg,bg)+0.05)/(Math.min(fg,bg)+0.05);
              if (contrast < 4.5) {
                throw new Error(
                  'Pedal Info text/background contrast is below the readability threshold for ' +
                  entry.company + ' / ' + entry.pedal + ': ' + contrast.toFixed(2)
                );
              }

              console.log('PASS', entry.company, '/', entry.pedal);
            }


            const cardCount = await page.locator('#grid .card').count();
            if (cardCount > 72) throw new Error('Catalog rendered more than the intended 72-card window.');
            if (await page.locator('.boardRail').count()) throw new Error('Obsolete pedalboard rail elements remain on the page.');

            await page.goto(
              'http://127.0.0.1:4173/pedal-detail.html?builder=1981%20Inventions&pedal=DRV%20MOD%201',
              {waitUntil:'networkidle'}
            );
            await page.waitForFunction(() => {
              const el=document.querySelector('#research');
              return el && el.textContent.trim().length > 100;
            });

            const checks = await page.evaluate(() => {
              const el=document.querySelector('#research');
              const cs=getComputedStyle(el);
              const rect=el.getBoundingClientRect();
              return {
                text:el.textContent.trim(),
                color:cs.color,
                background:cs.backgroundColor,
                width:rect.width,
                height:rect.height
              };
            });

            if (!checks.text.includes('What this pedal is')) {
              throw new Error('Known researched pedal did not render its Pedal Info content.');
            }
            if (checks.width < 200 || checks.height < 80) {
              throw new Error('Pedal Info container collapsed unexpectedly.');
            }

            const fg=luminance(rgb(checks.color));
            const bg=luminance(rgb(checks.background));
            const contrast=(Math.max(fg,bg)+0.05)/(Math.min(fg,bg)+0.05);
            if (contrast < 4.5) {
              throw new Error('Pedal Info text/background contrast is below the readability threshold: '+contrast.toFixed(2));
            }

            await browser.close();
            console.log('Browser smoke test passed:', checks);
          })().catch(err=>{ console.error(err); process.exit(1); });
          JS

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
