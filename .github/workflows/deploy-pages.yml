# The Dirt Archive deployment pipeline
name: Deploy The Dirt Archive

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'pedal.html'
      - 'pedal-detail.html'
      - 'assets/**'
      - 'research/PEDAL_INDEX.json'
      - 'research/pedals/**'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'scripts/deploy-browser-audit.js'
      - 'scripts/serve-static.js'
      - 'scripts/live-photo-audit.js'
      - 'scripts/validate-archive.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dirt-archive-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate archive structure
        run: python scripts/validate-archive.py

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Cache deploy Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: deploy-playwright-1.63.0-${{ runner.os }}

      - name: Browser audit for all researched pedal pages
        run: |
          node scripts/serve-static.js >/tmp/dirt-archive-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT

          npm install --no-save playwright@1.63.0
          if compgen -G "$HOME/.cache/ms-playwright/chromium-*" > /dev/null; then
            echo "Playwright Chromium restored from cache."
          else
            echo "Playwright Chromium cache miss; installing Chromium and dependencies."
            npx playwright install --with-deps chromium
          fi

          node scripts/deploy-browser-audit.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1

      - name: Live audit of every pictured pedal
        env:
          LIVE_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node scripts/live-photo-audit.js

