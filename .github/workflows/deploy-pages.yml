# The Dirt Archive deployment pipeline
name: Deploy The Dirt Archive

on:
  push:
    branches: [main]
    # Pages only needs to run when the public site or canonical published data
    # changes. Validation, audit, and workflow-only edits are covered by their
    # own CI lanes and must not create needless deployments.
    paths:
      - 'index.html'
      - 'pedal.html'
      - 'pedal-detail.html'
      - 'compare.html'
      - 'builder.html'
      - 'builders.html'
      - 'identify.html'
      - 'corrections.html'
      - 'methodology.html'
      - 'audit.html'
      - '404.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'assets/**'
      - 'research/PEDAL_INDEX.json'
      - 'research/PEDAL_FACETS.json'
      - 'research/pedals/**'
      - 'scripts/build-pedal-facets.py'
      - 'scripts/deploy-browser-audit.js'
      - 'scripts/serve-static.js'
      - 'scripts/live-photo-audit.js'
      - 'scripts/validate-archive.py'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Emergency photo catch-up
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dirt-archive-deploy-v3
  # Only the newest main snapshot needs to reach Pages. Superseded deploys
  # are disposable because the canonical commit remains in the newer tree.
  cancel-in-progress: true

jobs:
  deploy:
    # A workflow_run event bypasses the GITHUB_TOKEN push-trigger limitation
    # of the photo worker. Only a successful emergency photo run should deploy.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check deployment freshness
        id: freshness
        shell: bash
        run: |
          git fetch origin main --quiet
          current_sha="$(git rev-parse HEAD)"
          latest_sha="$(git rev-parse origin/main)"
          if [ "$current_sha" = "$latest_sha" ]; then
            echo "Deployment snapshot is current: $current_sha"
          else
            echo "Superseded deployment snapshot: current=$current_sha latest=$latest_sha"
            # Public commits can be followed quickly by CI-only commits (for
            # example audit kick files). Deploy the latest canonical main tree
            # instead of skipping and leaving the public commit stranded.
            git reset --hard origin/main
            git clean -fd
            current_sha="$(git rev-parse HEAD)"
            echo "Rehydrated deployment snapshot to latest main: $current_sha"
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Build technical facet index
        if: steps.freshness.outputs.current == 'true'
        run: python scripts/build-pedal-facets.py
      - name: Validate archive structure
        if: steps.freshness.outputs.current == 'true'
        run: python scripts/validate-archive.py

      - name: Setup Node
        if: steps.freshness.outputs.current == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Cache deploy Playwright browser
        if: steps.freshness.outputs.current == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: deploy-playwright-1.63.0-${{ runner.os }}

      - name: Re-check deployment freshness before browser audit
        id: browser_freshness
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          git fetch origin main --quiet
          current_sha="$(git rev-parse HEAD)"
          latest_sha="$(git rev-parse origin/main)"
          if [ "$current_sha" != "$latest_sha" ]; then
            echo "Deployment snapshot advanced before browser audit: current=$current_sha latest=$latest_sha"
            # Rehydrate once more so harmless CI-only commits cannot strand a
            # valid public-data deployment behind an exact-SHA mismatch.
            git reset --hard origin/main
            git clean -fd
            current_sha="$(git rev-parse HEAD)"
            echo "Browser-audit snapshot rehydrated to latest main: $current_sha"
          else
            echo "Deployment snapshot remains current: $current_sha"
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Browser audit for all researched pedal pages
        if: steps.freshness.outputs.current == 'true' && steps.browser_freshness.outputs.current == 'true'
        env:
          DEPLOY_IMAGE_AUDIT_MODE: all
          DEPLOY_IMAGE_AUDIT_WORKERS: 16
          # Deployment performs changed-page + bounded smoke research checks.
          # Exhaustive research-page QA belongs to exhaustive-quality-audit.yml.
          DEPLOY_RESEARCH_AUDIT_MODE: changed
          DEPLOY_RESEARCH_AUDIT_WORKERS: 12
        run: |
          node scripts/serve-static.js >/tmp/dirt-archive-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT

          npm install --no-save playwright@1.63.0
          if compgen -G "$HOME/.cache/ms-playwright/chromium-*" > /dev/null; then
            echo "Playwright Chromium restored from cache."
          else
            echo "Playwright Chromium cache miss; installing Chromium and dependencies."
            npx playwright install --with-deps chromium
          fi

          timeout 600s node scripts/deploy-browser-audit.js

      - name: Install photo content audit tooling
        if: steps.freshness.outputs.current == 'true' && steps.browser_freshness.outputs.current == 'true'
        run: |
          python -m pip install --disable-pip-version-check pillow pytesseract
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Final changed-photo content gate
        if: steps.freshness.outputs.current == 'true' && steps.browser_freshness.outputs.current == 'true'
        run: |
          python scripts/audit-photo-content.py --mode changed --output /tmp/deploy-photo-content-audit.csv --fail-high-confidence

      - name: Upload site
        if: steps.freshness.outputs.current == 'true' && steps.browser_freshness.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy
        if: steps.freshness.outputs.current == 'true' && steps.browser_freshness.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v5.0.1

      - name: Live audit of every pictured pedal
        if: steps.freshness.outputs.current == 'true' && steps.browser_freshness.outputs.current == 'true'
        env:
          LIVE_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node scripts/live-photo-audit.js

