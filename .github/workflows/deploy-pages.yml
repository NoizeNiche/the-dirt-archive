# The Dirt Archive deployment pipeline
name: Deploy The Dirt Archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify site files and PRP links
        run: |
          test -f index.html
          test -f pedal.html
          test -f pedal-detail.html
          test -f research/PEDAL_INDEX.json
          test -f research/pedals/PEDAL_IMAGES.json
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("research/PEDAL_INDEX.json").read_text())
          manifest = json.loads(Path("research/pedals/PEDAL_IMAGES.json").read_text())
          indexed = {entry.get("research_record") for entry in manifest if entry.get("research_record")}

          for entry in manifest:
              rr = entry.get("research_record")
              if rr:
                  path = Path(rr.lstrip("./"))
                  assert path.exists(), f"Missing PRP research file: {rr}"

          for path in Path("research/pedals").rglob("*.md"):
              rel = "./" + path.as_posix()
              assert rel in indexed, f"Unlinked PRP research record: {rel}"

          assert "No Photo Archived" in Path("index.html").read_text()
          assert "PEDAL_INDEX.json" in Path("index.html").read_text()
          assert "PEDAL_INDEX.json" in Path("pedal-detail.html").read_text()
          assert "item.research_record" in Path("pedal-detail.html").read_text()
          assert catalog.get("count") == len(catalog.get("pedals", [])), "Pedal index count mismatch"
          print("PRP manifest verified: {} research records; pedal index verified: {} pedals".format(len(indexed), catalog.get("count")))
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
