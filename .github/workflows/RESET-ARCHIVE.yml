name: RESET ARCHIVE

on:
  push:
    paths:
      - '.github/workflows/RESET-ARCHIVE.yml'

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Delete every tracked project file
        run: |
          git config user.name 'NoizeNiche'
          git config user.email 'noizenicheig@gmail.com'
          git rm -rf -- .
          git commit -m 'Reset archive for clean rebuild' || exit 0
          git push origin HEAD:main
