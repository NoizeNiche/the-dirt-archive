name: Sync research catalog

on:
  push:
    branches: [main]
    paths:
      - 'research/PRP_SYNC_QUEUE/**'
      - 'research/pedals/**'
      - 'research/RESEARCH_KICK'
      - 'scripts/sync_prp_catalog.py'
      - 'scripts/build-research-queue.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dirt-prp-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Synchronize research records into canonical catalog and photo manifest
        run: python scripts/sync_prp_catalog.py

      - name: Synchronize tracker from canonical catalog
        run: python scripts/sync-prp-tracker.py

      - name: Build Catalog Research Phase queue
        run: python scripts/build-research-queue.py

      - name: Validate archive structure
        run: python scripts/validate-archive.py

      - name: Persist synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md
          if git diff --cached --quiet; then
            echo "Research metadata already synchronized."
            exit 0
          fi

          git commit -m "Sync research catalog and phase queue"

          # Parallel research workers can finish close together. Rebase the
          # generated synchronization commit onto the newest main branch before
          # pushing so a sibling worker cannot strand an otherwise valid batch.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              exit 0
            fi

            echo "Sync push race; rebasing onto latest main (attempt $attempt/5)."
            git fetch origin main
            git rebase origin/main
          done

          echo "Unable to publish synchronized research metadata after 5 attempts."
          exit 1
