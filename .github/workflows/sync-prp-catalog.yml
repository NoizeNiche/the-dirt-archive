name: Sync research catalog

on:
  push:
    branches: [main]
    paths:
      - 'research/PRP_SYNC_QUEUE/**'
      - 'research/RESEARCH_KICK'
      - 'scripts/sync_prp_catalog.py'
      - 'scripts/generate-surface-records.py'
      - 'scripts/build-research-queue.py'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dirt-prp-catalog-sync
  # Serialize scheduled and manual syncs instead of discarding an active reconciliation.
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # The workflow is idempotent and its own commit does not touch RESEARCH_KICK,
    # so bot-originated kick events are safe and must not be silently ignored.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate surface catalog records for uncovered pedals
        run: python scripts/generate-surface-records.py

      - name: Synchronize research records into canonical catalog and photo manifest
        run: python scripts/sync_prp_catalog.py

      - name: Synchronize tracker from canonical catalog
        run: python scripts/sync-prp-tracker.py

      - name: Synchronize photo backlog from tracker
        run: python scripts/sync-photo-backlog.py

      - name: Build Catalog Research Phase queue
        run: python scripts/build-research-queue.py

      - name: Validate archive structure
        run: python scripts/validate-archive.py

      - name: Persist synchronization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/PEDAL_INDEX.json research/pedals research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/PHOTO_BACKLOG.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md
          if git diff --cached --quiet; then
            echo "Research metadata already synchronized."
            exit 0
          fi

          git commit -m "Sync research catalog and phase queue"

          # Generated catalog/tracker/queue files are derived state. When
          # multiple research workers finish together, never try to merge those
          # generated files as ordinary source changes. Rebuild them from the
          # newest canonical research on main and publish that snapshot.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              if git diff-tree --no-commit-id --name-only -r HEAD | grep -Eq '^(index\.html|pedal\.html|pedal-detail\.html|assets/|research/PEDAL_INDEX\.json)'; then
                echo "Public archive files changed; dispatching Pages deployment."
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/dispatches" -f ref=main
              else
                echo "Only internal/generated research state changed; no Pages deployment dispatch needed."
              fi
              exit 0
            fi

            echo "Generated-state push race; rebuilding from newest main (attempt $attempt/5)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/generate-surface-records.py
            python scripts/sync_prp_catalog.py
            python scripts/sync-prp-tracker.py
            python scripts/build-research-queue.py
            python scripts/validate-archive.py
            python scripts/sync-photo-backlog.py
            git add research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/PHOTO_BACKLOG.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md
            if git diff --cached --quiet; then
              echo "Newest main already contains synchronized research state."
              exit 0
            fi
            git commit -m "Sync research catalog and phase queue"
          done

          echo "Unable to publish synchronized research metadata after 5 rebuild attempts."
          exit 1

      - name: Start deep research background lane
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          catalog=json.load(open("research/PEDAL_INDEX.json",encoding="utf-8"))
          pedals=[p for p in catalog.get("pedals",[]) if p.get("catalog_role") != "variation"]
          surface_ready=sum(1 for p in pedals if p.get("research_record"))
          deep=sum(1 for p in pedals if str(p.get("research_level") or "").strip().lower()=="deep")
          with open("/tmp/deep-lane-state","w",encoding="utf-8") as fh:
              fh.write(f"{surface_ready} {len(pedals)} {deep}\n")
          print(f"Surface-ready={surface_ready} total={len(pedals)} deep={deep}")
          PY
          read -r surface_ready total deep < /tmp/deep-lane-state
          if [ "$surface_ready" -eq "$total" ] && [ "$deep" -lt "$total" ]; then
            active="$(gh run list --workflow research-worker-team.yml --branch main --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length')"
            if [ "$active" -eq 0 ]; then
              echo "Surface catalog is complete; starting one bounded deep-research pass."
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/research-worker-team.yml/dispatches" -f ref=main
            else
              echo "A deep-research run is already queued or active; no duplicate dispatch."
            fi
          else
            echo "Deep lane not started: surface-ready=$surface_ready total=$total deep=$deep."
          fi

