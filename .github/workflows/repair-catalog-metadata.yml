name: Repair catalog metadata

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: dirt-archive-publisher-v1
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Repair catalog count
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("research/PEDAL_INDEX.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          actual = len(data.get("pedals", []))
          if data.get("count") != actual:
              print(f"Repairing catalog count {data.get('count')} -> {actual}")
              data["count"] = actual
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          else:
              print(f"Catalog count already matches: {actual}")
          PY

      - name: Validate repaired catalog
        run: python scripts/validate-archive.py

      - name: Publish metadata repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/PEDAL_INDEX.json
          if git diff --cached --quiet; then
            echo "No metadata repair needed."
            exit 0
          fi
          git commit -m "Repair pedal catalog count metadata"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
