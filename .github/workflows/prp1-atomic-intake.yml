name: PRP1 Atomic Intake

on:
  workflow_run:
    workflows: ["Cache pedal images"]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - "research/PRP1_INTAKE/*.json"
      - "research/PRP1_KICK"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dirt-prp1-atomic
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refresh tracker from canonical catalog
        run: python scripts/sync-prp-tracker.py

      - name: Verify photo state before PRP1 gate
        run: python scripts/verify-photo-state.py

      - name: Open PRP1 lane
        id: photo_gate
        run: |
          echo "complete=true" >> "$GITHUB_OUTPUT"
          echo "PRP1 global photo catch-up gate is open. Each target still requires an exact photo attempt before finalization."

      - name: Check PRP1 intake queue
        id: intake_gate
        if: steps.photo_gate.outputs.complete == 'true'
        run: |
          if find research/PRP1_INTAKE -maxdepth 1 -type f -name '*.json' -print -quit | grep -q .; then
            echo "has_target=true" >> "$GITHUB_OUTPUT"
            echo "A PRP1 intake package is ready."
          else
            echo "has_target=false" >> "$GITHUB_OUTPUT"
            echo "No PRP1 intake package is currently queued."
          fi

      - name: Cache PRP1 browser
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        id: playwright_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: prp1-playwright-1.63.0-${{ runner.os }}

      - name: Install tooling
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: |
          python -m pip install --disable-pip-version-check pillow
          npm install --no-save playwright@1.63.0
          if [ "${{ steps.playwright_cache.outputs.cache-hit }}" = "true" ]; then
            echo "Playwright 1.63.0 browser cache restored."
          else
            npx playwright install --with-deps chromium
          fi

      - name: Prepare next PRP1 intake
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: python scripts/prp1-atomic-intake.py

      - name: Synchronize researched record wiring
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: python scripts/sync_prp_catalog.py

      - name: Try verified direct image fallback
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          from PIL import Image

          target = json.loads(Path(".prp1-target.json").read_text(encoding="utf-8"))
          builder = target["builder"]
          pedal = target["pedal"]
          catalog = json.loads(Path("research/PEDAL_INDEX.json").read_text(encoding="utf-8"))
          entry = next(
              (p for p in catalog.get("pedals", [])
               if p.get("company") == builder and p.get("pedal") == pedal),
              None,
          )
          if not entry or entry.get("image_source_page_verified") is not True:
              print("No verified direct-image fallback eligible for PRP1 target.")
              raise SystemExit(0)

          urls = list(entry.get("image_source_urls") or [])
          if entry.get("image_source_url"):
              urls.insert(0, entry["image_source_url"])
          urls = list(dict.fromkeys(
              value.strip() for value in urls
              if re.match(r"^https?://", str(value or ""), re.I)
              and re.search(r"\.(?:jpe?g|png|webp|gif)(?:[?#].*)?$", str(value or ""), re.I)
          ))
          if not urls:
              print("No directly downloadable verified image URL.")
              raise SystemExit(0)

          def slug(value):
              return re.sub(r"[^a-z0-9]+", "-", str(value or "").lower()).strip("-") or "unknown"

          target_path = Path("assets/pedals") / slug(builder) / slug(pedal) / "primary.source"
          target_path.parent.mkdir(parents=True, exist_ok=True)

          for url in urls[:3]:
              tmp = target_path.with_suffix(".download")
              cmd = [
                  "curl", "-L", "--silent", "--show-error", "--fail", "--compressed",
                  "--connect-timeout", "4", "--max-time", "15",
                  "-A", "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36",
                  "-H", "Accept: image/avif,image/webp,image/apng,image/jpeg,image/png,image/*,*/*;q=0.8",
                  "-o", str(tmp), url,
              ]
              try:
                  proc = subprocess.run(cmd, capture_output=True, text=True, timeout=18)
              except Exception:
                  continue
              if proc.returncode != 0 or not tmp.exists():
                  continue
              data = tmp.read_bytes()
              if len(data) < 3000:
                  tmp.unlink(missing_ok=True)
                  continue
              try:
                  with Image.open(io.BytesIO(data)) as image:
                      if image.width <= 0 or image.height <= 0:
                          raise ValueError("invalid dimensions")
                      image.verify()
              except Exception:
                  tmp.unlink(missing_ok=True)
                  continue
              target_path.write_bytes(data)
              tmp.unlink(missing_ok=True)
              print(f"Staged verified direct image for PRP1 target: {target_path}")
              break
          else:
              print("No verified direct image could be staged.")
          PY

      - name: Recover exact pedal photo
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: |
          NEEDS_PHOTO=$(python - <<'PY'
          import json
          d=json.load(open('.prp1-target.json', encoding='utf-8'))
          print('yes' if d.get('needs_photo') else 'no')
          PY
          )
          if [ "$NEEDS_PHOTO" = "yes" ]; then
            BUILDER=$(python - <<'PY'
          import json
          d=json.load(open('.prp1-target.json', encoding='utf-8'))
          print(d['builder'])
          PY
            )
            PEDAL=$(python - <<'PY'
          import json
          d=json.load(open('.prp1-target.json', encoding='utf-8'))
          print(d['pedal'])
          PY
            )
            PHOTO_BROWSER_TARGET_BUILDER="$BUILDER" PHOTO_BROWSER_TARGET_PEDAL="$PEDAL" PHOTO_BROWSER_DEEP_REVIEW=true node scripts/browser-photo-cache.mjs
          else
            echo "Exact local photo already exists for the PRP1 target."
          fi

      - name: Convert and synchronize the exact photo
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: |
          BUILDER=$(python - <<'PY'
          import json
          d=json.load(open('.prp1-target.json', encoding='utf-8'))
          print(d['builder'])
          PY
          )
          PEDAL=$(python - <<'PY'
          import json
          d=json.load(open('.prp1-target.json', encoding='utf-8'))
          print(d['pedal'])
          PY
          )
          PHOTO_CACHE_TARGET_BUILDER="$BUILDER" PHOTO_CACHE_TARGET_PEDAL="$PEDAL" python scripts/cache-pedal-images.py

      - name: Require exact local photo for PRP1 target
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          target = json.loads(Path(".prp1-target.json").read_text(encoding="utf-8"))
          catalog = json.loads(Path("research/PEDAL_INDEX.json").read_text(encoding="utf-8"))
          key = (target["builder"], target["pedal"])
          matches = [
              x for x in catalog.get("pedals", [])
              if (x.get("company"), x.get("pedal")) == key
          ]
          if len(matches) != 1:
              raise SystemExit(f"PRP1 target missing or duplicated in catalog: {key}")

          image = str(matches[0].get("image") or "")
          local_path = Path(image[2:] if image.startswith("./") else image)
          if (
              not image
              or image.lower().startswith(("http://", "https://"))
              or not local_path.is_file()
          ):
              raise SystemExit(f"PRP1 target still lacks exact local photo: {key} -> {image}")

          print(f"PRP1 target photo confirmed: {key} -> {local_path}")
          PY

      - name: Capture PRP1 target photo provenance
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          target = json.loads(Path(".prp1-target.json").read_text(encoding="utf-8"))
          catalog = json.loads(Path("research/PEDAL_INDEX.json").read_text(encoding="utf-8"))
          item = next(
              x for x in catalog.get("pedals", [])
              if x.get("company") == target["builder"] and x.get("pedal") == target["pedal"]
          )
          target["image"] = item.get("image")
          target["image_source_url"] = item.get("image_source_url")
          target["image_source_page"] = item.get("image_source_page")
          target["image_source_urls"] = item.get("image_source_urls") or []
          Path(".prp1-target.json").write_text(
              json.dumps(target, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Rebase atomic PRP1 work onto latest main
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: |
          # Keep the research record, recovered asset, intake state, and target
          # photo provenance while rebuilding shared generated files from the
          # newest main. This prevents a simultaneous photo-cache commit from
          # being overwritten by PRP1.
          git stash push -u -m "prp1-atomic-work" -- assets/pedals research/pedals research/PRP1_INTAKE
          git restore -- research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv research/PHOTO_BACKLOG.csv
          git fetch origin main
          git rebase origin/main
          git stash pop

          python - <<'PY'
          import json
          from pathlib import Path

          target = json.loads(Path(".prp1-target.json").read_text(encoding="utf-8"))
          catalog = json.loads(Path("research/PEDAL_INDEX.json").read_text(encoding="utf-8"))
          matches = [
              x for x in catalog.get("pedals", [])
              if x.get("company") == target["builder"] and x.get("pedal") == target["pedal"]
          ]
          if len(matches) != 1:
              raise SystemExit(f"PRP1 target missing or duplicated after rebase: {target['builder']} / {target['pedal']}")
          item = matches[0]
          if target.get("image"):
              item["image"] = target["image"]
          if target.get("image_source_url"):
              item["image_source_url"] = target["image_source_url"]
          if target.get("image_source_page"):
              item["image_source_page"] = target["image_source_page"]
          if target.get("image_source_urls"):
              item["image_source_urls"] = target["image_source_urls"]
          Path("research/PEDAL_INDEX.json").write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

          BUILDER=$(python - <<'PY'
          import json
          print(json.load(open('.prp1-target.json', encoding='utf-8'))['builder'])
          PY
          )
          PEDAL=$(python - <<'PY'
          import json
          print(json.load(open('.prp1-target.json', encoding='utf-8'))['pedal'])
          PY
          )
          PHOTO_CACHE_TARGET_BUILDER="$BUILDER" PHOTO_CACHE_TARGET_PEDAL="$PEDAL" python scripts/cache-pedal-images.py
          python scripts/sync_prp_catalog.py
          python scripts/sync-prp-tracker.py
          python scripts/sync-photo-backlog.py
          python scripts/prune-photo-review-queue.py
          python scripts/refresh-image-cache-report.py
      - name: Reconcile tracker and finalize atomic record
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: python scripts/prp1-finalize-intake.py

      - name: Verify published PRP1 target
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          catalog = json.loads(Path("research/PEDAL_INDEX.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("research/pedals/PEDAL_IMAGES.json").read_text(encoding="utf-8"))
          tracker = list(csv.DictReader(Path("research/PRP_TRACKER.csv").open(newline="", encoding="utf-8")))
          index = {(x.get("company"), x.get("pedal")): x for x in catalog.get("pedals", [])}
          images = {(x.get("builder"), x.get("pedal")): x for x in manifest}

          assert len(index) == len(catalog.get("pedals", [])), "Duplicate catalog identity"
          assert len(images) == len(manifest), "Duplicate image-manifest identity"
          assert len(tracker) == len(index), "Tracker/catalog row count mismatch"

          researched = pictured = complete = 0
          for row in tracker:
              key = (row.get("Builder"), row.get("Pedal"))
              item = index[key]
              image = images[key]
              info_done = bool(item.get("research_record"))
              image_value = str(item.get("image") or "")
              local_image = Path(image_value[2:] if image_value.startswith("./") else image_value)
              picture_done = bool(image_value) and not image_value.lower().startswith(("http://", "https://")) and local_image.is_file()
              complete_done = info_done and picture_done
              assert (row.get("Pedal Info") == "DONE") == info_done, f"Pedal Info mismatch: {key}"
              assert (row.get("Picture") == "DONE") == picture_done, f"Picture mismatch: {key}"
              assert (row.get("PRP Complete") == "DONE") == complete_done, f"Completion mismatch: {key}"
              assert (image.get("image") or None) == (item.get("image") or None), f"Image mismatch: {key}"
              researched += info_done
              pictured += picture_done
              complete += complete_done

          print(f"PRP1 atomic verification: {len(index)} total / {researched} researched / {pictured} pictured / {complete} complete.")
          PY

      - name: Commit and push one complete PRP1 unit
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pedals research/pedals research/PRP1_INTAKE research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv research/PHOTO_BACKLOG.csv index.html pedal-detail.html
          if git diff --cached --quiet; then
            echo "No PRP1 atomic changes to publish."
            exit 0
          fi
          git commit -m "PRP1: publish researched pedal with exact photo"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "PRP1 push race detected; rebasing atomic unit (attempt $attempt/5)."
            git fetch origin main
            # The PRP1 unit is already committed. Rebase that commit directly
            # instead of resetting/stashing generated files and ephemeral targets.
            git rebase origin/main
          done
          echo "Unable to publish the PRP1 unit after 5 push attempts."
          exit 1
