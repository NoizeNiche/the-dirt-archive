name: PRP1 Atomic Intake

on:
  workflow_run:
    workflows: ["Cache pedal images"]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - "research/PRP1_INTAKE/*.json"
      - "research/PRP1_KICK"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dirt-prp1-atomic
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refresh tracker from canonical catalog
        run: python scripts/sync-prp-tracker.py

      - name: Verify photo state before PRP1 gate
        run: python scripts/verify-photo-state.py

      - name: Open PRP1 lane
        id: photo_gate
        run: |
          echo "complete=true" >> "$GITHUB_OUTPUT"
          echo "PRP1 global photo catch-up gate is open. Each target still requires an exact photo attempt before finalization."

      - name: Check PRP1 intake queue
        id: intake_gate
        if: steps.photo_gate.outputs.complete == 'true'
        run: |
          if find research/PRP1_INTAKE -maxdepth 1 -type f -name '*.json' -print -quit | grep -q .; then
            echo "has_target=true" >> "$GITHUB_OUTPUT"
            echo "A PRP1 intake package is ready."
          else
            echo "has_target=false" >> "$GITHUB_OUTPUT"
            echo "No PRP1 intake package is currently queued."
          fi

      - name: Cache PRP1 browser
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        id: playwright_cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: prp1-playwright-1.63.0-${{ runner.os }}

      - name: Install tooling
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: |
          python -m pip install --disable-pip-version-check pillow
          npm install --no-save playwright@1.63.0
          if [ "${{ steps.playwright_cache.outputs.cache-hit }}" = "true" ]; then
            echo "Playwright 1.63.0 browser cache restored."
          else
            npx playwright install --with-deps chromium
          fi

      - name: Prepare next PRP1 intake
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: python scripts/prp1-atomic-intake.py

      - name: Synchronize researched record wiring
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: python scripts/sync_prp_catalog.py

      - name: Recover exact pedal photo
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: |
          NEEDS_PHOTO=$(python - <<'PY'
          import json
          d=json.load(open('.prp1-target.json', encoding='utf-8'))
          print('yes' if d.get('needs_photo') else 'no')
          PY
          )
          if [ "$NEEDS_PHOTO" = "yes" ]; then
            BUILDER=$(python - <<'PY'
          import json
          d=json.load(open('.prp1-target.json', encoding='utf-8'))
          print(d['builder'])
          PY
            )
            PEDAL=$(python - <<'PY'
          import json
          d=json.load(open('.prp1-target.json', encoding='utf-8'))
          print(d['pedal'])
          PY
            )
            PHOTO_BROWSER_TARGET_BUILDER="$BUILDER" PHOTO_BROWSER_TARGET_PEDAL="$PEDAL" node scripts/browser-photo-cache.mjs
          else
            echo "Exact local photo already exists for the PRP1 target."
          fi

      - name: Convert and synchronize the exact photo
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: |
          BUILDER=$(python - <<'PY'
          import json
          d=json.load(open('.prp1-target.json', encoding='utf-8'))
          print(d['builder'])
          PY
          )
          PEDAL=$(python - <<'PY'
          import json
          d=json.load(open('.prp1-target.json', encoding='utf-8'))
          print(d['pedal'])
          PY
          )
          PHOTO_CACHE_TARGET_BUILDER="$BUILDER" PHOTO_CACHE_TARGET_PEDAL="$PEDAL" python scripts/cache-pedal-images.py

      - name: Require exact local photo for PRP1 target
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          target = json.loads(Path(".prp1-target.json").read_text(encoding="utf-8"))
          catalog = json.loads(Path("research/PEDAL_INDEX.json").read_text(encoding="utf-8"))
          key = (target["builder"], target["pedal"])
          matches = [
              x for x in catalog.get("pedals", [])
              if (x.get("company"), x.get("pedal")) == key
          ]
          if len(matches) != 1:
              raise SystemExit(f"PRP1 target missing or duplicated in catalog: {key}")

          image = str(matches[0].get("image") or "")
          local_path = Path(image[2:] if image.startswith("./") else image)
          if (
              not image
              or image.lower().startswith(("http://", "https://"))
              or not local_path.is_file()
          ):
              raise SystemExit(f"PRP1 target still lacks exact local photo: {key} -> {image}")

          print(f"PRP1 target photo confirmed: {key} -> {local_path}")
          PY

      - name: Reconcile tracker and finalize atomic record
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: python scripts/prp1-finalize-intake.py

      - name: Verify published PRP1 target
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          catalog = json.loads(Path("research/PEDAL_INDEX.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("research/pedals/PEDAL_IMAGES.json").read_text(encoding="utf-8"))
          tracker = list(csv.DictReader(Path("research/PRP_TRACKER.csv").open(newline="", encoding="utf-8")))
          index = {(x.get("company"), x.get("pedal")): x for x in catalog.get("pedals", [])}
          images = {(x.get("builder"), x.get("pedal")): x for x in manifest}

          assert len(index) == len(catalog.get("pedals", [])), "Duplicate catalog identity"
          assert len(images) == len(manifest), "Duplicate image-manifest identity"
          assert len(tracker) == len(index), "Tracker/catalog row count mismatch"

          researched = pictured = complete = 0
          for row in tracker:
              key = (row.get("Builder"), row.get("Pedal"))
              item = index[key]
              image = images[key]
              info_done = bool(item.get("research_record"))
              image_value = str(item.get("image") or "")
              local_image = Path(image_value[2:] if image_value.startswith("./") else image_value)
              picture_done = bool(image_value) and not image_value.lower().startswith(("http://", "https://")) and local_image.is_file()
              complete_done = info_done and picture_done
              assert (row.get("Pedal Info") == "DONE") == info_done, f"Pedal Info mismatch: {key}"
              assert (row.get("Picture") == "DONE") == picture_done, f"Picture mismatch: {key}"
              assert (row.get("PRP Complete") == "DONE") == complete_done, f"Completion mismatch: {key}"
              assert (image.get("image") or None) == (item.get("image") or None), f"Image mismatch: {key}"
              researched += info_done
              pictured += picture_done
              complete += complete_done

          print(f"PRP1 atomic verification: {len(index)} total / {researched} researched / {pictured} pictured / {complete} complete.")
          PY

      - name: Rebase atomic PRP1 work onto latest main
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: |
          # Keep the research record, recovered asset, and intake state while
          # rebuilding shared generated files from the newest main. This prevents
          # a simultaneous photo-cache commit from being overwritten by PRP1.
          git stash push -u -m "prp1-atomic-work" -- assets/pedals research/pedals research/PRP1_INTAKE
          git restore -- research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv research/PHOTO_BACKLOG.csv
          git fetch origin main
          git rebase origin/main
          git stash pop

      - name: Commit and push one complete PRP1 unit
        if: steps.photo_gate.outputs.complete == 'true' && steps.intake_gate.outputs.has_target == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pedals research/PRP1_INTAKE research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/IMAGE_CACHE_REPORT.md index.html pedal-detail.html
          if git diff --cached --quiet; then
            echo "No PRP1 atomic changes to publish."
            exit 0
          fi
          git commit -m "PRP1: publish researched pedal with exact photo"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "PRP1 push race detected; rebasing atomic unit (attempt $attempt/5)."
            git fetch origin main
            # The PRP1 unit is already committed. Rebase that commit directly
            # instead of resetting/stashing generated files and ephemeral targets.
            git rebase origin/main
          done
          echo "Unable to publish the PRP1 unit after 5 push attempts."
          exit 1
