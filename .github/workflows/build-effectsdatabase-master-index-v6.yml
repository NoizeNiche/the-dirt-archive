name: Build complete Effects Database pedal-name index v6

on:
  push:
    paths:
      - '.github/workflows/build-effectsdatabase-master-index-v6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade requests python-docx
      - name: Harvest every Effects Database pedal page
        run: |
          cat > /tmp/build.py <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from collections import OrderedDict
          from pathlib import Path
          import re,time,requests,zipfile
          from docx import Document
          from docx.shared import Pt,Inches
          from docx.enum.text import WD_ALIGN_PARAGRAPH

          C=OrderedDict([
            ('Overdrive',('https://www.effectsdatabase.com/type/overdrive/pedal',53,5365)),
            ('Distortion',('https://www.effectsdatabase.com/type/distortion/pedal',33,3390)),
            ('Fuzz',('https://www.effectsdatabase.com/type/fuzz/pedal',41,4126)),
          ])
          OUT=Path('/tmp/out'); OUT.mkdir()

          def parse(text):
              rows=[]
              for raw in text.splitlines():
                  line=' '.join(raw.strip().split())
                  if line.startswith('* 1') or line.startswith('* «') or line.startswith('* ‹') or line.startswith('* …'):
                      if rows: break
                      continue
                  m=re.match(r'^(\d+)\.\s+(.*)$',line)
                  if not m: continue
                  n=int(m.group(1)); rest=m.group(2).strip()
                  # Markdown display name comes before the first closing link marker.
                  if rest.startswith('[') and '](' in rest: name=rest[1:rest.find('](')]
                  else:
                      name=re.split(r'\s+https?://|\s+\(/model/',rest)[0]
                  name=name.strip()
                  if name: rows.append((n,name))
              if not rows: raise ValueError('no numbered product rows')
              nums=[n for n,_ in rows]
              if nums!=list(range(nums[0],nums[0]+len(rows))): raise ValueError(f'bad numbering {nums[:4]} {nums[-4:]}')
              return rows

          def fetch_page(cat,base,p):
              url=base if p==0 else f'{base}?page={p}'
              last=None
              for attempt in range(6):
                  try:
                      r=requests.post('https://r.jina.ai/',data={'url':url},timeout=(8,60),headers={'User-Agent':'The-Dirt-Archive/6.0','Accept':'text/markdown,text/plain,*/*'})
                      if r.status_code==200 and r.text:
                          try:
                              rows=parse(r.text)
                              print(f'{cat} page {p}: {len(rows)}',flush=True)
                              return p,rows
                          except Exception as e: last=e
                      else: last=RuntimeError(f'HTTP {r.status_code}')
                  except Exception as e: last=e
                  time.sleep(min(8,2**attempt))
              raise RuntimeError(f'{cat} page {p} failed: {last}')

          jobs=[]
          for cat,(base,last,expected) in C.items():
              jobs += [(cat,base,p,expected) for p in range(last+1)]
          pages={cat:{} for cat in C}
          with ThreadPoolExecutor(max_workers=12) as ex:
              futs=[ex.submit(fetch_page,cat,base,p) for cat,base,p,_ in jobs]
              for f in as_completed(futs):
                  # category and page recovered from the future's result only page, so infer category by expected page key later is unsafe.
                  # Instead rerun mapping through a wrapper below.
                  p,rows=f.result()
                  raise RuntimeError('internal mapping guard')
          PY
          cat > /tmp/build_final.py <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from collections import OrderedDict
          from pathlib import Path
          import re,time,requests,zipfile
          from docx import Document
          from docx.shared import Pt, Inches
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          C=OrderedDict([
            ('Overdrive',('https://www.effectsdatabase.com/type/overdrive/pedal',53,5365)),
            ('Distortion',('https://www.effectsdatabase.com/type/distortion/pedal',33,3390)),
            ('Fuzz',('https://www.effectsdatabase.com/type/fuzz/pedal',41,4126)),
          ])
          OUT=Path('/tmp/out_final'); OUT.mkdir()
          def parse(text):
            rows=[]
            for raw in text.splitlines():
              line=' '.join(raw.strip().split())
              if re.match(r'^\*\s+(?:1|«|‹|…)',line):
                if rows: break
                continue
              m=re.match(r'^(\d+)\.\s+(.*)$',line)
              if not m: continue
              n=int(m.group(1)); rest=m.group(2).strip()
              name=rest[1:rest.find('](')] if rest.startswith('[') and '](' in rest else rest
              if name.strip(): rows.append((n,name.strip()))
            if not rows: raise ValueError('no rows')
            nums=[n for n,_ in rows]
            if nums != list(range(nums[0],nums[0]+len(rows))): raise ValueError('bad numbering')
            return rows
          def fetch(cat,base,p):
            url=base if p==0 else f'{base}?page={p}'
            last=None
            for a in range(6):
              try:
                r=requests.post('https://r.jina.ai/',data={'url':url},timeout=(8,60),headers={'User-Agent':'The-Dirt-Archive/6.0','Accept':'text/markdown,text/plain,*/*'})
                if r.status_code==200 and r.text:
                  try: rows=parse(r.text); print(cat,p,len(rows),flush=True); return cat,p,rows
                  except Exception as e: last=e
                else: last=RuntimeError(f'HTTP {r.status_code}')
              except Exception as e: last=e
              time.sleep(min(8,2**a))
            raise RuntimeError(f'{cat} page {p}: {last}')
          pages={cat:{} for cat in C}
          tasklist=[(cat,base,p) for cat,(base,last,expected) in C.items() for p in range(last+1)]
          with ThreadPoolExecutor(max_workers=12) as ex:
            futs=[ex.submit(fetch,cat,base,p) for cat,base,p in tasklist]
            for f in as_completed(futs):
              cat,p,rows=f.result(); pages[cat][p]=rows
          data=OrderedDict()
          for cat,(base,last,expected) in C.items():
            recs=[x for p in range(last+1) for x in pages[cat][p]]
            nums=[n for n,_ in recs]
            if nums != list(range(1,expected+1)): raise RuntimeError(f'{cat}: {len(recs)} vs {expected}; final={nums[-1] if nums else None}')
            data[cat]=[name for _,name in recs]
            (OUT/f'{cat.lower()}.txt').write_text('\n'.join(data[cat])+'\n',encoding='utf-8')
          total=sum(len(v) for v in data.values())
          if total != 12881: raise RuntimeError(f'TOTAL {total}')
          doc=Document(); s=doc.sections[0]; s.top_margin=s.bottom_margin=Inches(.45); s.left_margin=s.right_margin=Inches(.55)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER; r=p.add_run('EFFECTS DATABASE MASTER DIRT PEDAL INDEX'); r.bold=True; r.font.size=Pt(20)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER; p.add_run('Complete Overdrive / Distortion / Fuzz pedal names').italic=True
          doc.add_paragraph('Source: Effects Database (effectsdatabase.com)')
          doc.add_paragraph('Extraction date: September 16, 2026')
          doc.add_page_break(); doc.add_heading('MASTER COUNTS',1)
          for cat,names in data.items(): doc.add_paragraph(f'{cat}: {len(names):,}')
          doc.add_paragraph(f'TOTAL: {total:,}')
          for cat,names in data.items():
            doc.add_page_break(); doc.add_heading(cat.upper(),1)
            for i,name in enumerate(names,1):
              p=doc.add_paragraph(); p.paragraph_format.space_after=Pt(0); p.add_run(f'{i}. ').bold=True; p.add_run(name)
          path=OUT/'effectsdatabase-master-dirt-pedal-index.docx'; doc.save(path)
          with zipfile.ZipFile(path) as z: assert z.testzip() is None
          print('VERIFIED', {k:len(v) for k,v in data.items()}, total)
          PY
          python /tmp/build_final.py
      - uses: actions/upload-artifact@v4
        with:
          name: effects-database-master-dirt-pedal-index-v6
          path: /tmp/out_final/
          retention-days: 30
