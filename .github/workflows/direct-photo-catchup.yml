name: Curated direct photo catch-up

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - research/PHOTO_DIRECT_IMAGE_OVERRIDES.csv
      - scripts/cache-curated-direct-photos.py
      - scripts/apply-photo-source-overrides.py
      - scripts/cache-pedal-images.py
      - scripts/merge-photo-recovery-results.py
      - scripts/verify-photo-recovery-batch.py
      - scripts/verify-photo-state.py

permissions:
  contents: write
  actions: write

concurrency:
  group: dirt-direct-photo-recovery-v1
  cancel-in-progress: false

jobs:
  recover:
    name: Publish curated direct photos
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rehydrate latest main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply exact source leads
        run: python scripts/apply-photo-source-overrides.py

      - name: Recover curated direct photos
        run: python scripts/cache-curated-direct-photos.py

      - name: Package direct recoveries
        shell: bash
        run: |
          rm -rf recovery-artifacts
          mkdir -p recovery-artifacts/direct
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          root = Path(".")
          manifest = root / "photo-recovery-direct-results.json"
          if not manifest.is_file():
              print("No direct recovery manifest produced.")
              raise SystemExit(0)

          data = json.loads(manifest.read_text(encoding="utf-8"))
          rows = data.get("recovered") or []
          packaged = 0

          for row in rows:
              image = str(row.get("image") or "").strip()
              if not image:
                  continue
              image_path = Path(image.lstrip("./"))
              source_path = (root / image_path).with_suffix(".source")
              if not source_path.is_file():
                  print(f"Skipping missing direct source: {row.get('builder')} / {row.get('pedal')}")
                  continue

              dest = Path("recovery-artifacts/direct") / image_path.with_suffix(".source")
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source_path, dest)

              result = dict(row)
              result["imageFile"] = "./" + image_path.with_suffix(".source").as_posix()
              result_dir = Path("recovery-artifacts/direct")
              (result_dir / "photo-recovery-result.json").write_text(
                  json.dumps(result, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              packaged += 1

          print(f"Packaged {packaged} direct photo recoveries from {len(rows)} manifest rows.")
          PY

      - name: Verify and merge direct recoveries
        run: |
          python scripts/reset-photo-recovery-targets.py
          python scripts/verify-photo-recovery-batch.py
          python scripts/merge-photo-recovery-results.py
          python scripts/cache-pedal-images.py
          python scripts/sync-prp-tracker.py
          python scripts/build-research-queue.py
          python scripts/sync-photo-backlog.py
          python scripts/prune-photo-review-queue.py
          python scripts/refresh-image-cache-report.py
          python scripts/verify-photo-state.py

      - name: Publish moved photos
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git add assets/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv research/PHOTO_BACKLOG.csv

            if git diff --cached --quiet; then
              echo "No new curated direct photo movement to publish."
              exit 0
            fi

            git commit -m "Archive curated direct pedal photos"

            if timeout 30s env GIT_TERMINAL_PROMPT=0 git push origin main; then
              published_sha="$(git rev-parse HEAD)"
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/dispatches" -f ref=main || true
              echo "Published curated photo batch $published_sha."
              exit 0
            fi

            echo "Push race on attempt $attempt/5; rehydrating latest main."
            git fetch origin main
            git reset --hard origin/main
            if [ -f photo-recovery-direct-results.json ]; then
              python scripts/merge-photo-recovery-results.py
              python scripts/cache-pedal-images.py
              python scripts/sync-prp-tracker.py
              python scripts/build-research-queue.py
              python scripts/sync-photo-backlog.py
              python scripts/prune-photo-review-queue.py
              python scripts/refresh-image-cache-report.py
              python scripts/verify-photo-state.py
            else
              echo "Direct recovery manifest is no longer present after rehydration."
              exit 0
            fi
          done

          exit 1
