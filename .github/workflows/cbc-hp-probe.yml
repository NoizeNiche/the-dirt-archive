name: CBC Harmonic Percolator probe

on:
  push:
    paths:
      - .github/workflows/cbc-hp-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Search exact CBC Harmonic Percolator
        shell: bash
        run: |
          python - <<'PY'
          import html, json, re, subprocess, urllib.parse
          queries = [
            'CBC Pedals "Harmonic Percolator" pedal',
            '"CBC Pedals Harmonic Percolator"',
            'site:equipboard.com/items "CBC Pedals" "Harmonic Percolator"',
            'site:reverb.com "CBC Pedals" "Harmonic Percolator"',
            'site:instagram.com "CBC Pedals" "Harmonic Percolator"'
          ]
          def curl(url):
            p = subprocess.run([
              "curl","-L","--silent","--show-error","--compressed",
              "--connect-timeout","4","--max-time","8",
              "-A","Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36",
              url
            ], capture_output=True, text=True, timeout=12)
            return p.stdout
          for q in queries:
            url = "https://www.bing.com/search?q="+urllib.parse.quote(q)
            raw = curl(url)
            print("\nQUERY:", q)
            for m in re.finditer(r'<li class="b_algo"[\s\S]{0,7000}?</li>', raw, re.I):
              block = html.unescape(m.group(0))
              a = re.search(r'<h2[^>]*>\s*<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', block, re.I|re.S)
              if not a: continue
              href=a.group(1)
              title=re.sub(r'<[^>]+>',' ',a.group(2))
              title=' '.join(title.split())
              text=re.sub(r'<[^>]+>',' ',block)
              text=' '.join(html.unescape(text).split())
              print("RESULT:", title, "|", href)
              print("SNIP:", text[:700])
          print("\nIMAGE SEARCH")
          for q in queries[:3]:
            url = "https://www.bing.com/images/search?form=HDRSC2&q="+urllib.parse.quote(q)
            raw = curl(url)
            print("\nIMAGE QUERY:", q, "bytes=", len(raw))
            seen=set()
            for match in re.finditer(r'(?:\bm|data-m)=["\']([^"\']+)["\']', raw, re.I):
              try:
                obj=json.loads(html.unescape(match.group(1)))
              except Exception:
                continue
              murl=obj.get("murl"); purl=obj.get("purl"); title=obj.get("t","")
              if not murl or murl in seen: continue
              seen.add(murl)
              print("IMAGE:", title, "|", murl, "| SOURCE:", purl)
              if len(seen)>=20: break
          print("\nGOOGLE + DUCKDUCKGO EXACT SEARCH")
          more_queries = [
            '"Harmonic Percolator" "CBC Pedals"',
            '"CBC Pedals" Percolator',
            '"CBC Pedals" fuzz pedal percolator',
            '"CBC" "Harmonic Percolator" pedal builder',
            'site:equipboard.com "Harmonic Percolator" pedal CBC',
            'site:reverb.com "Harmonic Percolator" CBC pedal'
          ]
          for q in more_queries:
            for engine, base in [
              ("GOOGLE","https://www.google.com/search?q="),
              ("DDG","https://html.duckduckgo.com/html/?q=")
            ]:
              raw=curl(base+urllib.parse.quote(q))
              print("\nENGINE:",engine,"QUERY:",q,"BYTES:",len(raw))
              links=[]
              for mm in re.finditer(r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>', raw, re.I|re.S):
                href=html.unescape(mm.group(1))
                title=re.sub(r'<[^>]+>',' ',html.unescape(mm.group(2)))
                title=' '.join(title.split())
                if not href.startswith('http'): continue
                if any(host in href for host in ['google.com','duckduckgo.com','gstatic.com']): continue
                links.append((title[:180],href))
              seen=set()
              for title,href in links:
                if href in seen: continue
                seen.add(href)
                print("RESULT:",title,"|",href)
                if len(seen)>=20: break

          print("\nEMBEDDED URL HARVEST")
          harvest_queries = [
            '"Harmonic Percolator" "CBC Pedals"',
            '"CBC Pedals" Percolator',
            '"CBC Pedals" fuzz pedal',
            'CBC pedals harmonic percolator clone'
          ]
          for q in harvest_queries:
            for engine, base in [
              ("GOOGLE","https://www.google.com/search?q="),
              ("DDG","https://html.duckduckgo.com/html/?q=")
            ]:
              raw=html.unescape(curl(base+urllib.parse.quote(q))).replace('\\/','/')
              urls=set()
              for mm in re.finditer(r'https?://[^"\\s<>\\\\]+', raw, re.I):
                u=urllib.parse.unquote(mm.group(0))
                if any(x in u.lower() for x in [
                  'equipboard.com','reverb.com','effectsdatabase.com',
                  'guitarpedalx.com','guitargearfinder.com','thegearpage.net',
                  'facebook.com','instagram.com','youtube.com','googleusercontent.com'
                ]):
                  urls.add(u.rstrip('),.;'))
              print("\nENGINE:",engine,"QUERY:",q,"URLS:",len(urls))
              for u in list(urls)[:40]:
                print("URL:",u)

          print("\nJINA TEXT SEARCH")
          jina_queries = [
            '"CBC Pedals" "Harmonic Percolator"',
            '"CBC Pedals" Percolator',
            '"CBC Pedals" "Harmonic"',
            '"CBC Pedals" fuzz',
            '"Harmonic Percolator" "CBC" pedal'
          ]
          for q in jina_queries:
            target = "https://r.jina.ai/http://www.google.com/search?q=" + urllib.parse.quote(q)
            raw = curl(target)
            print("\nJINA QUERY:",q,"BYTES:",len(raw))
            print(raw[:12000])
          
          print("\nDIRECT SLUG PROBES")
          slugs = [
            "https://equipboard.com/items/cbc-pedals-harmonic-percolator",
            "https://equipboard.com/items/cbc-pedals-harmonic-percolator-fuzz",
            "https://reverb.com/marketplace?query=CBC%20Pedals%20Harmonic%20Percolator"
          ]
          for u in slugs:
            raw=curl(u)
            title=""
            m=re.search(r'<title[^>]*>(.*?)</title>', raw, re.I|re.S)
            if m: title=' '.join(re.sub(r'<[^>]+>',' ',html.unescape(m.group(1))).split())
            print("PROBE:",u,"STATUS_BYTES:",len(raw),"TITLE:",title)
            for pat in [r'<meta[^>]+(?:property|name)=["\'](?:og:image|twitter:image)["\'][^>]+content=["\']([^"\']+)["\']',
                        r'<img[^>]+(?:alt=["\'][^"\']*Harmonic Percolator[^"\']*["\']|src=["\'][^"\']*harmonic[^"\']*["\'])[^>]+>']:
              for mm in re.finditer(pat, raw, re.I|re.S):
                print("ASSET:", mm.group(1) if mm.lastindex else mm.group(0)[:500])
          PY
