name: Emergency photo catch-up

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths:
      - research/PHOTO_EMERGENCY_KICK

permissions:
  contents: write
  actions: write

concurrency:
  group: dirt-photo-emergency-v1
  cancel-in-progress: true

jobs:
  recover:
    name: Recover unresolved researched photos
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rehydrate latest main
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install browser tooling
        run: |
          python -m pip install --disable-pip-version-check pillow
          npm install --no-save playwright@1.63.0

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: photo-emergency-playwright-${{ runner.os }}-1.63.0
          restore-keys: |
            photo-emergency-playwright-${{ runner.os }}-

      - name: Ensure Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Apply curated exact photo leads
        run: python scripts/apply-photo-source-overrides.py

      - name: Recover a bounded photo batch
        env:
          PHOTO_BROWSER_IMAGE_SEARCH: "true"
          PHOTO_BROWSER_DEEP_REVIEW: "true"
          PHOTO_BROWSER_ALLOW_PARKED_RETRY: "true"
          PHOTO_BROWSER_REVISIT_PARKED: "true"
          PHOTO_BROWSER_CACHE_LIMIT: "30"
          PHOTO_BROWSER_CACHE_CONCURRENCY: "20"
          PHOTO_BROWSER_PAGE_TIMEOUT_MS: "9000"
          PHOTO_BROWSER_SEARCH_TIMEOUT_MS: "7000"
          PHOTO_BROWSER_IMAGE_TIMEOUT_MS: "7000"
          PHOTO_BROWSER_CANDIDATE_LIMIT: "8"
          PHOTO_BROWSER_SEARCH_VERIFY_LIMIT: "8"
          PHOTO_BROWSER_RECOVERY_DEADLINE_MS: "30000"
          PHOTO_BROWSER_FRESH_RECOVERY_DEADLINE_MS: "30000"
          PHOTO_BROWSER_MAX_RECOVERY_ATTEMPTS: "5"
          PHOTO_BROWSER_MAX_DEEP_REVIEW_CYCLES: "2"
        run: node scripts/browser-photo-cache.mjs

      - name: Convert recovered images and synchronize state
        run: |
          python scripts/cache-pedal-images.py
          python scripts/sync-prp-tracker.py
          python scripts/sync-photo-backlog.py
          python scripts/prune-photo-review-queue.py
          python scripts/build-research-queue.py
          python scripts/refresh-image-cache-report.py
          python scripts/verify-photo-state.py
          python scripts/validate-archive.py

      - name: Publish recovered photos
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --cached --quiet; then
            echo "No recovered photo changes were produced."
            exit 0
          fi

          git add assets/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv research/PHOTO_BACKLOG.csv

          if git diff --cached --quiet; then
            echo "No canonical photo changes to publish."
            exit 0
          fi

          git commit -m "Archive emergency verified pedal photos"

          resolve_rebase() {
            for f in CURRENT_STATE.md research/RESEARCH_QUEUE.json research/PRP_TRACKER.csv research/PHOTO_BACKLOG.csv research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv; do
              if git ls-files -u -- "$f" | grep -q .; then
                git checkout --theirs -- "$f"
                git add "$f"
              fi
            done

            for f in research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json; do
              if git ls-files -u -- "$f" | grep -q .; then
                git checkout --ours -- "$f"
                git add "$f"
              fi
            done

            for f in $(git diff --name-only --diff-filter=U); do
              echo "Unresolved conflict in $f"
              exit 1
            done

            GIT_EDITOR=true git rebase --continue
          }

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Published emergency photo recovery."
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/dispatches" -f ref=main || true
              exit 0
            fi

            echo "Push race on attempt $attempt. Rebasing onto latest main."
            git fetch origin main
            if ! git rebase origin/main; then
              resolve_rebase
            fi

            python scripts/sync-prp-tracker.py
            python scripts/sync-photo-backlog.py
            python scripts/prune-photo-review-queue.py
            python scripts/build-research-queue.py
            python scripts/refresh-image-cache-report.py
            python scripts/verify-photo-state.py
            python scripts/validate-archive.py

            git add assets/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv research/PHOTO_BACKLOG.csv
            git commit --amend --no-edit
          done
          exit 1
