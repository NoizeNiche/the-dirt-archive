name: Restore FY-2 asset

on:
  workflow_dispatch:
  push:
    paths:
      - research/RESTORE_FY2_ASSET_KICK

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Restore exact FY-2 photo
        shell: bash
        run: |
          set -euo pipefail
          URL='https://files.effectsdatabase.com/gear/pics/companion_fy-2_001.jpg'
          mkdir -p /tmp/fy2
          curl -L --fail --silent --show-error --compressed             --connect-timeout 4 --max-time 12             -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36'             -H 'Accept: image/avif,image/webp,image/apng,image/jpeg,image/png,image/*,*/*;q=0.8'             -o /tmp/fy2/source.jpg "$URL"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          src = Path('/tmp/fy2/source.jpg')
          out = Path('assets/pedals/cbc-pedals/fy-2-companion/primary.webp')
          out.parent.mkdir(parents=True, exist_ok=True)
          with Image.open(src) as im:
              im.verify()
          with Image.open(src) as im:
              im = ImageOps.exif_transpose(im)
              if im.width < 140 or im.height < 140:
                  raise SystemExit(f'Image too small: {im.width}x{im.height}')
              im = im.convert('RGBA' if 'A' in im.getbands() else 'RGB')
              im.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
              im.save(out, 'WEBP', quality=88, method=6)
          print(f'Restored exact FY-2 photo: {out}')
          PY

      - name: Synchronize archive metadata
        run: |
          python scripts/sync_prp_catalog.py
          python scripts/sync-prp-tracker.py
          python scripts/sync-photo-backlog.py
          python scripts/prune-photo-review-queue.py
          python scripts/refresh-image-cache-report.py
          python scripts/verify-photo-state.py

      - name: Publish restored asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pedals/cbc-pedals/fy-2-companion/primary.webp research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/PHOTO_BACKLOG.csv research/PHOTO_REVIEW_QUEUE.csv research/IMAGE_CACHE_REPORT.md
          git commit -m "Restore FY-2 exact photo asset"
          git push
