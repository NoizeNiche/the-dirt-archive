name: Research content audit

on:
  push:
    paths:
      - 'research/pedals/**'
      - 'scripts/audit-research-content.py'
      - 'scripts/clean-research-content.py'
  workflow_dispatch:
  schedule:
    - cron: "43 7 * * 0"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Clean obvious research scrape residue
        run: python scripts/clean-research-content.py
      - name: Publish research cleanup
        run: |
          if git diff --quiet -- research/pedals; then
            echo "Research cleanup found no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pedals
          git commit -m "Clean research scrape residue"
          git push origin HEAD:main
      - name: Audit research prose
        run: python scripts/audit-research-content.py --output /tmp/research-content-audit.csv
      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: research-content-audit
          path: /tmp/research-content-audit.csv
          retention-days: 14
