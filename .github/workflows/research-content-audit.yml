name: Research content audit

on:
  workflow_dispatch:
  schedule:
    - cron: "43 7 * * 0"
permissions:
  contents: write
  actions: write

concurrency:
  group: dirt-research-content-audit-v2
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Clean obvious research scrape residue
        run: python scripts/clean-research-content.py
      - name: Publish research cleanup
        run: |
          if git diff --quiet -- research/pedals; then
            echo "Research cleanup found no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pedals
          git commit -m "Clean research scrape residue"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              git reset --soft origin/main
              git add research/pedals
              git commit -m "Clean research scrape residue"
            }
            if git push origin HEAD:main; then
              GH_TOKEN="${GH_TOKEN:-${{ github.token }}}" gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/dispatches" -f ref=main
              exit 0
            fi
            echo "Research cleanup push race on attempt $attempt; refreshing main."
            git reset --soft origin/main
            git add research/pedals
            git commit -m "Clean research scrape residue" || true
          done
          echo "Could not publish research cleanup after retries."
          exit 1
      - name: Audit research prose
        run: python scripts/audit-research-content.py --output /tmp/research-content-audit.csv
      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: research-content-audit
          path: /tmp/research-content-audit.csv
          retention-days: 14
