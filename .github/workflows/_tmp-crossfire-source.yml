name: Temporary Crossfire source capture

on:
  push:
    paths:
      - ".github/workflows/_tmp-crossfire-source.yml"

permissions:
  contents: read

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch exact Crossfire sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/crossfire
          urls=(
            "https://crazytubecircuits.com/crossfire"
            "https://www.guitarplayer.com/reviews/crazy-tube-circuits-crossfire-review"
            "https://www.guitarworld.com/news/crazy-tube-circuits-crossfire"
          )
          i=0
          for u in "${urls[@]}"; do
            curl -L --silent --show-error --fail --compressed \
              --connect-timeout 8 --max-time 20 \
              -A "Mozilla/5.0 The Dirt Archive source capture" \
              "$u" > "/tmp/crossfire/source-$i.html"
            i=$((i+1))
          done
          printf '%s\n' "${urls[@]}" > /tmp/crossfire/urls.txt
      - uses: actions/upload-artifact@v4
        with:
          name: crossfire-source-pages
          path: /tmp/crossfire/
          retention-days: 1
