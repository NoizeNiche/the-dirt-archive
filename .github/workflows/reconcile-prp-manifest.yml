name: Reconcile PRP research manifest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconcile research-record wiring only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('research/PEDAL_INDEX.json')
          manifest_path = Path('research/pedals/PEDAL_IMAGES.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          catalog_by_key = {
              (x.get('company'), x.get('pedal')): x
              for x in catalog.get('pedals', [])
          }
          manifest_by_key = {
              (x.get('builder'), x.get('pedal')): x
              for x in manifest
          }

          changed = False
          changed_count = 0
          for key, pedal in catalog_by_key.items():
              research_record = pedal.get('research_record')
              if not research_record:
                  continue
              entry = manifest_by_key.get(key)
              if entry is None:
                  manifest.append({
                      'builder': pedal.get('company'),
                      'pedal': pedal.get('pedal'),
                      'image': pedal.get('image'),
                      'source_page': pedal.get('source_page'),
                      'research_record': research_record,
                  })
                  changed = True
                  changed_count += 1
                  continue
              if entry.get('research_record') != research_record:
                  entry['research_record'] = research_record
                  changed = True
                  changed_count += 1

          if changed:
              manifest_path.write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              print(f'Reconciled {changed_count} research-record links in PEDAL_IMAGES.json without changing image data.')
          else:
              print('Research-record manifest already synchronized.')
          PY

      - name: Persist reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pedals/PEDAL_IMAGES.json
          if git diff --cached --quiet; then
            echo "No manifest reconciliation needed."
          else
            git commit -m "Archive verified pedal photos locally"
            git push
          fi
