name: Sync PRP tracker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Synchronize tracker from catalog
        run: python scripts/sync-prp-tracker.py

      - name: Synchronize photo backlog from tracker
        run: python scripts/sync-photo-backlog.py

      - name: Commit tracker and photo backlog changes
        run: |
          if git diff --quiet -- research/PRP_TRACKER.csv research/PHOTO_BACKLOG.csv; then
            echo "PRP tracker and photo backlog already match the catalog."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/PRP_TRACKER.csv research/PHOTO_BACKLOG.csv
          git commit -m "Sync PRP tracker and photo backlog with catalog state"
          git push
