name: Sync PRP tracker

on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: dirt-archive-publisher-v1
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Synchronize tracker from catalog
        run: python scripts/sync-prp-tracker.py

      - name: Synchronize photo backlog from tracker
        run: python scripts/sync-photo-backlog.py

      - name: Rebuild research phase queue from tracker
        run: python scripts/build-research-queue.py

      - name: Commit tracker, photo backlog, and queue changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            if git diff --quiet -- research/PRP_TRACKER.csv research/PHOTO_BACKLOG.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md; then
              echo "PRP tracker, photo backlog, queue, and state already match the catalog."
              exit 0
            fi

            git add research/PRP_TRACKER.csv research/PHOTO_BACKLOG.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md
            git commit -m "Sync PRP tracker and photo backlog with catalog state" || true

            if git push origin main; then
              exit 0
            fi

            echo "Tracker-state push race; rebuilding from newest main (attempt $attempt/5)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/sync-prp-tracker.py
            python scripts/sync-photo-backlog.py
            python scripts/build-research-queue.py
          done

          echo "Unable to publish synchronized tracker state after 5 rebuild attempts."
          exit 1
