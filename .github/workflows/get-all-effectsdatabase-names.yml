name: Get all Effects Database pedal names

on:
  push:
    paths:
      - '.github/workflows/get-all-effectsdatabase-names.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape complete Effects Database indexes
        run: |
          python - <<'PY'
          import html, re, time
          from pathlib import Path
          import requests

          cats = {
            'Overdrive': ('https://www.effectsdatabase.com/type/overdrive/pedal', 54, 5365),
            'Distortion': ('https://www.effectsdatabase.com/type/distortion/pedal', 34, 3390),
            'Fuzz': ('https://www.effectsdatabase.com/type/fuzz/pedal', 42, 4126),
          }
          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (compatible; DirtArchive/1.0)'})

          def fetch(target):
              proxy = 'https://r.jina.ai/http://' + target.split('://', 1)[1]
              for attempt in range(12):
                  r = session.get(proxy, timeout=45)
                  if r.status_code == 429:
                      retry = r.headers.get('Retry-After')
                      try:
                          delay = max(float(retry), 4.0)
                      except Exception:
                          delay = 8.0 + attempt
                      print(f'429 for {target}; sleeping {delay}s', flush=True)
                      time.sleep(delay)
                      continue
                  r.raise_for_status()
                  return r.text
              raise RuntimeError(f'rate limited after retries: {target}')

          def parse(text):
              rows = []
              for line in text.splitlines():
                  m = re.match(r'^\s*\d+\.\s+(.*)$', line)
                  if not m:
                      continue
                  rest = m.group(1).strip()
                  if rest.startswith('['):
                      end = rest.find('](')
                      if end > 1 and '/model/' in rest[end+2:]:
                          name = html.unescape(rest[1:end]).strip()
                          if name:
                              rows.append(name)
              return rows

          all_lines = []
          for cat, (base, pages, expected) in cats.items():
              cat_rows = []
              for page in range(pages):
                  target = base if page == 0 else f'{base}?page={page}'
                  print(f'GET {cat} page {page+1}/{pages}', flush=True)
                  text = fetch(target)
                  rows = parse(text)
                  print(f'  {len(rows)} names', flush=True)
                  if not rows:
                      raise RuntimeError(f'{cat}: no rows on page {page}')
                  cat_rows.extend(rows)
                  time.sleep(3.5)
              print(f'{cat}: extracted {len(cat_rows)} names; expected {expected}', flush=True)
              if len(cat_rows) != expected:
                  raise RuntimeError(f'{cat}: extracted {len(cat_rows)}, expected {expected}')
              all_lines += [f'## {cat}', ''] + cat_rows + ['']

          out = Path('effectsdatabase_pedal_names.txt')
          out.write_text('\n'.join(all_lines), encoding='utf-8')
          print(f'WROTE {out} ({out.stat().st_size} bytes)', flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: effectsdatabase-pedal-names
          path: effectsdatabase_pedal_names.txt
