name: Get all Effects Database pedal names

on:
  push:
    paths:
      - '.github/workflows/get-all-effectsdatabase-names.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape Effects Database
        run: |
          python - <<'PY'
          import html, re, time
          import requests
          from pathlib import Path

          cats = {
            'Overdrive': 'https://www.effectsdatabase.com/type/overdrive/pedal',
            'Distortion': 'https://www.effectsdatabase.com/type/distortion/pedal',
            'Fuzz': 'https://www.effectsdatabase.com/type/fuzz/pedal',
          }
          out = Path('effectsdatabase_pedal_names.txt')
          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0'})

          def get_page(target):
              proxy = 'https://r.jina.ai/http://' + target.split('://',1)[1]
              last = None
              for attempt in range(4):
                  try:
                      r = session.get(proxy, timeout=20)
                      r.raise_for_status()
                      return r.text
                  except Exception as e:
                      last = e
                      print('retry', attempt+1, target, repr(e), flush=True)
                      time.sleep(1 + attempt)
              raise last

          lines = []
          for cat, base in cats.items():
              lines += [f'## {cat}', '']
              page = 0
              seen = set()
              while True:
                  target = base if page == 0 else f'{base}?page={page}'
                  print('GET', target, flush=True)
                  text = get_page(target)
                  found = []
                  for m in re.finditer(r'^\s*\d+\.\s+\[([^\]]+)\]\([^\n]*?/model/[^\n]*?\)\s*$', text, re.M):
                      name = html.unescape(' '.join(m.group(1).split())).strip()
                      if name and name not in found:
                          found.append(name)
                  if not found:
                      for m in re.finditer(r'\[([^\]]+)\]\(https?://www\.effectsdatabase\.com/model/[^)]+\)', text):
                          name = html.unescape(' '.join(m.group(1).split())).strip()
                          if name and name not in found:
                              found.append(name)
                  new = [x for x in found if x not in seen]
                  print(f'{cat} page {page}: {len(found)} found, {len(new)} new', flush=True)
                  if not new:
                      break
                  seen.update(new)
                  lines.extend(new)
                  page += 1
                  if page > 200:
                      raise RuntimeError('pagination guard')
              print(f'{cat} TOTAL {len(seen)}', flush=True)
              lines.append('')
          out.write_text('\n'.join(lines), encoding='utf-8')
          print('WROTE', out, 'bytes', out.stat().st_size, flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: effectsdatabase-pedal-names
          path: effectsdatabase_pedal_names.txt
