name: Get all Effects Database pedal names

on:
  push:
    paths:
      - '.github/workflows/get-all-effectsdatabase-names.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape complete Effects Database indexes
        run: |
          python - <<'PY'
          import html, re, time
          from pathlib import Path
          import requests

          cats = {
            'Overdrive': ('https://www.effectsdatabase.com/type/overdrive/pedal', 54),
            'Distortion': ('https://www.effectsdatabase.com/type/distortion/pedal', 34),
            'Fuzz': ('https://www.effectsdatabase.com/type/fuzz/pedal', 42),
          }
          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (compatible; DirtArchive/1.0)'})

          def fetch(target):
              proxy = 'https://r.jina.ai/http://' + target.split('://', 1)[1]
              for attempt in range(12):
                  r = session.get(proxy, timeout=60)
                  if r.status_code == 429:
                      retry = r.headers.get('Retry-After')
                      try:
                          delay = max(float(retry), 4.0)
                      except Exception:
                          delay = 8.0 + attempt
                      print(f'429 for {target}; sleeping {delay}s', flush=True)
                      time.sleep(delay)
                      continue
                  r.raise_for_status()
                  return r.text
              raise RuntimeError(f'rate limited after retries: {target}')

          def strip_md(s):
              s = re.sub(r'\[([^\]]*)\]\([^)]*\)', r'\1', s)
              s = re.sub(r'!\[([^\]]*)\]\([^)]*\)', r'\1', s)
              return html.unescape(s).strip()

          def parse(text):
              rows = []
              in_catalog = False
              for raw in text.splitlines():
                  line = raw.strip()
                  if 'Gear in this category' in line:
                      in_catalog = True
                      continue
                  if in_catalog and re.match(r'^\*\s*(?:«\s*first|‹\s*previous|next\s*›|last)', line, re.I):
                      break
                  if in_catalog:
                      m = re.match(r'^\d+\.\s+(.+)$', line)
                      if m:
                          name = strip_md(m.group(1))
                          if name:
                              rows.append(name)
              return rows

          all_lines = []
          manifest = []
          for cat, (base, pages) in cats.items():
              cat_rows = []
              seen = set()
              for page in range(pages):
                  target = base if page == 0 else f'{base}?page={page}'
                  print(f'GET {cat} page {page+1}/{pages}', flush=True)
                  text = fetch(target)
                  rows = parse(text)
                  print(f'  {len(rows)} catalog rows', flush=True)
                  if not rows:
                      raise RuntimeError(f'{cat}: no catalog rows on page {page}')
                  cat_rows.extend(rows)
                  dupes = sum(1 for r in rows if r in seen)
                  for r in rows:
                      seen.add(r)
                  manifest.append(f'{cat}\t{page+1}\t{len(rows)}\t{dupes}')
                  time.sleep(3.5)
              unique = len(set(cat_rows))
              print(f'{cat}: extracted {len(cat_rows)} rows; unique names {unique}', flush=True)
              all_lines += [f'## {cat}', ''] + cat_rows + ['']

          Path('effectsdatabase_pedal_names.txt').write_text('\n'.join(all_lines), encoding='utf-8')
          Path('effectsdatabase_page_manifest.tsv').write_text('category\tpage\trows\tduplicates\n' + '\n'.join(manifest) + '\n', encoding='utf-8')
          print('WROTE complete text and page manifest', flush=True)
          PY
      - name: Build Word document
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from docx.shared import Pt
          from docx.enum.text import WD_BREAK

          text = Path('effectsdatabase_pedal_names.txt').read_text(encoding='utf-8')
          doc = Document()
          sec = doc.sections[0]
          sec.top_margin = Pt(36); sec.bottom_margin = Pt(36)
          sec.left_margin = Pt(45); sec.right_margin = Pt(45)
          p = doc.add_paragraph()
          r = p.add_run('Effects Database\nOverdrive, Distortion & Fuzz Pedal Name Index')
          r.bold = True; r.font.size = Pt(18)
          doc.add_paragraph('Source: Effects Database. One entry per catalog row, organized by category. Generated from the paginated pedal indexes.')
          for block in text.split('\n## ')[1:]:
              lines = block.splitlines()
              cat = lines[0].strip()
              doc.add_heading(cat, level=1)
              for name in lines[2:]:
                  if name.strip():
                      doc.add_paragraph(name.strip(), style='List Number')
          doc.save('effectsdatabase_pedal_names.docx')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: effectsdatabase-pedal-names
          path: |
            effectsdatabase_pedal_names.txt
            effectsdatabase_pedal_names.docx
            effectsdatabase_page_manifest.tsv
