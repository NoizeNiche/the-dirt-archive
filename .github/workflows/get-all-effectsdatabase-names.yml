name: Get all Effects Database pedal names

on:
  push:
    paths:
      - '.github/workflows/get-all-effectsdatabase-names.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape Effects Database
        run: |
          python - <<'PY'
          import html
          import re
          import requests
          from pathlib import Path

          cats = {
            'Overdrive': 'https://www.effectsdatabase.com/type/overdrive/pedal',
            'Distortion': 'https://www.effectsdatabase.com/type/distortion/pedal',
            'Fuzz': 'https://www.effectsdatabase.com/type/fuzz/pedal',
          }

          out = Path('effectsdatabase_pedal_names.txt')
          lines = []
          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (compatible; DirtArchive/1.0)'})

          for cat, base in cats.items():
            lines += [f'## {cat}', '']
            page = 0
            seen = set()
            while True:
              target = base if page == 0 else f'{base}?page={page}'
              url = 'https://r.jina.ai/' + target
              print('GET', target, flush=True)
              r = session.get(url, timeout=60)
              r.raise_for_status()
              text = r.text

              # Jina presents the catalog as numbered markdown links like:
              # 101. [Pedal Name](https://www.effectsdatabase.com/model/...)
              found = []
              for m in re.finditer(r'^\s*\d+\.\s+\[([^\]]+)\]\([^)]*/model/[^)]*\)\s*$', text, re.M):
                name = html.unescape(' '.join(m.group(1).split())).strip()
                if name and name not in found:
                  found.append(name)

              # Fallback for plain markdown links without a numeric prefix.
              if not found:
                for m in re.finditer(r'\[([^\]]+)\]\(https?://www\.effectsdatabase\.com/model/[^)]+\)', text):
                  name = html.unescape(' '.join(m.group(1).split())).strip()
                  if name and name not in found:
                    found.append(name)

              new = [x for x in found if x not in seen]
              print(f'{cat} page {page}: {len(found)} found, {len(new)} new, {len(seen)+len(new)} total', flush=True)
              if not found or not new:
                break
              seen.update(new)
              lines.extend(new)
              page += 1
              if page > 200:
                raise RuntimeError('pagination guard')

            print(f'{cat} TOTAL {len(seen)}', flush=True)
            lines.append('')

          out.write_text('\n'.join(lines), encoding='utf-8')
          print('WROTE', out, 'bytes', out.stat().st_size, flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: effectsdatabase-pedal-names
          path: effectsdatabase_pedal_names.txt
