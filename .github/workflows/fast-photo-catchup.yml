name: Fast photo catch-up

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - research/PHOTO_FAST_KICK
      - research/PHOTO_SOURCE_OVERRIDES.csv
      - research/PHOTO_DIRECT_IMAGE_OVERRIDES.csv
      - research/PEDAL_IDENTITY_ALIASES.csv
      - scripts/browser-photo-cache.mjs
      - scripts/cache-pedal-images.py
      - scripts/merge-photo-recovery-results.py
      - scripts/reset-photo-recovery-targets.py
      - scripts/cache-curated-direct-photos.py

permissions:
  contents: write
  actions: write

concurrency:
  group: dirt-photo-recovery-v4
  # Photo publication is rehydration-safe. Let a running finish-line pass finish
  # so a second source commit cannot cancel already-recovered work.
  cancel-in-progress: false

jobs:
  recover:
    name: Recover photo batch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rehydrate latest main before photo recovery
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install tooling
        run: |
          python -m pip install --disable-pip-version-check pillow pytesseract
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          npm install --no-save playwright@1.63.0

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: photo-fast-playwright-${{ runner.os }}-1.63.0
          restore-keys: |
            photo-fast-playwright-${{ runner.os }}-

      - name: Ensure Chromium
        shell: bash
        run: |
          if compgen -G "$HOME/.cache/ms-playwright/chromium-*" > /dev/null; then
            echo "Playwright Chromium restored from cache."
          else
            npx playwright install --with-deps chromium
          fi

      - name: Apply current source leads
        run: python scripts/apply-photo-source-overrides.py
      - name: Recover curated direct photos first
        run: python scripts/cache-curated-direct-photos.py

      - name: Recover exact pedal photo batch
        env:
          PHOTO_BROWSER_IMAGE_SEARCH: "true"
          PHOTO_BROWSER_DEEP_REVIEW: "true"
          PHOTO_BROWSER_ALLOW_PARKED_RETRY: "true"
          PHOTO_BROWSER_REVISIT_PARKED: "true"
          PHOTO_BROWSER_CACHE_LIMIT: "96"
          PHOTO_BROWSER_CACHE_CONCURRENCY: "16"
          PHOTO_BROWSER_PAGE_TIMEOUT_MS: "10000"
          PHOTO_BROWSER_SEARCH_TIMEOUT_MS: "8000"
          PHOTO_BROWSER_IMAGE_TIMEOUT_MS: "7000"
          PHOTO_BROWSER_CANDIDATE_LIMIT: "8"
          PHOTO_BROWSER_SEARCH_VERIFY_LIMIT: "8"
          PHOTO_BROWSER_RECOVERY_DEADLINE_MS: "60000"
          PHOTO_BROWSER_FRESH_RECOVERY_DEADLINE_MS: "45000"
          PHOTO_BROWSER_MAX_RECOVERY_ATTEMPTS: "8"
          PHOTO_BROWSER_MAX_DEEP_REVIEW_CYCLES: "3"
        run: timeout 720s node scripts/browser-photo-cache.mjs

      - name: Run recovered-photo content gate
        run: |
          python scripts/audit-photo-content.py --mode changed --output /tmp/recovered-photo-content-audit.csv --fail-high-confidence
      - name: Package recovered sources as individually verifiable results
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact/recoveries
          python - <<'PY'
          import json, shutil
          from pathlib import Path

          root = Path(".")
          manifest_path = root / "photo-recovery-results.json"
          if not manifest_path.is_file():
              print("No recovery manifest produced; this pass recovered no photo candidates.")
              raise SystemExit(0)

          data = json.loads(manifest_path.read_text(encoding="utf-8"))
          recovered_rows = data.get("recovered") or []
          packaged = 0

          for row in recovered_rows:
              image = str(row.get("image") or "").strip()
              if not image:
                  continue
              image_path = Path(image.lstrip("./"))
              source_path = (root / image_path).with_suffix(".source")
              if not source_path.is_file():
                  print(f"Skipping recovered record with missing source file: {row.get('builder')} / {row.get('pedal')}")
                  continue

              item_dir = root / "artifact" / "recoveries" / str(packaged)
              dest = item_dir / image_path
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source_path, dest)

              result = {
                  "builder": row.get("builder") or "",
                  "pedal": row.get("pedal") or "",
                  "image": image,
                  "image_source_url": row.get("image_source_url"),
                  "image_source_page": row.get("image_source_page"),
                  "imageFile": image_path.as_posix(),
                  "verification": row.get("verification") or {},
              }
              (item_dir / "photo-recovery-result.json").write_text(
                  json.dumps(result, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              packaged += 1

          print(f"Packaged {packaged} photo recoveries from {len(recovered_rows)} actual recovery results.")
          PY
          rm -f photo-recovery-results.json

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v7
        with:
          name: photo-batch
          path: artifact/
          retention-days: 1
          if-no-files-found: ignore

  merge:
    name: Merge current photo recoveries
    needs: [recover]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download recovery artifacts
        uses: actions/download-artifact@v5
        with:
          path: recovery-artifacts

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Clear known-invalid photo state
        run: python scripts/reset-photo-recovery-targets.py

      - name: Photo Foreman verifies recovered artifacts
        run: python scripts/verify-photo-recovery-batch.py

      - name: Merge verified sources
        run: python scripts/merge-photo-recovery-results.py

      - name: Record pre-publication photo count
        run: |
          python - <<'PY'
          import csv
          with open("research/PRP_TRACKER.csv", newline="", encoding="utf-8") as fh:
              count = sum(1 for r in csv.DictReader(fh) if r.get("Picture") == "DONE")
          with open("/tmp/photo-count-before", "w", encoding="utf-8") as fh:
              fh.write(str(count))
          print(f"Canonical pictured before recovery merge: {count}")
          PY

      - name: Convert and synchronize
        run: |
          python scripts/cache-pedal-images.py
          python scripts/sync-prp-tracker.py
          python scripts/build-research-queue.py
          python scripts/sync-photo-backlog.py
          python scripts/prune-photo-review-queue.py
          python scripts/refresh-image-cache-report.py
          python scripts/verify-photo-state.py

      - name: Gate canonical photo movement
        id: photo_gate
        run: |
          python - <<'PY'
          import json
          import csv
          from pathlib import Path
          verdict = Path("recovery-artifacts/photo-foreman-verdict.json")
          accepted = 0
          if verdict.exists():
              data = json.loads(verdict.read_text(encoding="utf-8"))
              accepted = sum(1 for row in data.get("verdicts", []) if row.get("accepted") is True)
          with open("/tmp/photo-count-before", encoding="utf-8") as fh:
              before = int(fh.read().strip())
          with open("research/PRP_TRACKER.csv", newline="", encoding="utf-8") as fh:
              after = sum(1 for r in csv.DictReader(fh) if r.get("Picture") == "DONE")
          delta = after - before
          print(f"Photo foreman accepted={accepted}; canonical pictured delta={delta} (before={before}, after={after})")
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"delta={delta}\n")
          if accepted > 0 and delta <= 0:
              raise SystemExit("Accepted photo recoveries did not reach canonical Picture=DONE state.")
          if delta < 0:
              raise SystemExit("Canonical pictured count regressed during photo publication.")

      - name: Publish one synchronized batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv research/PHOTO_BACKLOG.csv
          if git diff --cached --quiet; then
            echo "No verified photo recoveries succeeded."
            exit 0
          fi
          git commit -m "Archive fast verified pedal photos"
          for attempt in 1 2 3 4 5; do
            if timeout 30s env GIT_TERMINAL_PROMPT=0 git push origin main; then
              published_sha="$(git rev-parse HEAD)"
              if ! gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/dispatches" -f ref=main; then
                echo "Pages deployment dispatch was not accepted; the published photo commit remains on main and deploy-on-push will handle it."
              fi
              echo "Pages deployment dispatched for $published_sha; photo recovery lane does not wait on deployment."
              exit 0
            fi
            echo "Parallel photo push race; rehydrating all recovery artifacts on latest main (attempt $attempt/5)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge-photo-recovery-results.py
            python scripts/cache-pedal-images.py
            python scripts/sync-prp-tracker.py
            python scripts/sync-photo-backlog.py
            python scripts/prune-photo-review-queue.py
            python scripts/build-research-queue.py
            python scripts/refresh-image-cache-report.py
            python scripts/verify-photo-state.py
            git add assets/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv research/PHOTO_BACKLOG.csv
            if git diff --cached --quiet; then
              echo "Latest main already contains this recovery batch."
              exit 0
            fi
            git commit -m "Archive parallel verified pedal photos"
          done
          exit 1

      - name: Continue finish-line photo lane
        if: ${{ success() && steps.photo_gate.outputs.delta != '' && fromJSON(steps.photo_gate.outputs.delta) > 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          active="$(gh run list --workflow fast-photo-catchup.yml --branch main --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length')"
          if [ "$active" -le 1 ]; then
            echo "Photo movement landed; queueing the next bounded fast recovery pass."
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/fast-photo-catchup.yml/dispatches" -f ref=main
          else
            echo "Another fast photo pass is already queued or active; no duplicate dispatch."
          fi
