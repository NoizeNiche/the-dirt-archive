name: Fast photo catch-up

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - research/PHOTO_FAST_KICK
      - research/PHOTO_SOURCE_OVERRIDES.csv
      - research/PHOTO_DIRECT_IMAGE_OVERRIDES.csv
      - research/PEDAL_IDENTITY_ALIASES.csv

permissions:
  contents: write
  actions: write

concurrency:
  group: dirt-photo-recovery-v3
  # Serialize all automatic photo catch-up passes so duplicate runners do not compete for the same records.
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare current photo queue
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json, os, sys
          from pathlib import Path

          rows = list(csv.DictReader(open("research/PRP_TRACKER.csv", newline="", encoding="utf-8")))
          catalog = json.load(open("research/PEDAL_INDEX.json", encoding="utf-8"))
          catalog_by_key = {
              (str(p.get("company") or "").strip(), str(p.get("pedal") or "").strip()): p
              for p in catalog.get("pedals", [])
          }

          # Curated source overrides, direct image overrides, and the review queue
          # are the strongest signals that a record can be recovered now. Prefer
          # known direct images first, then exact source pages, then broader provenance,
          # so source-rich records stop starving behind the raw census.
          photo_source_keys = set()
          with open("research/PHOTO_SOURCE_OVERRIDES.csv", newline="", encoding="utf-8") as fh:
              for row in csv.DictReader(fh):
                  b, p, u = row.get("Builder", "").strip(), row.get("Pedal", "").strip(), row.get("Image Source Page", "").strip()
                  if b and p and u.startswith(("http://", "https://")):
                      photo_source_keys.add((b, p))

          direct_image_keys = set()
          direct_path = Path("research/PHOTO_DIRECT_IMAGE_OVERRIDES.csv")
          if direct_path.exists():
              with direct_path.open(newline="", encoding="utf-8") as fh:
                  for row in csv.DictReader(fh):
                      b, p, u = row.get("Builder", "").strip(), row.get("Pedal", "").strip(), row.get("Image URL", "").strip()
                      if b and p and u.startswith(("http://", "https://")):
                          direct_image_keys.add((b, p))

          # Research-source overrides are also useful photo candidates. They are
          # not treated as photo provenance automatically, but they are exact
          # model pages the browser can inspect for product imagery.
          research_source_keys = set()
          with open("research/RESEARCH_SOURCE_OVERRIDES.csv", newline="", encoding="utf-8") as fh:
              for row in csv.DictReader(fh):
                  b, p, u = row.get("Builder", "").strip(), row.get("Pedal", "").strip(), row.get("Source URL", "").strip()
                  if b and p and u.startswith(("http://", "https://")):
                      research_source_keys.add((b, p))

          review_by_key = {}
          review_path = Path("research/PHOTO_REVIEW_QUEUE.csv")
          if review_path.exists():
              with review_path.open(newline="", encoding="utf-8") as fh:
                  for row in csv.DictReader(fh):
                      review_by_key[(row.get("Builder", "").strip(), row.get("Pedal", "").strip())] = row

          targets = []
          for row in rows:
              if row.get("Pedal Info") != "DONE" or row.get("Picture") == "DONE":
                  continue
              b, p = row.get("Builder", "").strip(), row.get("Pedal", "").strip()
              key = (b, p)
              review = review_by_key.get(key, {})
              catalog_item = catalog_by_key.get(key, {})
              status = str(review.get("Status") or "").strip().upper()
              attempts = int(review.get("Attempts") or 0)
              source_ready = key in photo_source_keys
              catalog_source = bool(
                  str(catalog_item.get("image_source_page") or "").strip()
                  or str(catalog_item.get("image_source_url") or "").strip()
                  or str(catalog_item.get("source_page") or "").strip()
              )

              # Hard review cases always get the first slots. Exact curated photo
              # sources come next, followed by other records already carrying
              # image/source provenance, then the ordinary census backlog.
              if key in direct_image_keys:
                  priority = 0
              elif status in {"DEEP_REVIEW", "PARKED"}:
                  priority = 1
              elif source_ready:
                  priority = 2
              elif key in research_source_keys:
                  priority = 3
              elif catalog_source:
                  priority = 4
              else:
                  priority = 5

              targets.append({
                  "builder": b,
                  "pedal": p,
                  "_priority": priority,
                  "_attempts": attempts,
                  "_order": len(targets),
              })

          targets.sort(key=lambda x: (
              x["_priority"],
              x["_attempts"],
              x["builder"].casefold(),
              x["pedal"].casefold(),
              x["_order"],
          ))

          # Keep genuinely hard review cases visible every pass, but rotate the
          # ordinary backlog in small 50-record windows. This prevents repeated
          # failures in the first alphabetic slice from starving later records.
          batch_size = 50
          must_try = [t for t in targets if t["_priority"] <= 1]
          rotating = [t for t in targets if t["_priority"] > 1]
          remaining = max(0, batch_size - len(must_try))
          run_number = int(os.environ.get("GITHUB_RUN_NUMBER", "1") or "1")
          if rotating and len(rotating) > remaining:
              offset = ((run_number - 1) * remaining) % len(rotating)
              window = rotating[offset:offset + remaining]
              if len(window) < remaining:
                  window += rotating[:remaining - len(window)]
          else:
              window = rotating[:remaining]
          selected = must_try + window
          targets = [
              {"builder": t["builder"], "pedal": t["pedal"]}
              for t in selected
          ]
          print("matrix=" + json.dumps({"include": targets}, ensure_ascii=False, separators=(",", ":")))
          print(f"Prepared {len(targets)} photo targets (hard cases retained; ordinary backlog rotates in 50-record windows).", file=sys.stderr)
          PY

  recover:
    name: Recover ${{ matrix.builder }} / ${{ matrix.pedal }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rehydrate latest main before photo recovery
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install tooling
        run: |
          python -m pip install --disable-pip-version-check pillow
          npm install --no-save playwright@1.63.0

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: photo-fast-playwright-${{ runner.os }}-1.63.0
          restore-keys: |
            photo-fast-playwright-${{ runner.os }}-

      - name: Ensure Chromium
        shell: bash
        run: |
          if compgen -G "$HOME/.cache/ms-playwright/chromium-*" > /dev/null; then
            echo "Playwright Chromium restored from cache."
          else
            npx playwright install --with-deps chromium
          fi

      - name: Apply current source leads
        run: python scripts/apply-photo-source-overrides.py

      - name: Recover exact pedal photo
        env:
          PHOTO_BROWSER_TARGET_BUILDER: ${{ matrix.builder }}
          PHOTO_BROWSER_TARGET_PEDAL: ${{ matrix.pedal }}
          PHOTO_BROWSER_IMAGE_SEARCH: "true"
          PHOTO_BROWSER_DEEP_REVIEW: "true"
          PHOTO_BROWSER_ALLOW_PARKED_RETRY: "true"
          PHOTO_BROWSER_REVISIT_PARKED: "true"
          PHOTO_BROWSER_PAGE_TIMEOUT_MS: "9000"
          PHOTO_BROWSER_SEARCH_TIMEOUT_MS: "7000"
          PHOTO_BROWSER_IMAGE_TIMEOUT_MS: "7000"
          PHOTO_BROWSER_CANDIDATE_LIMIT: "8"
          PHOTO_BROWSER_SEARCH_VERIFY_LIMIT: "8"
          PHOTO_BROWSER_RECOVERY_DEADLINE_MS: "45000"
          PHOTO_BROWSER_FRESH_RECOVERY_DEADLINE_MS: "30000"
          PHOTO_BROWSER_MAX_RECOVERY_ATTEMPTS: "8"
          PHOTO_BROWSER_MAX_DEEP_REVIEW_CYCLES: "2"
        run: node scripts/browser-photo-cache.mjs

      - name: Package recovered source only
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact
          find assets/pedals -type f -name '*.source' -print0 | while IFS= read -r -d '' f; do
            cp --parents "$f" artifact/
          done
          python - <<'PY'
          import json
          from pathlib import Path
          builder = ${{ toJSON(matrix.builder) }}
          pedal = ${{ toJSON(matrix.pedal) }}
          catalog = json.loads(Path("research/PEDAL_INDEX.json").read_text(encoding="utf-8"))
          target = next(p for p in catalog.get("pedals", []) if p.get("company") == builder and p.get("pedal") == pedal)
          image = str(target.get("image") or "")
          result = {
              "builder": builder,
              "pedal": pedal,
              "has_source": bool(list(Path("artifact").rglob("*.source"))),
              "image": image,
              "image_source_url": target.get("image_source_url"),
              "image_source_page": target.get("image_source_page"),
          }
          Path("artifact/photo-recovery-result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-photo-${{ strategy.job-index }}
          path: artifact/
          retention-days: 1
          if-no-files-found: ignore

  merge:
    name: Merge current photo recoveries
    needs: [recover]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download recovery artifacts
        uses: actions/download-artifact@v5
        with:
          path: recovery-artifacts

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Photo Foreman verifies recovered artifacts
        run: python scripts/verify-photo-recovery-batch.py

      - name: Merge verified sources
        run: python scripts/merge-photo-recovery-results.py

      - name: Record pre-publication photo count
        run: |
          python - <<'PY'
          import csv
          with open("research/PRP_TRACKER.csv", newline="", encoding="utf-8") as fh:
              count = sum(1 for r in csv.DictReader(fh) if r.get("Picture") == "DONE")
          with open("/tmp/photo-count-before", "w", encoding="utf-8") as fh:
              fh.write(str(count))
          print(f"Canonical pictured before recovery merge: {count}")
          PY

      - name: Convert and synchronize
        run: |
          python scripts/cache-pedal-images.py
          python scripts/sync-prp-tracker.py
          python scripts/build-research-queue.py
          python scripts/sync-photo-backlog.py
          python scripts/prune-photo-review-queue.py
          python scripts/refresh-image-cache-report.py
          python scripts/verify-photo-state.py

      - name: Gate canonical photo movement
        id: photo_gate
        run: |
          python - <<'PY'
          import json
          import csv
          from pathlib import Path
          verdict = Path("recovery-artifacts/photo-foreman-verdict.json")
          accepted = 0
          if verdict.exists():
              data = json.loads(verdict.read_text(encoding="utf-8"))
              accepted = sum(1 for row in data.get("verdicts", []) if row.get("accepted") is True)
          with open("/tmp/photo-count-before", encoding="utf-8") as fh:
              before = int(fh.read().strip())
          with open("research/PRP_TRACKER.csv", newline="", encoding="utf-8") as fh:
              after = sum(1 for r in csv.DictReader(fh) if r.get("Picture") == "DONE")
          delta = after - before
          print(f"Photo foreman accepted={accepted}; canonical pictured delta={delta} (before={before}, after={after})")
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"delta={delta}\n")
          if accepted > 0 and delta <= 0:
              raise SystemExit("Accepted photo recoveries did not reach canonical Picture=DONE state.")
          if delta < 0:
              raise SystemExit("Canonical pictured count regressed during photo publication.")

      - name: Publish one synchronized batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv research/PHOTO_BACKLOG.csv
          if git diff --cached --quiet; then
            echo "No verified photo recoveries succeeded."
            exit 0
          fi
          git commit -m "Archive fast verified pedal photos"
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              published_sha="$(git rev-parse HEAD)"
              if ! gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/dispatches" -f ref=main; then
                echo "Pages deployment dispatch was not accepted; the published photo commit remains on main and deploy-on-push will handle it."
              fi
              echo "Pages deployment dispatched for $published_sha; photo recovery lane does not wait on deployment."
              exit 0
            fi
            echo "Parallel photo push race; rehydrating all recovery artifacts on latest main (attempt $attempt/5)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge-photo-recovery-results.py
            python scripts/cache-pedal-images.py
            python scripts/sync-prp-tracker.py
            python scripts/sync-photo-backlog.py
            python scripts/prune-photo-review-queue.py
            python scripts/build-research-queue.py
            python scripts/refresh-image-cache-report.py
            python scripts/verify-photo-state.py
            git add assets/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv research/PHOTO_BACKLOG.csv
            if git diff --cached --quiet; then
              echo "Latest main already contains this recovery batch."
              exit 0
            fi
            git commit -m "Archive parallel verified pedal photos"
          done
          exit 1

      - name: Continue finish-line photo lane
        if: ${{ success() && steps.photo_gate.outputs.delta != '' && fromJSON(steps.photo_gate.outputs.delta) > 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          active="$(gh run list --workflow fast-photo-catchup.yml --branch main --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length')"
          if [ "$active" -le 1 ]; then
            echo "Photo movement landed; queueing the next bounded fast recovery pass."
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/fast-photo-catchup.yml/dispatches" -f ref=main
          else
            echo "Another fast photo pass is already queued or active; no duplicate dispatch."
          fi
