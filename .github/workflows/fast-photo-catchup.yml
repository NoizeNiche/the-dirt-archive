name: Fast photo catch-up

on:
  workflow_dispatch:
  push:
    paths:
      - research/PHOTO_FAST_KICK

permissions:
  contents: write

concurrency:
  group: dirt-photo-fast-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare current photo queue
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json, sys
          rows = list(csv.DictReader(open("research/PRP_TRACKER.csv", newline="", encoding="utf-8")))
          targets = [
              {"builder": r["Builder"], "pedal": r["Pedal"]}
              for r in rows
              if r.get("Pedal Info") == "DONE" and r.get("Picture") != "DONE"
          ]
          print("matrix=" + json.dumps({"include": targets}, ensure_ascii=False, separators=(",", ":")))
          print(f"Prepared {len(targets)} photo targets.", file=sys.stderr)
          PY

  recover:
    name: Recover ${{ matrix.builder }} / ${{ matrix.pedal }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install tooling
        run: |
          python -m pip install --disable-pip-version-check pillow
          npm install --no-save playwright@1.63.0

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: photo-fast-playwright-${{ runner.os }}-1.63.0
          restore-keys: |
            photo-fast-playwright-${{ runner.os }}-

      - name: Ensure Chromium
        shell: bash
        run: |
          if compgen -G "$HOME/.cache/ms-playwright/chromium-*" > /dev/null; then
            echo "Playwright Chromium restored from cache."
          else
            npx playwright install --with-deps chromium
          fi

      - name: Apply current source leads
        run: python scripts/apply-photo-source-overrides.py

      - name: Recover exact pedal photo
        env:
          PHOTO_BROWSER_TARGET_BUILDER: ${{ matrix.builder }}
          PHOTO_BROWSER_TARGET_PEDAL: ${{ matrix.pedal }}
          PHOTO_BROWSER_IMAGE_SEARCH: "true"
          PHOTO_BROWSER_DEEP_REVIEW: "true"
          PHOTO_BROWSER_ALLOW_PARKED_RETRY: "true"
          PHOTO_BROWSER_REVISIT_PARKED: "false"
          PHOTO_BROWSER_PAGE_TIMEOUT_MS: "6500"
          PHOTO_BROWSER_SEARCH_TIMEOUT_MS: "5000"
          PHOTO_BROWSER_IMAGE_TIMEOUT_MS: "3500"
          PHOTO_BROWSER_CANDIDATE_LIMIT: "5"
          PHOTO_BROWSER_SEARCH_VERIFY_LIMIT: "5"
          PHOTO_BROWSER_RECOVERY_DEADLINE_MS: "25000"
          PHOTO_BROWSER_FRESH_RECOVERY_DEADLINE_MS: "18000"
          PHOTO_BROWSER_MAX_RECOVERY_ATTEMPTS: "4"
          PHOTO_BROWSER_MAX_DEEP_REVIEW_CYCLES: "1"
        run: node scripts/browser-photo-cache.mjs

      - name: Package recovered source only
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact
          find assets/pedals -type f -name '*.source' -print0 | while IFS= read -r -d '' f; do
            cp --parents "$f" artifact/
          done
          python - <<'PY'
          import json
          from pathlib import Path
          builder = ${{ toJSON(matrix.builder) }}
          pedal = ${{ toJSON(matrix.pedal) }}
          catalog = json.loads(Path("research/PEDAL_INDEX.json").read_text(encoding="utf-8"))
          target = next(p for p in catalog.get("pedals", []) if p.get("company") == builder and p.get("pedal") == pedal)
          image = str(target.get("image") or "")
          result = {
              "builder": builder,
              "pedal": pedal,
              "has_source": bool(list(Path("artifact").rglob("*.source"))),
              "image": image,
              "image_source_url": target.get("image_source_url"),
              "image_source_page": target.get("image_source_page"),
          }
          Path("artifact/photo-recovery-result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-photo-${{ strategy.job-index }}-${{ matrix.builder }}-${{ matrix.pedal }}
          path: artifact/
          retention-days: 1
          if-no-files-found: ignore

  merge:
    name: Merge current photo recoveries
    needs: [recover]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download recovery artifacts
        uses: actions/download-artifact@v5
        with:
          path: recovery-artifacts

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Merge verified sources
        run: python scripts/merge-photo-recovery-results.py

      - name: Convert and synchronize
        run: |
          python scripts/cache-pedal-images.py
          python scripts/sync-prp-tracker.py
          python scripts/build-research-queue.py
          python scripts/sync-photo-backlog.py
          python scripts/prune-photo-review-queue.py
          python scripts/refresh-image-cache-report.py
          python scripts/verify-photo-state.py

      - name: Publish one synchronized batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv research/PHOTO_BACKLOG.csv
          if git diff --cached --quiet; then
            echo "No verified photo recoveries succeeded."
            exit 0
          fi
          git commit -m "Archive fast verified pedal photos"
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase origin/main && git push; then
              exit 0
            fi
            git rebase --abort || true
          done
          exit 1
