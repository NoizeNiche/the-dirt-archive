name: Fast photo catch-up

on:
  workflow_dispatch:
  push:
    paths:
      - research/PHOTO_FAST_KICK

permissions:
  contents: write
  actions: write

concurrency:
  group: dirt-archive-write-v2
  # Exactly one archive write lane may run at a time. Recovery passes are explicit,
  # bounded, resumable work units rather than an always-running queue.
  cancel-in-progress: false

jobs:
  recover:
    name: Recover photo batch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Rehydrate latest main before photo recovery
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install tooling
        run: |
          python -m pip install --disable-pip-version-check pillow pytesseract playwright
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          npm install --no-save playwright@1.63.0

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: photo-fast-playwright-${{ runner.os }}-1.63.0
          restore-keys: |
            photo-fast-playwright-${{ runner.os }}-

      - name: Ensure Chromium
        shell: bash
        run: |
          if compgen -G "$HOME/.cache/ms-playwright/chromium-*" > /dev/null; then
            echo "Playwright Chromium restored from cache."
          else
            npx playwright install --with-deps chromium
          fi

      - name: Clear known-invalid photo state before curated recovery
        run: python scripts/reset-photo-recovery-targets.py

      - name: Apply current source leads
        run: python scripts/apply-photo-source-overrides.py
      - name: Recover curated direct photos first
        continue-on-error: true
        run: python scripts/cache-curated-direct-photos.py

      - name: Recover exact pedal photo batch
        env:
          PHOTO_BROWSER_IMAGE_SEARCH: "true"
          PHOTO_BROWSER_DEEP_REVIEW: "true"
          PHOTO_BROWSER_ALLOW_PARKED_RETRY: "true"
          PHOTO_BROWSER_REVISIT_PARKED: "true"
          PHOTO_BROWSER_CACHE_LIMIT: "16"
          PHOTO_BROWSER_CACHE_CONCURRENCY: "6"
          PHOTO_DIRECT_CONCURRENCY: "3"
          PHOTO_BROWSER_PAGE_TIMEOUT_MS: "12000"
          PHOTO_BROWSER_SEARCH_TIMEOUT_MS: "10000"
          PHOTO_BROWSER_IMAGE_TIMEOUT_MS: "10000"
          PHOTO_BROWSER_CANDIDATE_LIMIT: "4"
          PHOTO_BROWSER_SEARCH_VERIFY_LIMIT: "4"
          PHOTO_BROWSER_RECOVERY_DEADLINE_MS: "20000"
          PHOTO_BROWSER_FRESH_RECOVERY_DEADLINE_MS: "20000"
          PHOTO_BROWSER_MAX_RECOVERY_ATTEMPTS: "4"
          PHOTO_BROWSER_MAX_DEEP_REVIEW_CYCLES: "2"
        run: timeout --kill-after=10s 240s node scripts/browser-photo-cache.mjs

      - name: Reset photo state discovered during browser recovery
        if: ${{ always() }}
        run: python scripts/reset-photo-recovery-targets.py

      - name: Run recovered-photo content gate
        if: ${{ always() }}
        run: |
          python scripts/audit-photo-content.py --mode changed --output /tmp/recovered-photo-content-audit.csv --fail-high-confidence
      - name: Package recovered sources as individually verifiable results
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact/recoveries
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from PIL import Image

          root = Path(".")
          manifest_paths = [
              root / "photo-recovery-direct-results.json",
              root / "photo-recovery-results.json",
          ]
          recovered_rows = []
          seen_keys = set()
          for manifest_path in manifest_paths:
              if not manifest_path.is_file():
                  continue
              try:
                  data = json.loads(manifest_path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"Skipping unreadable recovery manifest {manifest_path}: {exc}")
                  continue
              for row in data.get("recovered") or []:
                  identity = (str(row.get("builder") or ""), str(row.get("pedal") or ""))
                  if not identity[0] or not identity[1] or identity in seen_keys:
                      continue
                  seen_keys.add(identity)
                  recovered_rows.append(row)

          if not recovered_rows:
              print("No recovery manifests produced; this pass recovered no photo candidates.")
              raise SystemExit(0)

          packaged = 0

          for row in recovered_rows:
              image = str(row.get("image") or "").strip()
              image_file = str(row.get("imageFile") or "").strip()
              if not image or not image_file:
                  continue
              source_path = root / image_file.lstrip("./")
              if not source_path.is_file():
                  print(f"Skipping recovered record with missing source file: {row.get('builder')} / {row.get('pedal')}")
                  continue

              source_rel = Path(image_file.lstrip("./"))
              item_dir = root / "artifact" / "recoveries" / str(packaged)
              # Recovery workers intentionally store raw selected bytes under a
              # temporary .source suffix. Convert those bytes into a real image
              # before packaging so the publication foreman can verify them.
              packaged_rel = source_rel.with_suffix(".webp") if source_rel.suffix.lower() == ".source" else source_rel
              source_dest = item_dir / packaged_rel
              source_dest.parent.mkdir(parents=True, exist_ok=True)
              try:
                  if source_rel.suffix.lower() == ".source":
                      try:
                          with Image.open(source_path) as im:
                              pil_image = im.convert("RGBA") if "A" in im.getbands() else im.convert("RGB")
                              pil_image.save(source_dest, "WEBP", quality=95, method=6)
                      except Exception as pil_exc:
                          # Some browser-captured formats are valid images but are
                          # outside the Pillow build available on the runner
                          # (for example AVIF). Try the runner's native image
                          # converter before discarding a recovered candidate.
                          import subprocess
                          converter_ok = False
                          for converter in ("magick", "convert", "ffmpeg"):
                              try:
                                  if converter == "ffmpeg":
                                      cmd = [
                                          converter, "-y", "-loglevel", "error",
                                          "-i", str(source_path),
                                          "-c:v", "libwebp", "-quality", "95",
                                          str(source_dest),
                                      ]
                                  elif converter == "magick":
                                      cmd = [converter, str(source_path), "-quality", "95", str(source_dest)]
                                  else:
                                      cmd = [converter, str(source_path), "-quality", "95", str(source_dest)]
                                  subprocess.run(cmd, check=True, timeout=15, capture_output=True, text=True)
                                  if source_dest.is_file() and source_dest.stat().st_size >= 3000:
                                      converter_ok = True
                                      print(
                                          f"Recovered non-Pillow image via {converter}: "
                                          f"{row.get('builder')} / {row.get('pedal')}"
                                      )
                                      break
                              except Exception:
                                  continue
                          if not converter_ok:
                              raise pil_exc
                  else:
                      shutil.copy2(source_path, source_dest)
              except Exception as exc:
                  print(f"Skipping unreadable recovered photo: {row.get('builder')} / {row.get('pedal')}: {exc}")
                  continue

              result = {
                  "builder": row.get("builder") or "",
                  "pedal": row.get("pedal") or "",
                  "image": image,
                  "image_source_url": row.get("image_source_url"),
                  "image_source_page": row.get("image_source_page"),
                  "imageFile": "./" + packaged_rel.as_posix(),
                  "verification": row.get("verification") or {},
              }
              (item_dir / "photo-recovery-result.json").write_text(
                  json.dumps(result, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              packaged += 1

          print(f"Packaged {packaged} photo recoveries from {len(recovered_rows)} actual recovery results.")
          PY
          rm -f photo-recovery-direct-results.json photo-recovery-results.json

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-batch
          path: artifact/
          retention-days: 1
          if-no-files-found: ignore

  merge:
    name: Merge current photo recoveries
    needs: [recover]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download recovery artifacts
        uses: actions/download-artifact@v8
        with:
          path: recovery-artifacts

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Clear known-invalid photo state
        run: python scripts/reset-photo-recovery-targets.py

      - name: Photo Foreman verifies recovered artifacts
        run: python scripts/verify-photo-recovery-batch.py

      - name: Merge verified sources
        run: python scripts/merge-photo-recovery-results.py

      - name: Record pre-publication photo count
        run: |
          python - <<'PY'
          import csv
          with open("research/PRP_TRACKER.csv", newline="", encoding="utf-8") as fh:
              count = sum(1 for r in csv.DictReader(fh) if r.get("Picture") == "DONE")
          with open("/tmp/photo-count-before", "w", encoding="utf-8") as fh:
              fh.write(str(count))
          print(f"Canonical pictured before recovery merge: {count}")
          PY

      - name: Convert and synchronize
        run: |
          python scripts/cache-pedal-images.py
          # The cache stage may remove a quarantined/invalid local asset after
          # the pre-merge reset. Reconcile again before tracker sync so no stale
          # catalog pointer can survive into canonical verification.
          python scripts/reset-photo-recovery-targets.py
          python scripts/sync-prp-tracker.py
          python scripts/build-research-queue.py
          python scripts/sync-photo-backlog.py
          python scripts/prune-photo-review-queue.py
          python scripts/refresh-image-cache-report.py
          python scripts/verify-photo-state.py
          python scripts/prune-orphaned-photo-assets.py

      - name: Gate canonical photo movement
        id: photo_gate
        run: |
          python - <<'PY'
          import json
          import csv
          from pathlib import Path
          verdict = Path("recovery-artifacts/photo-foreman-verdict.json")
          accepted = 0
          if verdict.exists():
              data = json.loads(verdict.read_text(encoding="utf-8"))
              accepted = sum(1 for row in data.get("verdicts", []) if row.get("accepted") is True)
          with open("/tmp/photo-count-before", encoding="utf-8") as fh:
              before = int(fh.read().strip())
          with open("research/PRP_TRACKER.csv", newline="", encoding="utf-8") as fh:
              after = sum(1 for r in csv.DictReader(fh) if r.get("Picture") == "DONE")
          delta = after - before
          relevant = [
              "assets/pedals",
              "research/PEDAL_INDEX.json",
              "research/pedals/PEDAL_IMAGES.json",
              "research/PRP_TRACKER.csv",
              "research/RESEARCH_QUEUE.json",
              "CURRENT_STATE.md",
              "research/IMAGE_CACHE_REPORT.md",
              "research/PHOTO_REVIEW_QUEUE.csv",
              "research/PHOTO_BACKLOG.csv",
          ]
          changed = int(__import__("subprocess").run(
              ["git", "diff", "--quiet", "--", *relevant]
          ).returncode != 0)
          print(
              f"Photo foreman accepted={accepted}; canonical pictured delta={delta} "
              f"(before={before}, after={after}); publishable_state_change={changed}"
          )
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"delta={delta}\n")
              fh.write(f"changed={changed}\n")
              fh.write(f"accepted={accepted}\n")
          import json as _json
          import re as _re
          from collections import defaultdict as _defaultdict
          from urllib.parse import urlparse as _urlparse

          head_tracker = _run = __import__("subprocess").run(
              ["git", "show", "HEAD:research/PRP_TRACKER.csv"],
              check=True, capture_output=True, text=True
          ).stdout
          before_rows = {(
              r.get("Builder",""), r.get("Pedal","")
          ): r for r in csv.DictReader(head_tracker.splitlines())}
          after_rows = {}
          with open("research/PRP_TRACKER.csv", newline="", encoding="utf-8") as fh:
              after_rows = {(
                  r.get("Builder",""), r.get("Pedal","")
              ): r for r in csv.DictReader(fh)}

          regressions = [
              k for k, old_row in before_rows.items()
              if old_row.get("Picture") == "DONE"
              and after_rows.get(k, {}).get("Picture") != "DONE"
          ]

          identity_quarantine = {}
          try:
              with open("research/PHOTO_IDENTITY_QUARANTINE.csv", newline="", encoding="utf-8") as fh:
                  for row in csv.DictReader(fh):
                      k = (row.get("Builder",""), row.get("Pedal",""))
                      blocked = str(row.get("Blocked Image URL") or "").strip().lower()
                      if blocked:
                          identity_quarantine.setdefault(k, set()).add(blocked)
          except Exception:
              pass

          catalog = {}
          try:
              catalog = {
                  (str(row.get("company") or row.get("builder") or "").strip(), str(row.get("pedal") or "").strip()): row
                  for row in _json.loads(Path("research/PEDAL_INDEX.json").read_text(encoding="utf-8")).get("pedals", [])
              }
          except Exception:
              catalog = {}

          justified_regressions = []
          unexplained_regressions = []
          for k in regressions:
              entry = catalog.get(k, {})
              values = [
                  str(entry.get("image_source_url") or "").strip().lower(),
                  str(entry.get("image_source_page") or "").strip().lower(),
              ]
              values.extend(str(v or "").strip().lower() for v in (entry.get("image_source_urls") or []))
              values.extend(str(v or "").strip().lower() for v in (entry.get("image_source_pages") or []))
              blocked = identity_quarantine.get(k, set())
              # A quarantined identity may legitimately lose its old photo while
              # the bad source is being removed. Treat that exact cleanup as
              # justified when no photo provenance remains, or when the remaining
              # provenance is itself explicitly blocked for the same identity.
              if blocked and (
                  not any(values) or
                  any(v and v in blocked for v in values)
              ):
                  justified_regressions.append(k)
              else:
                  unexplained_regressions.append(k)

          print(
              f"Photo Foreman accepted={accepted}; canonical pictured delta={delta} "
              f"(before={before}, after={after}); publishable_state_change={changed}; "
              f"photo_regressions={len(regressions)} justified_quarantine_cleanup={len(justified_regressions)}"
          )
          if accepted > 0 and delta <= 0 and not changed:
              raise SystemExit("Accepted photo recoveries did not produce a canonical state change.")
          if unexplained_regressions:
              raise SystemExit(
                  "Canonical pictured count lost unexplained records: "
                  + str(unexplained_regressions[:12])
              )

      - name: Publish one synchronized batch
        if: ${{ success() && ((steps.photo_gate.outputs.delta != '' && fromJSON(steps.photo_gate.outputs.delta) != 0) || (steps.photo_gate.outputs.accepted != '' && fromJSON(steps.photo_gate.outputs.accepted) > 0 && steps.photo_gate.outputs.changed == '1')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv research/PHOTO_BACKLOG.csv
          if git diff --cached --quiet; then
            echo "No verified photo recoveries succeeded."
            exit 0
          fi
          git commit -m "Archive fast verified pedal photos"
          for attempt in 1 2 3 4 5; do
            if timeout 30s env GIT_TERMINAL_PROMPT=0 git push origin main; then
              published_sha="$(git rev-parse HEAD)"
              if ! gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/dispatches" -f ref=main; then
                echo "Pages deployment dispatch was not accepted; the published photo commit remains on main and deploy-on-push will handle it."
              fi
              echo "Pages deployment dispatched for $published_sha; photo recovery lane does not wait on deployment."
              exit 0
            fi
            echo "Parallel photo push race; rehydrating all recovery artifacts on latest main (attempt $attempt/5)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge-photo-recovery-results.py
            python scripts/cache-pedal-images.py
            # Reconcile any asset removals performed by the cache stage before
            # replaying the recovered batch on the latest main.
            python scripts/reset-photo-recovery-targets.py
            python scripts/sync-prp-tracker.py
            python scripts/sync-photo-backlog.py
            python scripts/prune-photo-review-queue.py
            python scripts/build-research-queue.py
            python scripts/refresh-image-cache-report.py
            python scripts/verify-photo-state.py
            git add assets/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv research/PHOTO_BACKLOG.csv
            if git diff --cached --quiet; then
              echo "Latest main already contains this recovery batch."
              exit 0
            fi
            git commit -m "Archive parallel verified pedal photos"
          done
          exit 1

      - name: Continue finish-line photo lane
        if: ${{ success() && ((steps.photo_gate.outputs.delta != '' && fromJSON(steps.photo_gate.outputs.delta) != 0) || (steps.photo_gate.outputs.accepted != '' && fromJSON(steps.photo_gate.outputs.accepted) > 0 && steps.photo_gate.outputs.changed == '1')) }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          active="$(gh run list --workflow fast-photo-catchup.yml --branch main --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length')"
          if [ "$active" -le 1 ]; then
            echo "Photo movement landed; queueing the next bounded fast recovery pass."
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/fast-photo-catchup.yml/dispatches" -f ref=main
          else
            echo "Another fast photo pass is already queued or active; no duplicate dispatch."
          fi
