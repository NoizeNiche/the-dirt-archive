name: Build Research Export

on:
  push:
    paths:
      - 'research/builders/*.md'
      - '.github/workflows/build-research-export.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build combined research export
        shell: bash
        run: |
          {
            echo '# The Dirt Archive — Combined Builder Research Export'
            echo
            echo 'Generated automatically from research/builders/*.md.'
            echo 'This is a raw research dump for census comparison and reconciliation.'
            echo
            for f in research/builders/*.md; do
              echo
              echo '============================================================'
              echo "SOURCE FILE: $f"
              echo '============================================================'
              cat "$f"
              echo
            done
          } > research/RAW_BUILDER_RESEARCH_EXPORT.md

      - name: Commit export
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/RAW_BUILDER_RESEARCH_EXPORT.md
          git diff --cached --quiet && exit 0
          git commit -m 'Build combined builder research export [skip ci]'
          git push
