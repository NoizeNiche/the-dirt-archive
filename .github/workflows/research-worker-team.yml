name: Research worker team

on:
  workflow_dispatch:
  # Background deep-research sweep. Surface coverage no longer depends on
  # this lane, so slow/hard evidence can be revisited without blocking the site.
  schedule:
    - cron: '15 */4 * * *'
  push:
    paths:
      - research/RESEARCH_WORKER_KICK

permissions:
  contents: write
  actions: write

concurrency:
  group: dirt-research-workers-v5
  # Queue research passes instead of cancelling a pass that is already gathering evidence.
  cancel-in-progress: false

jobs:
  prepare:
    name: Build research worker matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          catalog=json.load(open("research/PEDAL_INDEX.json",encoding="utf-8"))
          pedals=catalog.get("pedals", [])
          # Every pedal now has a surface record. Deep research revisits those
          # records without blocking site-wide surface coverage.
          pending=[
              {"builder":p.get("company",""),"pedal":p.get("pedal","")}
              for p in pedals
              if p.get("catalog_role") != "variation"
              and str(p.get("research_level") or "").strip().lower() != "deep"
          ]
          pending=[p for p in pending if p["builder"] and p["pedal"]]
          pending.sort(key=lambda x:(x["builder"].casefold(),x["pedal"].casefold()))

          evidence_path = "research/RESEARCH_EVIDENCE_QUEUE.json"
          verdicts = {}
          try:
              evidence = json.load(open(evidence_path, encoding="utf-8"))
              for item in evidence.get("records", []):
                  verdicts[(item.get("builder"), item.get("pedal"))] = item.get("foremanVerdict")
          except Exception:
              pass
          priority = {"EVIDENCE_READY":0,"MORE_SOURCES_NEEDED":1,None:2,"":2,"NO_USABLE_EVIDENCE":3}
          pending.sort(key=lambda r:(priority.get(verdicts.get((r["builder"],r["pedal"])),2),r["builder"].casefold(),r["pedal"].casefold()))

          buckets={}
          for row in pending:
              buckets.setdefault((row["builder"][:1] or "#").upper(),[]).append(row)
          targets=[]
          letters=sorted(buckets)
          while len(targets)<60 and any(buckets.values()):
              progressed=False
              for letter in letters:
                  if buckets[letter]:
                      targets.append(buckets[letter].pop(0))
                      progressed=True
                      if len(targets)>=60: break
              if not progressed: break
          matrix={"include":[{"targets":targets[i:i+4]} for i in range(0,len(targets),4)]}
          print("matrix="+json.dumps(matrix,ensure_ascii=False,separators=(",",":")))
          print("Research targets:",len(targets),"workers:",len(matrix["include"]),file=sys.stderr)
          PY

  gather:
    name: Research gatherer ${{ strategy.job-index }}
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
      - name: Gather evidence for assigned targets
        env:
          RESEARCH_WORKER_INDEX: ${{ strategy.job-index }}
          RESEARCH_WORKER_COUNT: "15"
          RESEARCH_TARGETS_PER_WORKER: "4"
          RESEARCH_TARGETS_JSON: ${{ toJSON(matrix.targets) }}
          RESEARCH_REQUEST_TIMEOUT_MS: "7000"
        run: node scripts/research-evidence-gather.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: research-worker-${{ strategy.job-index }}
          path: artifact/
          if-no-files-found: ignore
          retention-days: 1

  foreman:
    name: Research foreman
    needs: gather
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      canonical_delta: ${{ steps.publish.outputs.canonical_delta }}
      deepened_research: ${{ steps.publish.outputs.deepened_research }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          path: research-evidence
      - name: Verify and admit only strong evidence packets
        run: python scripts/research-foreman.py
      - name: Publish verified research and canonical records
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "canonical_delta=0" >> "$GITHUB_OUTPUT"
          echo "deepened_research=0" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/RESEARCH_INBOX
          if git diff --cached --quiet; then
            echo "No new verified research evidence packets."
            exit 0
          fi

          # GITHUB_TOKEN pushes do not trigger another workflow, so synthesis
          # must happen in this same controlled publication pass.
          python - <<'PY'
          import csv, json
          from pathlib import Path
          with open("research/PRP_TRACKER.csv", newline="", encoding="utf-8") as fh:
              rows=list(csv.DictReader(fh))
          before_links = {
              f"{r.get('Builder','')}|{r.get('Pedal','')}": r.get('Research Record') or ""
              for r in rows
          }
          before_existing_records = sorted(
              "./" + p.as_posix().replace("\\","/")
              for p in Path("research/pedals").rglob("*.md")
          )
          Path("/tmp/research-publication-before.json").write_text(
              json.dumps({
                  "researched": sum(1 for r in rows if r.get("Pedal Info") == "DONE"),
                  "links": before_links,
                  "existing_records": before_existing_records,
              }, ensure_ascii=False),
              encoding="utf-8",
          )
          print("Captured pre-publication research state.")
          PY
          synth_result="$(python scripts/synthesize-research-inbox.py --only research-evidence/foreman-summary.json)"
          created_records="$(python -c 'import json,sys; print(json.load(sys.stdin)["created"])' <<<"$synth_result")"
          printf '%s' "$created_paths_json" > /tmp/research-created-paths.json
          python scripts/sync_prp_catalog.py
          python scripts/sync-prp-tracker.py
          python scripts/sync-photo-backlog.py
          python scripts/build-research-queue.py
          python scripts/validate-archive.py

          staged_research="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research-evidence/foreman-summary.json")
          print(int(json.loads(p.read_text(encoding="utf-8")).get("staged",0)) if p.exists() else 0)
          PY
          )"
          deepened_research="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/research-publication-accounting.json")
          print(int(json.loads(p.read_text(encoding="utf-8")).get("deepened",0)) if p.exists() else 0)
          PY
          )"
          python - <<'PY'
          import csv, json
          from pathlib import Path
          before=json.loads(Path("/tmp/research-publication-before.json").read_text(encoding="utf-8"))
          with open("research/PRP_TRACKER.csv", newline="", encoding="utf-8") as fh:
              rows=list(csv.DictReader(fh))
          after_links = {
              f"{r.get('Builder','')}|{r.get('Pedal','')}": r.get('Research Record') or ""
              for r in rows
          }
          after_researched = sum(1 for r in rows if r.get("Pedal Info") == "DONE")
          before_researched = int(before["researched"])
          delta = after_researched - before_researched

          newly_linked = {
              k:v for k,v in after_links.items()
              if not before["links"].get(k) and v
          }
          existing_records = set(before.get("existing_records", []))
          orphan_adoptions = {
              k:v for k,v in newly_linked.items()
              if v in existing_records
          }
          genuinely_new_links = {
              k:v for k,v in newly_linked.items()
              if v not in existing_records
          }

          Path("/tmp/research-publication-accounting.json").write_text(
              json.dumps({
                  "before_researched": before_researched,
                  "after_researched": after_researched,
                  "canonical_delta": delta,
                  "deepened": sum(
                      1 for k,v in after_links.items()
                      if v and before["links"].get(k)==v and k in newly_linked
                  ),
                  "newly_linked": len(newly_linked),
                  "orphan_adoptions": len(orphan_adoptions),
                  "genuinely_new_links": len(genuinely_new_links),
              }, ensure_ascii=False),
              encoding="utf-8",
          )

          print(
              f"Research accounting: delta={delta}; newly_linked={len(newly_linked)}; "
              f"orphan_adoptions={len(orphan_adoptions)}; genuinely_new_links={len(genuinely_new_links)}"
          )
          PY

          accounting="$(cat /tmp/research-publication-accounting.json)"
          delta="$(python -c 'import json,sys; print(json.load(sys.stdin)["canonical_delta"])' <<<"$accounting")"
          deepened_research="$(python -c 'import json,sys; print(json.load(sys.stdin).get("deepened",0))' <<<"$accounting")"
          orphan_adoptions="$(python -c 'import json,sys; print(json.load(sys.stdin)["orphan_adoptions"])' <<<"$accounting")"
          genuinely_new_links="$(python -c 'import json,sys; print(json.load(sys.stdin)["genuinely_new_links"])' <<<"$accounting")"
          echo "canonical_delta=$delta" >> "$GITHUB_OUTPUT"
          echo "deepened_research=$deepened_research" >> "$GITHUB_OUTPUT"
          echo "Canonical research delta: before=$(python -c 'import json,sys; print(json.load(sys.stdin)["before_researched"])' <<<"$accounting") after=$(python -c 'import json,sys; print(json.load(sys.stdin)["after_researched"])' <<<"$accounting") delta=$delta; foreman staged=$staged_research; orphan adoptions=$orphan_adoptions; genuinely new links=$genuinely_new_links."
          created_paths_missing="$(python - <<'PY'
          import json
          import csv
          from pathlib import Path
          created=json.loads(Path("/tmp/research-created-paths.json").read_text(encoding="utf-8"))
          with open("research/PRP_TRACKER.csv", newline="", encoding="utf-8") as fh:
              rows=list(csv.DictReader(fh))
          linked={r.get("Research Record") or "" for r in rows}
          missing=[p for p in created if "./" + p not in linked and p not in linked]
          print(len(missing))
          if missing:
              print("Missing created canonical links:", *missing, sep="\\n  ")
          PY
          )"
          echo "Research publication gate: created_records=$created_records; staged=$staged_research; staged_new_files=$staged_new_files; orphan_adoptions=$orphan_adoptions; genuinely_new_links=$genuinely_new_links; created_paths_missing=$created_paths_missing."
          if [ "$staged_new_files" -ne "$created_records" ]; then
            echo "ERROR: foreman admission count does not match files actually created by this pass."
            exit 1
          fi
          if [ "$created_paths_missing" -ne 0 ]; then
            echo "ERROR: one or more canonical research files created by this pass were not linked into the canonical tracker."
            exit 1
          fi
          if [ "$delta" -lt "$created_records" ]; then
            echo "ERROR: canonical research movement was smaller than the number of new records created by this pass."
            exit 1
          fi
          if [ "$delta" -ne "$newly_linked" ]; then
            echo "ERROR: canonical research count delta does not match newly linked research records."
            exit 1
          fi
          echo "Deep research updates accepted in this pass: $deepened_research."
          if [ "$created_records" -eq 0 ] && [ "$deepened_research" -gt 0 ]; then
            echo "Canonical research depth advanced without changing the research-linked count."
          fi

          git add research/RESEARCH_INBOX research/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/PHOTO_BACKLOG.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md
          if git diff --cached --quiet; then
            echo "Evidence packets were present but produced no new canonical records."
            exit 0
          fi

          git commit -m "Publish verified parallel pedal research"

          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              if git diff-tree --no-commit-id --name-only -r HEAD | grep -Eq '^(research/pedals/|research/PEDAL_INDEX\.json|index\.html|pedal-detail\.html)'; then
                echo "Canonical public research data changed; dispatching Pages deployment."
                published_sha="$(git rev-parse HEAD)"
                dispatched_at="$(date -u +%s)"
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/dispatches" -f ref=main
                echo "Waiting for production deployment containing $published_sha."
                deadline=$((SECONDS+600))
                git fetch origin main --quiet
                while [ "$SECONDS" -lt "$deadline" ]; do
                  deployed="$(gh run list --workflow deploy-pages.yml --branch main --limit 20 --json databaseId,headSha,status,conclusion --jq '.[] | select(.status=="completed" and .conclusion=="success") | "\(.databaseId) \(.headSha)"' | while read -r run_id deployed_sha; do
                    [ -n "$deployed_sha" ] || continue
                    if git merge-base --is-ancestor "$published_sha" "$deployed_sha" 2>/dev/null; then
                      echo "$run_id $deployed_sha"
                      break
                    fi
                  done)"
                  if [ -n "$deployed" ]; then
                    echo "Production deployment verified for $published_sha via descendant deployment $deployed."
                    exit 0
                  fi
                  sleep 10
                  git fetch origin main --quiet
                done
                echo "Timed out waiting for production deployment containing $published_sha."
                exit 1
              fi
              exit 0
            fi

            echo "Research publication race; rebuilding from newest main (attempt $attempt/5)."
            git fetch origin main
            git reset --hard origin/main
            # Preserve the downloaded worker artifacts across the race, then
            # reconstruct the verified inbox from those artifacts before synthesis.
            python scripts/research-foreman.py
            synth_result="$(python scripts/synthesize-research-inbox.py --only research-evidence/foreman-summary.json)"
            created_records="$(python -c 'import json,sys; print(json.load(sys.stdin)["created"])' <<<"$synth_result")"
            created_paths_json="$(python -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["created_paths"]))' <<<"$synth_result")"
            python scripts/sync_prp_catalog.py
            python scripts/sync-prp-tracker.py
            python scripts/sync-photo-backlog.py
            python scripts/build-research-queue.py
            python scripts/validate-archive.py
            git add research/RESEARCH_INBOX research/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/PHOTO_BACKLOG.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md
            if git diff --cached --quiet; then
              echo "Newest main already contains the synthesized state."
              exit 0
            fi
            git commit -m "Publish verified parallel pedal research"
          done

          exit 1

      - name: Continue active research frontier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          remaining="$(python - <<'PY'
          import json
          catalog=json.load(open("research/PEDAL_INDEX.json",encoding="utf-8"))
          print(sum(1 for p in catalog.get("pedals",[]) if p.get("catalog_role") != "variation" and str(p.get("research_level") or "").strip().lower() != "deep"))
          PY
          )"
          delta="${{ needs.foreman.outputs.canonical_delta }}"
          deepened="${{ steps.publish.outputs.deepened_research }}"
          if [ "$remaining" -gt 0 ] && { [ "${delta:-0}" -gt 0 ] || [ "${deepened:-0}" -gt 0 ]; }; then
            echo "Canonical research moved by $delta; active frontier has $remaining target(s). Dispatching next bounded pass."
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/research-worker-team.yml/dispatches" -f ref=main
          elif [ "$remaining" -gt 0 ]; then
            echo "No canonical research movement in this pass; stopping self-chain to avoid retry thrash."
          else
            echo "Active research frontier is empty; stopping self-chain."
          fi
