name: Research worker team

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    paths:
      - research/RESEARCH_WORKER_KICK

permissions:
  contents: write

concurrency:
  group: dirt-research-workers-v2
  cancel-in-progress: false

jobs:
  prepare:
    name: Build research worker matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json, sys
          rows=list(csv.DictReader(open("research/PRP_TRACKER.csv",newline="",encoding="utf-8")))
          targets=[{"builder":r["Builder"],"pedal":r["Pedal"]} for r in rows if r.get("Pedal Info")!="DONE"][:64]
          matrix={"include":[{"targets":targets[i:i+4]} for i in range(0,len(targets),4)]}
          print("matrix="+json.dumps(matrix,ensure_ascii=False,separators=(",",":")))
          print("Research targets:",len(targets),"workers:",len(matrix["include"]),file=sys.stderr)
          PY

  gather:
    name: Research gatherer ${{ strategy.job-index }}
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
      - name: Gather evidence for assigned targets
        run: |
          rm -rf worker-evidence
          mkdir -p worker-evidence
          python - <<'PY'
          import json, os, subprocess
          targets=json.loads(r''' ${{ toJSON(matrix.targets) }} ''')
          for i,t in enumerate(targets):
              env=os.environ.copy()
              env["RESEARCH_TARGET_BUILDER"]=t["builder"]
              env["RESEARCH_TARGET_PEDAL"]=t["pedal"]
              env["RESEARCH_OUT"]=f"worker-evidence/candidate-{i}.json"
              subprocess.run(["python","scripts/research-gatherer.py"],env=env,check=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-worker-${{ strategy.job-index }}
          path: worker-evidence/
          if-no-files-found: ignore
          retention-days: 1

  foreman:
    name: Research foreman
    needs: gather
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          path: research-evidence
      - name: Verify and admit only strong evidence packets
        run: python scripts/research-foreman.py
      - name: Publish foreman-approved evidence packets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/RESEARCH_INBOX
          if git diff --cached --quiet; then
            echo "No new verified research evidence packets."
            exit 0
          fi
          git commit -m "Stage verified parallel pedal research evidence"
          for attempt in 1 2 3 4 5; do
            if git push origin main; then exit 0; fi
            echo "Research evidence publish race; preserving approved packets and rebuilding on latest main."
            git fetch origin main
            packet_patch="$(mktemp)"
            git diff HEAD^ HEAD --binary -- research/RESEARCH_INBOX > "$packet_patch"
            git reset --hard origin/main
            if [ -s "$packet_patch" ]; then
              git apply --index "$packet_patch"
            fi
            rm -f "$packet_patch"
            git add research/RESEARCH_INBOX
            if git diff --cached --quiet; then
              echo "No approved research evidence remains after rebuilding against latest main."
              exit 0
            fi
            git commit -m "Stage verified parallel pedal research evidence"
          done
          exit 1
