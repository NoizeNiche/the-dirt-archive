name: Research worker team

on:
  workflow_dispatch:
  schedule:
    - cron: "17 17 * * 0"
  # Weekly research is an archive-growth lane. It remains bounded so research
  # can grow continuously without blocking photo recovery or visual product work.
  push:
    branches: [main]
    paths:
      - 'research/RESEARCH_WORKER_KICK'
      - 'research/RESEARCH_SOURCE_OVERRIDES.csv'
      - 'research/PEDAL_IDENTITY_ALIASES.csv'
  # Manual, source-change, and weekly passes all use the same bounded research worker.

permissions:
  contents: write
  actions: write

concurrency:
  group: dirt-archive-write-v2
  # Queue research passes instead of cancelling a pass that is already gathering evidence.
  cancel-in-progress: false

jobs:
  prepare:
    name: Build research worker matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          catalog=json.load(open("research/PEDAL_INDEX.json",encoding="utf-8"))
          pedals=catalog.get("pedals", [])
          # Every pedal now has a surface record. Deep research revisits those
          # records without blocking site-wide surface coverage.
          pending=[
              {"builder":p.get("company",""),"pedal":p.get("pedal","")}
              for p in pedals
              if p.get("catalog_role") != "variation"
              and str(p.get("research_level") or "").strip().lower() != "deep"
          ]
          pending=[p for p in pending if p["builder"] and p["pedal"]]
          pending.sort(key=lambda x:(x["builder"].casefold(),x["pedal"].casefold()))

          # Deep-researched records can still have thin visible prose. Build a
          # bounded quality queue from the same canonical research audit used in
          # CI so source-rich records can be re-evidenced without reopening the
          # catalog's research-complete state.
          quality_keys=set()
          try:
              import csv, subprocess
              from pathlib import Path
              audit_path=Path("/tmp/research-content-quality.csv")
              subprocess.run(
                  [sys.executable,"scripts/audit-research-content.py","--output",str(audit_path)],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
              for row in csv.DictReader(audit_path.open(newline="",encoding="utf-8")):
                  if row.get("Pattern") not in {"shallow_description","weak_sound_section","sibling_model_reference"}:
                      continue
                  record=Path(str(row.get("Research Record") or "").replace("./","",1))
                  if not record.is_file():
                      continue
                  first_heading=next((
                      line[2:].strip() for line in record.read_text(encoding="utf-8",errors="replace").splitlines()
                      if line.startswith("# ")
                  ),"")
                  if " — " not in first_heading:
                      continue
                  builder,pedal=first_heading.split(" — ",1)
                  quality_keys.add((builder.strip(),pedal.strip()))
          except Exception:
              quality_keys=set()

          catalog_keys={(str(p.get("company") or "").strip(),str(p.get("pedal") or "").strip()):p for p in pedals}
          existing_keys={(p["builder"],p["pedal"]) for p in pending}
          for builder,pedal in sorted(quality_keys,key=lambda x:(x[0].casefold(),x[1].casefold())):
              item=catalog_keys.get((builder,pedal))
              if not item or item.get("catalog_role")=="variation" or (builder,pedal) in existing_keys:
                  continue
              pending.append({"builder":builder,"pedal":pedal})
              existing_keys.add((builder,pedal))

          # The queue builder is the canonical ordering authority. Prefer its
          # explicit next_target so the first unresolved record cannot be
          # starved by the source-priority sort or by case/slug differences in
          # the raw catalog. Fall back to simple alphabetical order only when
          # the derived queue is unavailable.
          canonical_frontier = None
          try:
              queue=json.load(open("research/RESEARCH_QUEUE.json", encoding="utf-8"))
              nt=queue.get("next_target") or {}
              candidate={"builder":str(nt.get("builder","")).strip(),"pedal":str(nt.get("pedal","")).strip()}
              if candidate in pending:
                  canonical_frontier=candidate
          except Exception:
              pass
          if canonical_frontier is None and pending:
              canonical_frontier = pending[0]

          # Derive evidence readiness from the current verified inbox rather
          # than the old snapshot queue. The inbox is rewritten by the foreman
          # from actual worker evidence, so it cannot drift behind the catalog.
          verdicts = {}
          try:
              from pathlib import Path
              internal_markers = (
                  "prp identity", "archive parent:", "this pass adds only claims supported",
                  "earlier archive research is retained", "photo recovery is handled separately",
                  "sources checked in this pass", "deep research verification",
                  "the archive records only", "research confidence", "catalog type:",
              )
              residue_markers = (
                  "skip to content", "skip to navigation", "add to cart", "shopping cart",
                  "shop pay", "gear card", "javascript is disabled", "related brands",
                  "related tags", "reviews myfxdb user reviews", "where to find one",
                  "install effects database app",
              )
              def packet_is_source_clean(packet):
                  sources = packet.get("sources") if isinstance(packet.get("sources"), list) else []
                  clean = 0
                  for source in sources:
                      if not isinstance(source, dict):
                          continue
                      excerpt = " ".join(str(source.get(k) or "") for k in ("excerpt","bodyExcerpt")).lower()
                      if not excerpt or any(marker in excerpt for marker in internal_markers + residue_markers):
                          continue
                      if len(excerpt.strip()) < 40:
                          continue
                      clean += 1
                  return clean >= 1
              for packet_path in Path("research/RESEARCH_INBOX").rglob("*.json"):
                  try:
                      packet=json.load(open(packet_path, encoding="utf-8"))
                  except Exception:
                      continue
                  if packet.get("status")=="VERIFIED_EVIDENCE_STAGED" and packet_is_source_clean(packet):
                      key=(str(packet.get("builder","")).strip(),str(packet.get("pedal","")).strip())
                      if key[0] and key[1]:
                          verdicts[key]="EVIDENCE_READY"
          except Exception:
              pass

          # Prioritize targets with real exact-source coverage already wired in.
          # This lets the crew harvest source-rich records before spending most
          # of a bounded pass on targets that still need open-ended discovery.
          source_hosts = {}
          try:
              from urllib.parse import urlparse
              for item in pedals:
                  b = str(item.get("company","")).strip()
                  p = str(item.get("pedal","")).strip()
                  if not b or not p:
                      continue
                  key = (b, p)
                  for u in [
                      item.get("source_page"),
                      item.get("image_source_page"),
                      *([x for x in item.get("source_pages", [])] if isinstance(item.get("source_pages"), list) else []),
                  ]:
                      u = str(u or "").strip()
                      if u.startswith(("http://","https://")):
                          h = urlparse(u).hostname or ""
                          if h:
                              source_hosts.setdefault(key, set()).add(h.lower())

              try:
                  from pathlib import Path
                  for item in pedals:
                      b = str(item.get("company","")).strip()
                      p = str(item.get("pedal","")).strip()
                      record = str(item.get("research_record","") or "").replace("./","",1)
                      if not b or not p or not record:
                          continue
                      rp = Path(record)
                      if not rp.is_file():
                          continue
                      raw = rp.read_text(encoding="utf-8", errors="replace")
                      import re
                      for u in re.findall(r"https?://[^\s)>\"']+", raw):
                          h = urlparse(u.rstrip(".,;")).hostname or ""
                          if h:
                              source_hosts.setdefault((b,p), set()).add(h.lower())
              except Exception:
                  pass

              try:
                  cached_sources=json.load(open("research/RESEARCH_VERIFIED_SOURCE_CACHE.json", encoding="utf-8"))
                  for record in cached_sources.get("records", []):
                      b=str(record.get("builder","")).strip()
                      p=str(record.get("pedal","")).strip()
                      if not b or not p:
                          continue
                      for src in record.get("sources", []) or []:
                          u=str(src.get("url","")).strip()
                          if u.startswith(("http://","https://")):
                              h=urlparse(u).hostname or ""
                              if h:
                                  source_hosts.setdefault((b,p), set()).add(h.lower())
              except Exception:
                  pass

              import csv
              with open("research/RESEARCH_SOURCE_OVERRIDES.csv", newline="", encoding="utf-8") as fh:
                  for row in csv.DictReader(fh):
                      b = row.get("Builder","").strip()
                      p = row.get("Pedal","").strip()
                      u = row.get("Source URL","").strip()
                      if b and p and u.startswith(("http://","https://")):
                          h = urlparse(u).hostname or ""
                          if h:
                              source_hosts.setdefault((b,p), set()).add(h.lower())
          except Exception:
              pass

          priority = {"EVIDENCE_READY":0,"MORE_SOURCES_NEEDED":3,None:5,"":5,"NO_USABLE_EVIDENCE":6}
          def rank(row):
              key=(row["builder"],row["pedal"])
              hosts=len(source_hosts.get(key,set()))
              # Quality repairs are the active rehabilitation lane. Within that
              # lane, exact-source coverage still determines which records should
              # consume the bounded evidence budget first.
              quality_rank = 0 if key in quality_keys else 1
              if hosts >= 2:
                  coverage_rank = 0
              elif hosts == 1:
                  coverage_rank = 1
              else:
                  coverage_rank = 2
              verdict_rank = priority.get(verdicts.get(key), 5)
              return (
                  quality_rank,
                  coverage_rank if quality_rank == 0 else verdict_rank,
                  row["builder"].casefold(),
                  row["pedal"].casefold(),
              )
          pending.sort(key=rank)

          buckets={}
          for row in pending:
              buckets.setdefault((row["builder"][:1] or "#").upper(),[]).append(row)

          targets=[]
          # Always carry the canonical alphabetic frontier's first pending
          # target into the next bounded pass, even after source-priority
          # ranking reorders the remaining pool.
          if canonical_frontier:
              targets.append(canonical_frontier)
              bucket_key=(canonical_frontier["builder"][:1] or "#").upper()
              buckets[bucket_key]=[
                  r for r in buckets.get(bucket_key, [])
                  if not (r["builder"]==canonical_frontier["builder"] and r["pedal"]==canonical_frontier["pedal"])
              ]

          letters=sorted(buckets)
          while len(targets)<80 and any(buckets.values()):
              progressed=False
              for letter in letters:
                  if buckets[letter]:
                      targets.append(buckets[letter].pop(0))
                      progressed=True
                      if len(targets)>=800: break
              if not progressed: break
          TARGETS_PER_WORKER=20
          # An empty dynamic matrix is not a valid Actions matrix. Emit an empty
          # output instead so the gather job is skipped cleanly when the catalog
          # has no remaining deep-research targets.
          if not targets:
              print("matrix=")
              print("Research targets: 0; no gather workers needed.", file=sys.stderr)
          else:
              matrix={"include":[{"targets":targets[i:i+TARGETS_PER_WORKER]} for i in range(0,len(targets),TARGETS_PER_WORKER)]}
              print("matrix="+json.dumps(matrix,ensure_ascii=False,separators=(",",":")))
              print("Research targets:",len(targets),"workers:",len(matrix["include"]),file=sys.stderr)
          PY

  gather:
    name: Research gatherer ${{ strategy.job-index }}
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Gather evidence for assigned targets
        env:
          RESEARCH_WORKER_INDEX: ${{ strategy.job-index }}
          RESEARCH_WORKER_COUNT: "20"
          RESEARCH_TARGETS_PER_WORKER: "40"
          RESEARCH_TARGETS_JSON: ${{ toJSON(matrix.targets) }}
          RESEARCH_REQUEST_TIMEOUT_MS: "7000"
        run: node scripts/research-evidence-gather.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: research-worker-${{ strategy.job-index }}
          path: artifact/
          if-no-files-found: ignore
          retention-days: 1

  foreman:
    name: Research foreman
    needs: gather
    # Do not wake the publication foreman for an intentionally skipped empty gather matrix.
    # Still run it after real gather success or partial failure.
    if: ${{ needs.gather.result == 'success' || needs.gather.result == 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      canonical_delta: ${{ steps.publish.outputs.canonical_delta }}
      deepened_research: ${{ steps.publish.outputs.deepened_research }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: research-evidence
      - name: Ensure foreman inbox exists
        run: mkdir -p research-evidence
      - name: Verify and admit only strong evidence packets
        run: python scripts/research-foreman.py
      - name: Recover stranded verified inbox packets
        run: python scripts/include-stranded-research.py
      - name: Publish verified research and canonical records
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "canonical_delta=0" >> "$GITHUB_OUTPUT"
          echo "deepened_research=0" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research/RESEARCH_INBOX
          # The worker can also recover older VERIFIED_EVIDENCE_STAGED packets that
          # were stranded in the inbox by an interrupted or older publication pass.
          stranded_staged=$(python -c 'import json,pathlib; p=pathlib.Path("research-evidence/foreman-summary.json"); print(int(json.loads(p.read_text(encoding="utf-8")).get("staged",0)) if p.exists() else 0)')
          if git diff --cached --quiet && [ "${stranded_staged:-0}" -eq 0 ]; then
            echo "No new or stranded verified research evidence packets; stopping this bounded pass."
            exit 0
          fi

          # GITHUB_TOKEN pushes do not trigger another workflow, so synthesis
          # must happen in this same controlled publication pass.
          python - <<'PY'
          import csv, json
          from pathlib import Path
          with open("research/PRP_TRACKER.csv", newline="", encoding="utf-8") as fh:
              rows=list(csv.DictReader(fh))
          before_links = {
              f"{r.get('Builder','')}|{r.get('Pedal','')}": r.get('Research Record') or ""
              for r in rows
          }
          before_existing_records = sorted(
              "./" + p.as_posix().replace("\\","/")
              for p in Path("research/pedals").rglob("*.md")
          )
          Path("/tmp/research-publication-before.json").write_text(
              json.dumps({
                  "researched": sum(1 for r in rows if r.get("Pedal Info") == "DONE"),
                  "links": before_links,
                  "existing_records": before_existing_records,
              }, ensure_ascii=False),
              encoding="utf-8",
          )
          print("Captured pre-publication research state.")
          PY
          synth_result="$(python scripts/synthesize-research-inbox.py --only research-evidence/foreman-summary.json)"
          created_records="$(python -c 'import json,sys; print(json.load(sys.stdin)["created"])' <<<"$synth_result")"
          deepened_research="$(python -c 'import json,sys; print(json.load(sys.stdin).get("deepened",0))' <<<"$synth_result")"
          orphan_packet_adoptions="$(python -c 'import json,sys; print(json.load(sys.stdin).get("adopted",0))' <<<"$synth_result")"
          created_paths_json="$(python -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["created_paths"]))' <<<"$synth_result")"
          printf '%s' "$created_paths_json" > /tmp/research-created-paths.json
          python scripts/sync_prp_catalog.py
          python scripts/sync-prp-tracker.py
          python scripts/sync-photo-backlog.py
          python scripts/build-research-queue.py
          python scripts/build-pedal-facets.py
          python scripts/validate-archive.py

          staged_research="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research-evidence/foreman-summary.json")
          print(int(json.loads(p.read_text(encoding="utf-8")).get("staged",0)) if p.exists() else 0)
          PY
          )"
          # deepened_research is returned directly by the synthesizer.
          python - <<'PY'
          import csv, json
          from pathlib import Path
          before=json.loads(Path("/tmp/research-publication-before.json").read_text(encoding="utf-8"))
          with open("research/PRP_TRACKER.csv", newline="", encoding="utf-8") as fh:
              rows=list(csv.DictReader(fh))
          after_links = {
              f"{r.get('Builder','')}|{r.get('Pedal','')}": r.get('Research Record') or ""
              for r in rows
          }
          after_researched = sum(1 for r in rows if r.get("Pedal Info") == "DONE")
          before_researched = int(before["researched"])
          delta = after_researched - before_researched

          newly_linked = {
              k:v for k,v in after_links.items()
              if not before["links"].get(k) and v
          }
          existing_records = set(before.get("existing_records", []))
          orphan_adoptions = {
              k:v for k,v in newly_linked.items()
              if v in existing_records
          }
          genuinely_new_links = {
              k:v for k,v in newly_linked.items()
              if v not in existing_records
          }

          Path("/tmp/research-publication-accounting.json").write_text(
              json.dumps({
                  "before_researched": before_researched,
                  "after_researched": after_researched,
                  "canonical_delta": delta,
                  "deepened": 0,
                  "newly_linked": len(newly_linked),
                  "orphan_adoptions": len(orphan_adoptions),
                  "genuinely_new_links": len(genuinely_new_links),
              }, ensure_ascii=False),
              encoding="utf-8",
          )

          print(
              f"Research accounting: delta={delta}; newly_linked={len(newly_linked)}; "
              f"orphan_adoptions={len(orphan_adoptions)}; genuinely_new_links={len(genuinely_new_links)}"
          )
          PY

          accounting="$(cat /tmp/research-publication-accounting.json)"
          delta="$(python -c 'import json,sys; print(json.load(sys.stdin)["canonical_delta"])' <<<"$accounting")"
          # deepened_research was measured directly from the synthesizer result.
          orphan_adoptions="$(python -c 'import json,sys; print(json.load(sys.stdin)["orphan_adoptions"])' <<<"$accounting")"
          genuinely_new_links="$(python -c 'import json,sys; print(json.load(sys.stdin)["genuinely_new_links"])' <<<"$accounting")"
          echo "canonical_delta=$delta" >> "$GITHUB_OUTPUT"
          echo "deepened_research=$deepened_research" >> "$GITHUB_OUTPUT"
          echo "Canonical research delta: before=$(python -c 'import json,sys; print(json.load(sys.stdin)["before_researched"])' <<<"$accounting") after=$(python -c 'import json,sys; print(json.load(sys.stdin)["after_researched"])' <<<"$accounting") delta=$delta; foreman staged=$staged_research; orphan adoptions=$orphan_adoptions; genuinely new links=$genuinely_new_links."
          created_paths_missing="$(python - <<'PY'
          import json
          import csv
          from pathlib import Path
          created=json.loads(Path("/tmp/research-created-paths.json").read_text(encoding="utf-8"))
          with open("research/PRP_TRACKER.csv", newline="", encoding="utf-8") as fh:
              rows=list(csv.DictReader(fh))
          linked={r.get("Research Record") or "" for r in rows}
          missing=[p for p in created if "./" + p not in linked and p not in linked]
          print(len(missing))
          if missing:
              print("Missing created canonical links:", *missing, sep="\\n  ")
          PY
          )"
          publication_actions=$((created_records+deepened_research))
          direct_publication_actions=$((publication_actions-orphan_packet_adoptions))
          echo "Research publication gate: created_records=$created_records; deepened_research=$deepened_research; staged=$staged_research; publication_actions=$publication_actions; orphan_packet_adoptions=$orphan_packet_adoptions; direct_publication_actions=$direct_publication_actions; orphan_adoptions=$orphan_adoptions; genuinely_new_links=$genuinely_new_links; created_paths_missing=$created_paths_missing."
          # Some foreman-admitted packets can be legitimate no-ops (for example,
          # duplicate/alias evidence that adds no new canonical depth). Do not throw
          # away the rest of a successful batch just because one packet did not
          # produce a canonical mutation. The hard invariant is that publication
          # may never exceed the number of admitted packets.
          if [ "${direct_publication_actions:-0}" -gt "${staged_research:-0}" ]; then
            echo "ERROR: canonical publication actions exceed foreman admissions."
            exit 1
          fi
          if [ "${direct_publication_actions:-0}" -lt "${staged_research:-0}" ]; then
            skipped_admissions=$((staged_research-direct_publication_actions))
            echo "Foreman admissions with no canonical mutation in this pass: $skipped_admissions"
          fi
          if [ "${created_paths_missing:-0}" -ne 0 ]; then
            echo "ERROR: one or more canonical research files created by this pass were not linked into the canonical tracker."
            exit 1
          fi
          if [ "${created_records:-0}" -gt 0 ] && [ "${delta:-0}" -ne "${created_records:-0}" ]; then
            echo "ERROR: canonical research count delta does not match the number of genuinely new research records created by this pass."
            exit 1
          fi
          if [ "${delta:-0}" -ne "${newly_linked:-0}" ]; then
            echo "ERROR: canonical research count delta does not match newly linked research records."
            exit 1
          fi
          echo "Deep research updates accepted in this pass: $deepened_research; verified orphan packets adopted: $orphan_packet_adoptions."
          if [ "${created_records:-0}" -eq 0 ] && [ "${deepened_research:-0}" -gt 0 ]; then
            echo "Canonical research depth advanced without changing the research-linked count."
          fi

          git add research/RESEARCH_INBOX research/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/PHOTO_BACKLOG.csv research/RESEARCH_QUEUE.json research/PEDAL_FACETS.json CURRENT_STATE.md
          if git diff --cached --quiet; then
            echo "Evidence packets were present but produced no new canonical records."
            exit 0
          fi

          git commit -m "Publish verified parallel pedal research"

          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              published_sha="$(git rev-parse HEAD)"
              echo "Published bounded research batch: $published_sha"
              echo "Deploy-on-main owns Pages publication; this research lane stops after its finite pass."
              exit 0
            fi

            echo "Research publication race; rebuilding from newest main (attempt $attempt/5)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/research-foreman.py
            synth_result="$(python scripts/synthesize-research-inbox.py --only research-evidence/foreman-summary.json)"
            created_records="$(python -c 'import json,sys; print(json.load(sys.stdin)["created"])' <<<"$synth_result")"
            created_paths_json="$(python -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["created_paths"]))' <<<"$synth_result")"
            python scripts/sync_prp_catalog.py
            python scripts/sync-prp-tracker.py
            python scripts/sync-photo-backlog.py
            python scripts/build-research-queue.py
            python scripts/build-pedal-facets.py
            python scripts/validate-archive.py
            git add research/RESEARCH_INBOX research/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/PHOTO_BACKLOG.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md
            if git diff --cached --quiet; then
              echo "Newest main already contains the synthesized state."
              exit 0
            fi
            git commit -m "Publish verified parallel pedal research"
          done

          exit 1

      - name: Continue bounded research lane
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPENED_RESEARCH: ${{ steps.publish.outputs.deepened_research || '0' }}
          CANONICAL_DELTA: ${{ steps.publish.outputs.canonical_delta || '0' }}
        run: |
          if [ "${DEEPENED_RESEARCH:-0}" -gt 0 ] || [ "${CANONICAL_DELTA:-0}" -gt 0 ]; then
            echo "Research movement landed; queueing the next bounded research pass."
            active="$(gh run list --workflow research-worker-team.yml --branch main --limit 10 --json status --jq '[.[] | select(.status != "completed")] | length')"
            if [ "$active" -le 1 ]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/research-worker-team.yml/dispatches" -f ref=main
            else
              echo "Another research pass is already queued or active; no duplicate dispatch."
            fi
          else
            echo "No canonical research movement in this pass; stopping self-chain to avoid retry thrash."
          fi
