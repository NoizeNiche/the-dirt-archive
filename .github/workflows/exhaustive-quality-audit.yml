name: Exhaustive detail and photo quality audit

on:
  push:
    branches: [main]
    paths:
      - 'pedal-detail.html'
      - 'assets/css/archive-detail.css'
      - 'assets/js/archive-detail.js'
      - 'assets/js/archive-core.js'
      - 'research/PEDAL_INDEX.json'
      - 'assets/pedals/**'
      - 'scripts/audit-detail-pages.js'
      - 'scripts/audit-photo-content.py'
      - 'scripts/audit-pictured-photo-hash-collisions.py'
      - 'scripts/build-photo-hash-review.py'
      - 'scripts/audit-photo-identity.py'
      - 'scripts/audit-photo-revision-fidelity.py'
      - 'research/PHOTO_DIRECT_IMAGE_OVERRIDES.csv'
      - 'research/PHOTO_MANUAL_REVIEW.csv'
      - 'scripts/browser-photo-cache.mjs'
      - 'research/PHOTO_SOURCE_BLOCKLIST.json'
      - '.github/workflows/exhaustive-quality-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Build technical facet index
        run: python scripts/build-pedal-facets.py

      - name: Validate archive
        run: python scripts/validate-archive.py

      - name: Start local archive server
        run: |
          node scripts/serve-static.js >/tmp/dirt-archive-audit-server.log 2>&1 &
          echo $! > /tmp/dirt-archive-audit-server.pid

      - name: Audit every public pedal detail page
        env:
          DETAIL_AUDIT_WORKERS: 8
        run: node scripts/audit-detail-pages.js

      - name: Install OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install pillow pytesseract

      - name: Scan every archived photo for donation overlays and corrupt assets
        run: python scripts/audit-photo-content.py --mode all --workers 8 --output photo-content-audit.csv

      - name: Audit suspicious cross-identity photo reuse
        run: python scripts/audit-pictured-photo-hash-collisions.py --output photo-hash-collision-audit.csv

      - name: Build same-builder photo review roster
        run: python scripts/build-photo-hash-review.py

      - name: Audit photographed pedal identity
        run: python scripts/audit-photo-identity.py --workers 8 --output photo-identity-audit.csv

      - name: Audit photographed pedal revision fidelity
        run: python scripts/audit-photo-revision-fidelity.py

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dirt-archive-exhaustive-audit
          path: |
            detail-page-audit-report.json
            photo-content-audit.csv
            photo-hash-collision-audit.csv
            research/PHOTO_HASH_REVIEW.csv
            photo-identity-audit.csv
            research/PHOTO_REVISION_AUDIT.csv
            /tmp/dirt-archive-audit-server.log
          if-no-files-found: warn
