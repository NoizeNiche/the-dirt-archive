name: Parallel photo catch-up

on:
  workflow_dispatch:
  push:
    paths:
      - research/PHOTO_PARALLEL_KICK

permissions:
  contents: write

concurrency:
  group: dirt-photo-parallel
  cancel-in-progress: true

jobs:
  prepare:
    name: Build photo matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - id: matrix
        name: Collect researched photo-pending records
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json
          rows = list(csv.DictReader(open("research/PRP_TRACKER.csv", newline="", encoding="utf-8")))
          targets = [
              {"builder": r["Builder"], "pedal": r["Pedal"]}
              for r in rows
              if r.get("Pedal Info") == "DONE" and r.get("Picture") != "DONE"
          ]
          print("matrix=" + json.dumps({"include": targets}, ensure_ascii=False, separators=(",", ":")))
          print(f"Prepared {len(targets)} photo targets.", file=__import__("sys").stderr)
          PY

  recover:
    name: Recover ${{ matrix.builder }} / ${{ matrix.pedal }}
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install tooling
        run: |
          python -m pip install --disable-pip-version-check pillow
          npm install --no-save playwright@1.63.0

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Ensure Chromium
        shell: bash
        run: |
          if compgen -G "$HOME/.cache/ms-playwright/chromium-*" > /dev/null; then
            echo "Playwright Chromium restored from cache."
          else
            echo "Playwright Chromium cache miss; installing Chromium and dependencies."
            npx playwright install --with-deps chromium
          fi

      - name: Clear known-invalid photo state
        env:
          PHOTO_RESET_TARGET_BUILDER: ${{ matrix.builder }}
          PHOTO_RESET_TARGET_PEDAL: ${{ matrix.pedal }}
        run: python scripts/reset-photo-recovery-targets.py

      - name: Apply current exact source leads
        run: python scripts/apply-photo-source-overrides.py

      - name: Try verified direct image fallback
        shell: bash
        env:
          PHOTO_BROWSER_TARGET_BUILDER: ${{ matrix.builder }}
          PHOTO_BROWSER_TARGET_PEDAL: ${{ matrix.pedal }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          from PIL import Image

          builder = os.environ["PHOTO_BROWSER_TARGET_BUILDER"]
          pedal = os.environ["PHOTO_BROWSER_TARGET_PEDAL"]
          index = json.loads(Path("research/PEDAL_INDEX.json").read_text(encoding="utf-8"))
          entry = next((p for p in index.get("pedals", []) if p.get("company") == builder and p.get("pedal") == pedal), None)
          if not entry or entry.get("image_source_page_verified") is not True:
              print("No verified direct-image fallback eligible for this target.")
              raise SystemExit(0)

          url = str(entry.get("image_source_url") or "").strip()
          if not re.match(r"^https?://", url, re.I) or not re.search(r"\.(?:jpe?g|png|webp|gif)(?:[?#].*)?$", url, re.I):
              print("Verified target has no directly downloadable image URL.")
              raise SystemExit(0)

          def slug(value):
              return re.sub(r"[^a-z0-9]+", "-", str(value or "").lower()).strip("-") or "unknown"

          target = Path("assets/pedals") / slug(builder) / slug(pedal) / "primary.source"
          target.parent.mkdir(parents=True, exist_ok=True)
          tmp = target.with_suffix(".download")
          cmd = [
              "curl", "-L", "--silent", "--show-error", "--fail", "--compressed",
              "--connect-timeout", "4", "--max-time", "15",
              "-A", "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36",
              "-H", "Accept: image/avif,image/webp,image/apng,image/jpeg,image/png,image/*,*/*;q=0.8",
              "-o", str(tmp), url,
          ]
          try:
              proc = subprocess.run(cmd, capture_output=True, text=True, timeout=18)
          except Exception as exc:
              print(f"Direct image curl failed: {exc}")
              raise SystemExit(0)
          if proc.returncode != 0 or not tmp.exists():
              print("Direct image curl did not return the verified image.")
              raise SystemExit(0)

          data = tmp.read_bytes()
          if len(data) < 3000:
              tmp.unlink(missing_ok=True)
              print("Direct image payload was too small.")
              raise SystemExit(0)

          try:
              with Image.open(io.BytesIO(data)) as image:
                  if image.width <= 0 or image.height <= 0:
                      raise ValueError("invalid image dimensions")
                  image.verify()
          except Exception as exc:
              tmp.unlink(missing_ok=True)
              print(f"Direct image failed image validation: {exc}")
              raise SystemExit(0)

          target.write_bytes(data)
          tmp.unlink(missing_ok=True)
          print(f"Staged verified direct image for {builder} / {pedal}: {target}")
          PY

      - name: Probe exact CBC Harmonic Percolator YouTube search
        shell: bash
        run: |
          mkdir -p artifact
          python - <<'PY'
          import json, re, subprocess, html, urllib.parse
          from pathlib import Path
          q = urllib.parse.quote('CBC Pedals Harmonic Percolator')
          url = 'https://www.youtube.com/results?search_query=' + q
          p = subprocess.run([
              'curl','-L','--silent','--show-error','--compressed',
              '--connect-timeout','3','--max-time','8',
              '-A','Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36',
              '-H','Accept-Language: en-US,en;q=0.9',
              url
          ], capture_output=True, text=True, errors='ignore', timeout=10)
          s = p.stdout or ''
          out = []
          seen = set()
          for m in re.finditer(r'"videoId":"([^"]+)"[\s\S]{0,1200}?"title":\{"runs":\[\{"text":"([^"]+)', s):
              vid = m.group(1)
              title = html.unescape(m.group(2))
              if vid in seen: continue
              seen.add(vid)
              out.append({
                'videoId': vid,
                'title': title,
                'watchUrl': 'https://www.youtube.com/watch?v='+vid,
                'maxres': 'https://i.ytimg.com/vi/'+vid+'/maxresdefault.jpg',
                'hq': 'https://i.ytimg.com/vi/'+vid+'/hqdefault.jpg'
              })
          out = out[:80]
          Path('artifact/cbc-harmonic-percolator-youtube.json').write_text(
              json.dumps({'query':'CBC Pedals Harmonic Percolator','results':out},ensure_ascii=False,indent=2)+'\n',
              encoding='utf-8'
          )
          print(json.dumps({'query':'CBC Pedals Harmonic Percolator','results':out},ensure_ascii=False,indent=2))
          PY

      - name: Recover exact pedal photo
        continue-on-error: true
        env:
          PHOTO_BROWSER_TARGET_BUILDER: ${{ matrix.builder }}
          PHOTO_BROWSER_TARGET_PEDAL: ${{ matrix.pedal }}
          PHOTO_BROWSER_IMAGE_SEARCH: "true"
          PHOTO_BROWSER_DEEP_REVIEW: "true"
          PHOTO_BROWSER_REVISIT_PARKED: "false"
          PHOTO_BROWSER_ALLOW_PARKED_RETRY: "true"
          PHOTO_BROWSER_PAGE_TIMEOUT_MS: "7000"
          PHOTO_BROWSER_SEARCH_TIMEOUT_MS: "5000"
          PHOTO_BROWSER_IMAGE_TIMEOUT_MS: "4000"
          PHOTO_BROWSER_CANDIDATE_LIMIT: "6"
          PHOTO_BROWSER_SEARCH_VERIFY_LIMIT: "5"
          PHOTO_BROWSER_RECOVERY_DEADLINE_MS: "30000"
          PHOTO_BROWSER_FRESH_RECOVERY_DEADLINE_MS: "20000"
          PHOTO_BROWSER_MAX_RECOVERY_ATTEMPTS: "4"
          PHOTO_BROWSER_MAX_DEEP_REVIEW_CYCLES: "6"
        run: node scripts/browser-photo-cache.mjs

      - name: Package verified recovery result
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact
          # Pedal and builder names often contain spaces. Use null-delimited
          # paths so successful browser recoveries cannot be lost while packaging.
          find assets/pedals -type f -name '*.source' -print0 |
            while IFS= read -r -d '' f; do
              cp --parents "$f" artifact/
            done
          python - <<'PY'
          import json
          from pathlib import Path
          builder = ${{ toJSON(matrix.builder) }}
          pedal = ${{ toJSON(matrix.pedal) }}
          catalog = json.loads(Path("research/PEDAL_INDEX.json").read_text(encoding="utf-8"))
          target = next(
              p for p in catalog.get("pedals", [])
              if p.get("company") == builder and p.get("pedal") == pedal
          )
          result = {
              "builder": builder,
              "pedal": pedal,
              "image": target.get("image"),
              "image_source_url": target.get("image_source_url"),
              "image_source_page": target.get("image_source_page"),
          }
          Path("artifact/photo-recovery-result.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-${{ strategy.job-index }}-${{ matrix.builder }}-${{ matrix.pedal }}
          path: artifact/
          if-no-files-found: ignore
          retention-days: 1

  merge:
    name: Merge recovered photos
    needs: [recover]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download recovery artifacts
        uses: actions/download-artifact@v5
        with:
          path: recovery-artifacts

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Clear known-invalid photo state
        run: python scripts/reset-photo-recovery-targets.py

      - name: Merge recovered sources and provenance
        run: python scripts/merge-photo-recovery-results.py

      - name: Convert and synchronize photos
        run: python scripts/cache-pedal-images.py

      - name: Synchronize research/photo state
        run: |
          python scripts/sync-prp-tracker.py
          python scripts/build-research-queue.py
          python scripts/sync-photo-backlog.py
          python scripts/prune-photo-review-queue.py
          python scripts/refresh-image-cache-report.py
          python scripts/verify-photo-state.py

      - name: Publish merged recovery batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv research/PHOTO_BACKLOG.csv
          if git diff --cached --quiet; then
            echo "No parallel photo recoveries succeeded."
            exit 0
          fi
          git commit -m "Archive parallel verified pedal photos"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Parallel photo push race; rebuilding metadata on latest main (attempt $attempt/5)."
            git fetch origin main
            mkdir -p /tmp/recovered-assets
            rsync -a --include='*.webp' --include='*.source' --exclude='*' assets/pedals/ /tmp/recovered-assets/ || true
            git reset --hard origin/main
            rsync -a /tmp/recovered-assets/ assets/pedals/ || true
            python scripts/cache-pedal-images.py
            python scripts/sync-prp-tracker.py
            python scripts/sync-photo-backlog.py
            python scripts/prune-photo-review-queue.py
            python scripts/refresh-image-cache-report.py
            python scripts/verify-photo-state.py
            git add assets/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv research/PHOTO_BACKLOG.csv
            git commit -m "Archive parallel verified pedal photos" || true
          done
          exit 1
