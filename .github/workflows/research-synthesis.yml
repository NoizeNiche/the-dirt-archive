name: Synthesize verified research

on:
  # Canonical research publication is owned by research-worker-team.yml.
  # Keep this lane manual-only so it cannot race the active foreman.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dirt-research-synthesis
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Synthesize only foreman-approved research
        run: python scripts/synthesize-research-inbox.py

      - name: Synchronize canonical research state
        run: |
          python scripts/sync_prp_catalog.py
          python scripts/sync-prp-tracker.py
          python scripts/sync-photo-backlog.py
          python scripts/build-research-queue.py
          python scripts/validate-archive.py

      - name: Publish canonical research records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/PHOTO_BACKLOG.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md
          if git diff --cached --quiet; then
            echo "No new canonical research records."
            exit 0
          fi
          git commit -m "Publish verified pedal research records"
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              if git diff-tree --no-commit-id --name-only -r HEAD | grep -Eq '^(research/pedals/|research/PEDAL_INDEX\.json|index\.html|pedal-detail\.html)'; then
                echo "Canonical public research data changed; dispatching Pages deployment."
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-pages.yml/dispatches" -f ref=main
              fi
              exit 0
            fi
            echo "Research synthesis push race; rebuilding from latest main (attempt $attempt/5)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/synthesize-research-inbox.py
            python scripts/sync_prp_catalog.py
            python scripts/sync-prp-tracker.py
            python scripts/sync-photo-backlog.py
            python scripts/build-research-queue.py
            python scripts/validate-archive.py
            git add research/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/PHOTO_BACKLOG.csv research/RESEARCH_QUEUE.json CURRENT_STATE.md
            if git diff --cached --quiet; then
              echo "Newest main already contains the synthesized state."
              exit 0
            fi
            git commit -m "Publish verified pedal research records"
          done
          exit 1
