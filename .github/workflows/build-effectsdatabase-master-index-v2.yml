name: Build exhaustive Effects Database master dirt index
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests python-docx
      - name: Extract every Effects Database record
        run: |
          cat > /tmp/build.py <<'PY'
          from pathlib import Path
          from collections import OrderedDict
          import re, time, requests
          from docx import Document
          from docx.shared import Pt, Inches
          from docx.enum.text import WD_ALIGN_PARAGRAPH

          session=requests.Session()
          session.headers.update({'User-Agent':'The-Dirt-Archive/1.0','Accept':'text/markdown,text/plain;q=0.9,*/*;q=0.8','Accept-Language':'en-US,en;q=0.9'})
          cats=OrderedDict([
            ('Overdrive','https://www.effectsdatabase.com/type/overdrive/pedal'),
            ('Distortion','https://www.effectsdatabase.com/type/distortion/pedal'),
            ('Fuzz','https://www.effectsdatabase.com/type/fuzz/pedal'),
          ])
          expected={'Overdrive':5414,'Distortion':3455,'Fuzz':4211}
          root=Path('research/effectsdatabase-master-extract'); root.mkdir(parents=True,exist_ok=True)

          def reader(url):
              r=session.post('https://r.jina.ai/',data={'url':url},timeout=120)
              r.raise_for_status(); return r.text

          def parse(text):
              pos=text.lower().find('gear in this category')
              block=text[pos:] if pos>=0 else text
              rows=[]
              for raw in block.splitlines():
                  line=' '.join(raw.strip().split())
                  m=re.match(r'^(\d+)\.\s+\[([^\]]+)\]\([^\n]*\)$',line)
                  if m: rows.append((int(m.group(1)),m.group(2).strip())); continue
                  m=re.match(r'^(\d+)\.\s+(.+)$',line)
                  if m:
                      name=m.group(2).strip()
                      if name and not name.lower().startswith('page ') and ' products' not in name.lower(): rows.append((int(m.group(1)),name))
              seen=set(); out=[]
              for x in rows:
                  if x not in seen: seen.add(x); out.append(x)
              return out

          all_data=OrderedDict()
          for cat,base in cats.items():
              rec=[]
              for page in range(1,101):
                  url=base if page==1 else f'{base}?page={page}'
                  rows=parse(reader(url))
                  print(f'{cat}: page {page}: {len(rows)} rows; {rows[0] if rows else None} ... {rows[-1] if rows else None}')
                  if not rows: raise RuntimeError(f'{cat}: empty page {page}')
                  rec.extend(rows)
                  if max(n for n,_ in rec)>=expected[cat]: break
                  time.sleep(.35)
              seen=set(); final=[]
              for x in rec:
                  if x not in seen: seen.add(x); final.append(x)
              final.sort(key=lambda x:x[0])
              if len(final)!=expected[cat] or [n for n,_ in final] != list(range(1,expected[cat]+1)):
                  raise RuntimeError(f'{cat}: verification failed: {len(final)} unique rows; last={final[-1][0] if final else None}; expected={expected[cat]}')
              all_data[cat]=final
              (root/f'{cat.lower()}-all.tsv').write_text('\n'.join(f'{n}\t{name}' for n,name in final)+'\n',encoding='utf-8')

          total=sum(len(v) for v in all_data.values())
          assert total==13080
          doc=Document(); s=doc.sections[0]
          s.top_margin=Inches(.5); s.bottom_margin=Inches(.5); s.left_margin=Inches(.55); s.right_margin=Inches(.55)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER; r=p.add_run('EFFECTS DATABASE MASTER DIRT PEDAL INDEX'); r.bold=True; r.font.size=Pt(20)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER; r=p.add_run('Every listed Overdrive, Distortion, and Fuzz pedal'); r.italic=True
          p=doc.add_paragraph(); p.add_run('Source: ').bold=True; p.add_run('Effects Database (effectsdatabase.com)')
          p=doc.add_paragraph(); p.add_run('Extraction date: ').bold=True; p.add_run(time.strftime('%Y-%m-%d'))
          p=doc.add_paragraph(); p.add_run('Content: ').bold=True; p.add_run('Pedal names only; all numbered category-index entries retained.')
          doc.add_page_break(); doc.add_heading('MASTER COUNTS',1)
          for cat,recs in all_data.items(): doc.add_paragraph(f'{cat}: {len(recs):,}')
          doc.add_paragraph(f'TOTAL: {total:,}')
          for cat,recs in all_data.items():
              doc.add_page_break(); doc.add_heading(cat.upper(),1)
              for n,name in recs:
                  p=doc.add_paragraph(); p.paragraph_format.space_after=Pt(0); p.add_run(f'{n}. ').bold=True; p.add_run(name)
          doc.save('research/effectsdatabase-master-dirt-pedal-index.docx')
          (root/'master.tsv').write_text('\n'.join(f'{cat}\t{n}\t{name}' for cat,recs in all_data.items() for n,name in recs)+'\n',encoding='utf-8')
          print('FINAL', {k:len(v) for k,v in all_data.items()}, total)
          PY
          python /tmp/build.py
      - name: Verify complete totals and continuous numbering
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          exp={'overdrive':5414,'distortion':3455,'fuzz':4211}; total=0
          for c,e in exp.items():
              rows=[x for x in Path(f'research/effectsdatabase-master-extract/{c}-all.tsv').read_text().splitlines() if x]
              nums=[int(x.split('\t',1)[0]) for x in rows]
              assert len(rows)==e,(c,len(rows),e)
              assert nums==list(range(1,e+1)), f'{c}: numbering gap/repeat'
              total+=len(rows)
          assert total==13080
          with zipfile.ZipFile('research/effectsdatabase-master-dirt-pedal-index.docx') as z: assert z.testzip() is None
          print('VERIFIED COMPLETE MASTER INDEX:', total)
          PY
      - name: Commit generated master files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/effectsdatabase-master-dirt-pedal-index.docx research/effectsdatabase-master-extract/
          git commit -m 'Add verified complete Effects Database dirt index' || exit 0
          git push
      - name: Upload master document
        uses: actions/upload-artifact@v4
        with:
          name: effects-database-master-dirt-pedal-index-v2
          path: research/effectsdatabase-master-dirt-pedal-index.docx
          retention-days: 30
