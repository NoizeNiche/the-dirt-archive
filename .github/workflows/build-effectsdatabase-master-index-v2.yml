name: Build complete Effects Database pedal-name index v2

on:
  push:
    paths:
      - '.github/workflows/build-effectsdatabase-master-index-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade requests python-docx
      - name: Harvest all pedal pages and build DOCX
        run: |
          cat > /tmp/build.py <<'PY'
          from collections import OrderedDict
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import re, time, requests, zipfile
          from docx import Document
          from docx.shared import Pt, Inches
          from docx.enum.text import WD_ALIGN_PARAGRAPH

          C=OrderedDict([
            ('Overdrive',('https://www.effectsdatabase.com/type/overdrive/pedal',53,5365)),
            ('Distortion',('https://www.effectsdatabase.com/type/distortion/pedal',33,3390)),
            ('Fuzz',('https://www.effectsdatabase.com/type/fuzz/pedal',41,4126)),
          ])
          OUT=Path('research/effectsdatabase-master-extract'); OUT.mkdir(parents=True,exist_ok=True)

          def fetch(url):
              for attempt in range(5):
                  try:
                      r=requests.post('https://r.jina.ai/',data={'url':url},timeout=75,headers={'User-Agent':'The-Dirt-Archive/2.0','Accept':'text/markdown,text/plain,*/*'})
                      if r.status_code==200 and r.text: return r.text
                      if r.status_code in (429,500,502,503,504): time.sleep(2**attempt); continue
                      r.raise_for_status()
                  except requests.RequestException:
                      if attempt==4: raise
                      time.sleep(2**attempt)
              raise RuntimeError('Reader failed '+url)

          def parse(text):
              rows=[]
              in_catalog=False
              for line in text.splitlines():
                  line=' '.join(line.strip().split())
                  if 'Gear in this category' in line:
                      in_catalog=True; continue
                  if not in_catalog: continue
                  if re.match(r'^\*\s+(?:«|‹|\d|…)',line):
                      if rows: break
                      continue
                  m=re.match(r'^(\d+)\.\s+(.*)$',line)
                  if not m: continue
                  num=int(m.group(1)); rest=m.group(2).strip()
                  if rest.startswith('[') and '](' in rest:
                      name=rest[1:rest.find('](')]
                  else:
                      name=rest
                  name=name.strip()
                  if name: rows.append((num,name))
              if not rows: raise RuntimeError('no numbered catalog rows found')
              nums=[n for n,_ in rows]
              expected=list(range(nums[0],nums[0]+len(nums)))
              if nums!=expected: raise RuntimeError(f'nonconsecutive page numbers: {nums[:3]}...{nums[-3:]}')
              return rows

          def one(args):
              cat,base,page=args
              url=base if page==0 else f'{base}?page={page}'
              rows=parse(fetch(url))
              print(f'{cat} page {page}: {len(rows)} rows, {rows[0]} ... {rows[-1]}',flush=True)
              return page,rows

          data=OrderedDict()
          for cat,(base,last,expected) in C.items():
              pages={}
              with ThreadPoolExecutor(max_workers=6) as ex:
                  fs=[ex.submit(one,(cat,base,p)) for p in range(last+1)]
                  for f in as_completed(fs):
                      p,rows=f.result(); pages[p]=rows
              records=[x for p in range(last+1) for x in pages[p]]
              nums=[n for n,_ in records]
              if nums != list(range(1,expected+1)):
                  raise RuntimeError(f'{cat}: expected sequential 1..{expected}, got {len(records)} with last={nums[-1] if nums else None}')
              data[cat]=[name for _,name in records]
              (OUT/f'{cat.lower()}-all.txt').write_text('\n'.join(data[cat])+'\n',encoding='utf-8')
              (OUT/f'{cat.lower()}-all.tsv').write_text('\n'.join(f'{i}\t{name}' for i,name in enumerate(data[cat],1))+'\n',encoding='utf-8')

          total=sum(map(len,data.values()))
          assert total==12881
          doc=Document(); sec=doc.sections[0]
          sec.top_margin=Inches(.45); sec.bottom_margin=Inches(.45); sec.left_margin=Inches(.55); sec.right_margin=Inches(.55)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER
          r=p.add_run('EFFECTS DATABASE MASTER DIRT PEDAL INDEX'); r.bold=True; r.font.size=Pt(20)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER
          r=p.add_run('Complete pedal-name index: Overdrive / Distortion / Fuzz'); r.italic=True
          p=doc.add_paragraph(); p.add_run('Source: ').bold=True; p.add_run('Effects Database, effectsdatabase.com')
          p=doc.add_paragraph(); p.add_run('Extraction date: ').bold=True; p.add_run('September 16, 2026')
          p=doc.add_paragraph(); p.add_run('Scope: ').bold=True; p.add_run('Pedal entries from the dedicated Overdrive, Distortion, and Fuzz pedal indexes. Names are retained as displayed.')
          doc.add_page_break(); doc.add_heading('MASTER COUNTS',level=1)
          for cat in data: doc.add_paragraph(f'{cat}: {len(data[cat]):,}')
          doc.add_paragraph(f'TOTAL: {total:,}')
          for cat,names in data.items():
              doc.add_page_break(); doc.add_heading(cat.upper(),level=1)
              for i,name in enumerate(names,1):
                  p=doc.add_paragraph(); p.paragraph_format.space_after=Pt(0)
                  p.add_run(f'{i}. ').bold=True; p.add_run(name)
          path='research/effectsdatabase-master-dirt-pedal-index.docx'
          doc.save(path)
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
          (OUT/'master.tsv').write_text('\n'.join(f'{cat}\t{i}\t{name}' for cat,names in data.items() for i,name in enumerate(names,1))+'\n',encoding='utf-8')
          print('VERIFIED', {k:len(v) for k,v in data.items()}, 'TOTAL', total)
          PY
          python /tmp/build.py
      - name: Commit and upload
        uses: actions/upload-artifact@v4
        with:
          name: effects-database-master-dirt-pedal-index
          path: |
            research/effectsdatabase-master-dirt-pedal-index.docx
            research/effectsdatabase-master-extract/*.txt
            research/effectsdatabase-master-extract/*.tsv
          retention-days: 30
