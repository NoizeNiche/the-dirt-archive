name: Build Effects Database master index with Reader
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-effectsdatabase-master-index-browser.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests python-docx
      - name: Extract every product from every category page
        run: |
          cat > /tmp/build.py <<'PY'
          from collections import OrderedDict
          from pathlib import Path
          from urllib.parse import quote
          import re,time,requests
          from docx import Document
          from docx.shared import Pt,Inches
          from docx.enum.text import WD_ALIGN_PARAGRAPH

          C=OrderedDict([
            ('Overdrive','https://www.effectsdatabase.com/type/overdrive/pedal'),
            ('Distortion','https://www.effectsdatabase.com/type/distortion/pedal'),
            ('Fuzz','https://www.effectsdatabase.com/type/fuzz/pedal')])
          EXPECTED={'Overdrive':5414,'Distortion':3455,'Fuzz':4211}
          OUT=Path('research/effectsdatabase-master-extract'); OUT.mkdir(parents=True,exist_ok=True)

          def reader_url(target):
              return 'https://r.jina.ai/'+quote(target,safe=":/?#[]@!$&'()*+,;=%")

          def fetch(target):
              s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'text/markdown,text/plain,*/*','X-Return-Format':'markdown'})
              u=reader_url(target)
              last=None
              for attempt in range(10):
                  try:
                      r=s.get(u,timeout=120); last=r.status_code
                      if r.status_code==200 and r.text: return r.text
                      if r.status_code in (429,500,502,503,504): time.sleep(min(30,2**attempt)); continue
                      r.raise_for_status()
                  except requests.RequestException:
                      if attempt==9: raise
                      time.sleep(min(30,2**attempt))
              raise RuntimeError(f'Reader failed status={last}: {u}')

          def parse(text):
              rows=[]
              # Only take numbered Markdown links to actual Effects Database model pages.
              rx=re.compile(r'^\s*\d+\.\s+\[([^\]]+)\]\((https?://[^)]+/model/[^)]*)\)\s*$')
              for raw in text.splitlines():
                  line=' '.join(raw.strip().split())
                  m=rx.match(line)
                  if m: rows.append((m.group(1).strip(),m.group(2)))
              return rows

          all_data=OrderedDict()
          for cat,base in C.items():
              site_text=fetch(base)
              m=re.search(r'Gear in this category\s*\((\d+)\)',site_text,re.I)
              expected=int(m.group(1)) if m else EXPECTED[cat]
              if expected!=EXPECTED[cat]: print('NOTICE',cat,'live total',expected,'previous total',EXPECTED[cat])
              first=None; records=[]; pages=[]; seen_page_fingerprints=set()
              for page in range(0,80):
                  url=base if page==0 else f'{base}?page={page}'
                  rows=parse(site_text if page==0 else fetch(url))
                  names=[name for name,_ in rows]
                  print(cat,'page',page,'product_rows',len(rows),'first',rows[0] if rows else None,'last',rows[-1] if rows else None)
                  if not rows: raise RuntimeError(f'{cat}: page {page} has zero product links')
                  fp=tuple(names)
                  if page>0 and fp in seen_page_fingerprints:
                      print(cat,'page',page,'repeats an earlier page; stopping')
                      break
                  seen_page_fingerprints.add(fp)
                  if page==0: first=fp
                  elif fp==first:
                      print(cat,'page',page,'repeats page 0; stopping')
                      break
                  records.extend(rows); pages.append(page)
                  if len(records)>=expected:
                      # Do not stop blindly: require the next page to repeat or be empty. This protects against unusual final-page sizing.
                      continue
              if len(records)!=expected:
                  raise RuntimeError(f'{cat}: expected exactly {expected} products, extracted {len(records)} across pages {pages}')
              all_data[cat]=records
              (OUT/f'{cat.lower()}-all.txt').write_text('\n'.join(name for name,_ in records)+'\n',encoding='utf-8')
              (OUT/f'{cat.lower()}-all.tsv').write_text('\n'.join(f'{i}\t{name}\t{href}' for i,(name,href) in enumerate(records,1))+'\n',encoding='utf-8')
              (OUT/f'{cat.lower()}-pages.txt').write_text('\n'.join(str(p) for p in pages)+'\n',encoding='utf-8')

          total=sum(len(v) for v in all_data.values()); assert total==sum(EXPECTED.values()),total
          doc=Document(); s=doc.sections[0]; s.top_margin=Inches(.5); s.bottom_margin=Inches(.5); s.left_margin=Inches(.55); s.right_margin=Inches(.55)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER; r=p.add_run('EFFECTS DATABASE MASTER DIRT PEDAL INDEX'); r.bold=True; r.font.size=Pt(20)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER; r=p.add_run('Complete Overdrive / Distortion / Fuzz listing'); r.italic=True; r.font.size=Pt(11)
          p=doc.add_paragraph(); p.add_run('Source: ').bold=True; p.add_run('Effects Database (effectsdatabase.com)')
          p=doc.add_paragraph(); p.add_run('Extraction date: ').bold=True; p.add_run('2026-09-16')
          p=doc.add_paragraph(); p.add_run('Content: ').bold=True; p.add_run('Pedal names only, one line per Effects Database category index entry.')
          doc.add_page_break(); doc.add_heading('MASTER COUNTS',1)
          for cat,recs in all_data.items(): doc.add_paragraph(f'{cat}: {len(recs):,}')
          doc.add_paragraph(f'TOTAL CATEGORY ENTRIES: {total:,}')
          for cat,recs in all_data.items():
              doc.add_page_break(); doc.add_heading(cat.upper(),1)
              for i,(name,_) in enumerate(recs,1):
                  p=doc.add_paragraph(); p.paragraph_format.space_after=Pt(0); p.add_run(f'{i}. ').bold=True; p.add_run(name)
          doc.save('research/effectsdatabase-master-dirt-pedal-index.docx')
          (OUT/'master.tsv').write_text('\n'.join(f'{cat}\t{i}\t{name}\t{href}' for cat,recs in all_data.items() for i,(name,href) in enumerate(recs,1))+'\n',encoding='utf-8')
          print('FINAL', {k:len(v) for k,v in all_data.items()}, total)
          PY
          python /tmp/build.py
      - name: Verify exact totals and DOCX integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          exp={'overdrive':5414,'distortion':3455,'fuzz':4211}; total=0
          for c,n in exp.items():
              rows=[x for x in Path(f'research/effectsdatabase-master-extract/{c}-all.txt').read_text(encoding='utf-8').splitlines() if x]
              assert len(rows)==n,(c,len(rows),n); total+=len(rows)
          assert total==13080
          with zipfile.ZipFile('research/effectsdatabase-master-dirt-pedal-index.docx') as z: assert z.testzip() is None
          print('VERIFIED COMPLETE MASTER INDEX',total)
          PY
      - name: Commit and upload complete master index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/effectsdatabase-master-dirt-pedal-index.docx research/effectsdatabase-master-extract/
          git commit -m 'Add verified complete Effects Database dirt index' || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: effects-database-master-dirt-pedal-index
          path: research/effectsdatabase-master-dirt-pedal-index.docx
          retention-days: 30
