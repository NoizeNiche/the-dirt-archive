name: Build Effects Database master index with browser
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-effectsdatabase-master-index-browser.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and Python packages
        run: |
          python -m pip install --upgrade playwright python-docx
          python -m playwright install --with-deps chromium
      - name: Extract all three category indexes
        run: |
          cat > /tmp/build.py <<'PY'
          from collections import OrderedDict
          from pathlib import Path
          import re,time
          from playwright.sync_api import sync_playwright,TimeoutError as PlaywrightTimeoutError
          from docx import Document
          from docx.shared import Pt,Inches
          from docx.enum.text import WD_ALIGN_PARAGRAPH

          C=OrderedDict([
            ('Overdrive','https://www.effectsdatabase.com/type/overdrive/pedal'),
            ('Distortion','https://www.effectsdatabase.com/type/distortion/pedal'),
            ('Fuzz','https://www.effectsdatabase.com/type/fuzz/pedal')])
          E={'Overdrive':5414,'Distortion':3455,'Fuzz':4211}
          OUT=Path('research/effectsdatabase-master-extract'); OUT.mkdir(parents=True,exist_ok=True)

          def extract(page):
              return page.locator('a[href^="/model/"]').evaluate_all("""
              as => as.map(a => {
                const li=a.closest('li');
                const text=(li?.innerText||'').trim().replace(/\\s+/g,' ');
                const m=text.match(/^(\\d+)\\.\\s+/);
                return m ? {n:Number(m[1]),name:(a.innerText||'').trim().replace(/\\s+/g,' '),href:a.getAttribute('href')} : null;
              }).filter(Boolean)
              """)

          def open_page(page,url):
              for attempt in range(4):
                  try:
                      page.goto(url,wait_until='domcontentloaded',timeout=90000)
                      page.wait_for_timeout(800)
                      return
                  except PlaywrightTimeoutError:
                      if attempt==3: raise
                      time.sleep(2)

          data=OrderedDict()
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              ctx=browser.new_context(user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',locale='en-US',viewport={'width':1440,'height':1200})
              page=ctx.new_page()
              for cat,base in C.items():
                  rec=[]
                  # Effects Database uses the canonical URL for the first 100, then ?page=N for later blocks.
                  max_page=((E[cat]-1)//100)
                  for q in range(0,max_page+1):
                      url=base if q==0 else f'{base}?page={q}'
                      open_page(page,url)
                      rows=extract(page)
                      print(cat,'page',q,'rows',len(rows),'first',rows[0] if rows else None,'last',rows[-1] if rows else None)
                      if not rows: raise RuntimeError(f'{cat}: empty page {q}')
                      rec.extend((int(x['n']),x['name'],x['href']) for x in rows)
                  seen=set(); final=[]
                  for x in sorted(rec,key=lambda x:x[0]):
                      if x not in seen: seen.add(x); final.append(x)
                  if len(final)!=E[cat] or [n for n,_,_ in final]!=list(range(1,E[cat]+1)):
                      raise RuntimeError(f'{cat}: expected {E[cat]} sequential records, got {len(final)}')
                  data[cat]=final
                  (OUT/f'{cat.lower()}-all.txt').write_text('\n'.join(name for _,name,_ in final)+'\n',encoding='utf-8')
                  (OUT/f'{cat.lower()}-all.tsv').write_text('\n'.join(f'{n}\t{name}\t{href}' for n,name,href in final)+'\n',encoding='utf-8')
              browser.close()

          doc=Document(); s=doc.sections[0]; s.top_margin=Inches(.5); s.bottom_margin=Inches(.5); s.left_margin=Inches(.55); s.right_margin=Inches(.55)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER; r=p.add_run('EFFECTS DATABASE MASTER DIRT PEDAL INDEX'); r.bold=True; r.font.size=Pt(20)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER; r=p.add_run('Complete Overdrive / Distortion / Fuzz listing'); r.italic=True; r.font.size=Pt(11)
          p=doc.add_paragraph(); p.add_run('Source: ').bold=True; p.add_run('Effects Database (effectsdatabase.com)')
          p=doc.add_paragraph(); p.add_run('Extraction date: ').bold=True; p.add_run('2026-09-16')
          p=doc.add_paragraph(); p.add_run('Content: ').bold=True; p.add_run('Pedal names only, in Effects Database index order.')
          doc.add_page_break(); doc.add_heading('MASTER COUNTS',1)
          for cat,recs in data.items(): doc.add_paragraph(f'{cat}: {len(recs):,}')
          doc.add_paragraph(f'TOTAL: {sum(len(v) for v in data.values()):,}')
          for cat,recs in data.items():
              doc.add_page_break(); doc.add_heading(cat.upper(),1)
              for n,name,_ in recs:
                  p=doc.add_paragraph(); p.paragraph_format.space_after=Pt(0); p.add_run(f'{n}. ').bold=True; p.add_run(name)
          doc.save('research/effectsdatabase-master-dirt-pedal-index.docx')
          Path(OUT/'master.tsv').write_text('\n'.join(f'{cat}\t{n}\t{name}\t{href}' for cat,recs in data.items() for n,name,href in recs)+'\n',encoding='utf-8')
          print('MASTER TOTAL',sum(len(v) for v in data.values()))
          PY
          python /tmp/build.py
      - name: Verify master index
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          e={'overdrive':5414,'distortion':3455,'fuzz':4211}; total=0
          for c,n in e.items():
              rows=[x for x in Path(f'research/effectsdatabase-master-extract/{c}-all.txt').read_text().splitlines() if x]
              assert len(rows)==n,(c,len(rows),n); total+=len(rows)
          assert total==13080
          with zipfile.ZipFile('research/effectsdatabase-master-dirt-pedal-index.docx') as z: assert z.testzip() is None
          print('VERIFIED',total)
          PY
      - name: Commit and upload complete index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/effectsdatabase-master-dirt-pedal-index.docx research/effectsdatabase-master-extract/
          git commit -m 'Add verified complete Effects Database dirt index' || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: effects-database-master-dirt-pedal-index
          path: research/effectsdatabase-master-dirt-pedal-index.docx
          retention-days: 30
