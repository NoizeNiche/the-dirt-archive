name: Build Effects Database master index with browser
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-effectsdatabase-master-index-browser.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and document packages
        run: |
          python -m pip install --upgrade playwright python-docx
          python -m playwright install --with-deps chromium
      - name: Extract every product page directly
        run: |
          cat > /tmp/build.py <<'PY'
          from collections import OrderedDict
          from pathlib import Path
          import time
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout
          from docx import Document
          from docx.shared import Pt, Inches
          from docx.enum.text import WD_ALIGN_PARAGRAPH

          C=OrderedDict([
            ('Overdrive','https://www.effectsdatabase.com/type/overdrive/pedal',54,5414),
            ('Distortion','https://www.effectsdatabase.com/type/distortion/pedal',34,3455),
            ('Fuzz','https://www.effectsdatabase.com/type/fuzz/pedal',42,4211)])
          OUT=Path('research/effectsdatabase-master-extract'); OUT.mkdir(parents=True,exist_ok=True)

          def page_rows(page):
              data=page.locator('li').evaluate_all("""
              els => els.map(li => {
                const t=(li.innerText||'').trim().replace(/\\s+/g,' ');
                const m=t.match(/^(\\d+)\\.\\s+(.*)$/);
                const a=li.querySelector(\"a[href*=\\\"/model/\\\"]\");
                return (m&&a) ? {n:Number(m[1]),name:(a.innerText||'').trim().replace(/\\s+/g,' '),href:a.href} : null;
              }).filter(Boolean)
              """)
              out=[]; seen=set()
              for x in data:
                  if x['href'] not in seen:
                      seen.add(x['href']); out.append((x['name'],x['href']))
              return out

          def load(page,url):
              for attempt in range(6):
                  try:
                      r=page.goto(url,wait_until='domcontentloaded',timeout=90000)
                      page.wait_for_timeout(900)
                      if r and r.status>=400: raise RuntimeError(f'HTTP {r.status}')
                      return
                  except (PWTimeout,RuntimeError) as e:
                      if attempt==5: raise
                      print('retry',attempt+1,url,e,flush=True); time.sleep(2+attempt)

          all_data=OrderedDict()
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True)
              ctx=browser.new_context(user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36',locale='en-US',viewport={'width':1440,'height':1200})
              page=ctx.new_page()
              for cat,(base,last_page,expected) in C.items():
                  records=[]
                  for q in range(last_page+1):
                      url=base if q==0 else f'{base}?page={q}'
                      load(page,url); rows=page_rows(page)
                      print(f'{cat} page {q}: {len(rows)} products; first={rows[0] if rows else None}; last={rows[-1] if rows else None}',flush=True)
                      if not rows: raise RuntimeError(f'{cat}: page {q} empty')
                      records.extend(rows)
                  if len(records)!=expected: raise RuntimeError(f'{cat}: expected {expected}, extracted {len(records)}')
                  hrefs=[h for _,h in records]
                  if len(set(hrefs))!=len(hrefs): raise RuntimeError(f'{cat}: duplicate model URL in full index')
                  all_data[cat]=records
                  (OUT/f'{cat.lower()}-all.txt').write_text('\n'.join(n for n,_ in records)+'\n',encoding='utf-8')
                  (OUT/f'{cat.lower()}-all.tsv').write_text('\n'.join(f'{i}\t{n}\t{h}' for i,(n,h) in enumerate(records,1))+'\n',encoding='utf-8')
              browser.close()

          total=sum(len(v) for v in all_data.values()); assert total==13080
          doc=Document(); s=doc.sections[0]; s.top_margin=Inches(.5); s.bottom_margin=Inches(.5); s.left_margin=Inches(.55); s.right_margin=Inches(.55)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER; r=p.add_run('EFFECTS DATABASE MASTER DIRT PEDAL INDEX'); r.bold=True; r.font.size=Pt(20)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER; r=p.add_run('Complete Overdrive / Distortion / Fuzz listing'); r.italic=True; r.font.size=Pt(11)
          p=doc.add_paragraph(); p.add_run('Source: ').bold=True; p.add_run('Effects Database (effectsdatabase.com)')
          p=doc.add_paragraph(); p.add_run('Extraction date: ').bold=True; p.add_run('2026-09-16')
          p=doc.add_paragraph(); p.add_run('Content: ').bold=True; p.add_run('Pedal names only, one line per Effects Database category index entry.')
          doc.add_page_break(); doc.add_heading('MASTER COUNTS',1)
          for cat,recs in all_data.items(): doc.add_paragraph(f'{cat}: {len(recs):,}')
          doc.add_paragraph(f'TOTAL CATEGORY ENTRIES: {total:,}')
          for cat,recs in all_data.items():
              doc.add_page_break(); doc.add_heading(cat.upper(),1)
              for i,(name,_) in enumerate(recs,1):
                  p=doc.add_paragraph(); p.paragraph_format.space_after=Pt(0); p.add_run(f'{i}. ').bold=True; p.add_run(name)
          doc.save('research/effectsdatabase-master-dirt-pedal-index.docx')
          (OUT/'master.tsv').write_text('\n'.join(f'{cat}\t{i}\t{name}\t{href}' for cat,recs in all_data.items() for i,(name,href) in enumerate(recs,1))+'\n',encoding='utf-8')
          print('FINAL VERIFIED COUNTS', {k:len(v) for k,v in all_data.items()},'TOTAL',total)
          PY
          python /tmp/build.py
      - name: Verify exact totals and DOCX integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          exp={'overdrive':5414,'distortion':3455,'fuzz':4211}; total=0
          for c,n in exp.items():
              rows=[x for x in Path(f'research/effectsdatabase-master-extract/{c}-all.txt').read_text(encoding='utf-8').splitlines() if x]
              assert len(rows)==n,(c,len(rows),n); total+=len(rows)
          assert total==13080
          with zipfile.ZipFile('research/effectsdatabase-master-dirt-pedal-index.docx') as z: assert z.testzip() is None
          print('VERIFIED COMPLETE MASTER INDEX',total)
          PY
      - name: Commit complete master index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/effectsdatabase-master-dirt-pedal-index.docx research/effectsdatabase-master-extract/
          git commit -m 'Add verified complete Effects Database dirt index' || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: effects-database-master-dirt-pedal-index
          path: research/effectsdatabase-master-dirt-pedal-index.docx
          retention-days: 30
