name: Build Effects Database master index with browser

on:
  push:
    paths:
      - '.github/workflows/build-effectsdatabase-master-index-browser.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser and Python packages
        run: |
          python -m pip install --upgrade playwright python-docx
          python -m playwright install --with-deps chromium

      - name: Browse every Effects Database category page
        run: |
          python - <<'PY'
          from collections import OrderedDict
          from pathlib import Path
          import re
          import time
          from playwright.sync_api import sync_playwright
          from docx import Document
          from docx.shared import Pt, Inches
          from docx.enum.text import WD_ALIGN_PARAGRAPH

          CATEGORIES = OrderedDict([
              ('Overdrive', 'https://www.effectsdatabase.com/type/overdrive'),
              ('Distortion', 'https://www.effectsdatabase.com/type/distortion'),
              ('Fuzz', 'https://www.effectsdatabase.com/type/fuzz'),
          ])
          EXPECTED = {'Overdrive': 5414, 'Distortion': 3455, 'Fuzz': 4211}
          OUT = Path('research/effectsdatabase-master-extract')
          OUT.mkdir(parents=True, exist_ok=True)
          all_data = OrderedDict()

          def extract_page(page):
              # Read the numbered product rows visible in the rendered page.
              rows = page.locator('li').evaluate_all("""
              els => els.map(li => {
                const a = li.querySelector('a[href^="/model/"]');
                const txt = (li.innerText || '').trim().replace(/\\s+/g, ' ');
                return a ? {txt, name: (a.innerText || '').trim().replace(/\\s+/g, ' '), href: a.getAttribute('href')} : null;
              }).filter(x => x && /^\\d+\\.\\s/.test(x.txt))
              """)
              out = []
              for r in rows:
                  m = re.match(r'^(\d+)\.\s+', r['txt'])
                  if not m:
                      continue
                  n = int(m.group(1))
                  name = r['name']
                  if name:
                      out.append((n, name, r['href']))
              return out

          def next_href(page, current_url):
              links = page.locator('a').evaluate_all("""
              els => els.map(a => ({text:(a.innerText||'').trim().toLowerCase(), href:a.href}))
              """)
              for x in links:
                  if x['text'] in ('next', 'next ›', 'next >', 'next »') and x['href'] and x['href'] != current_url:
                      return x['href']
              return None

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
                  locale='en-US',
                  viewport={'width': 1440, 'height': 1200},
              )
              page = context.new_page()

              for category, base in CATEGORIES.items():
                  records = []
                  seen = set()
                  url = base
                  pages = 0
                  while url:
                      pages += 1
                      if pages > 100:
                          raise RuntimeError(f'{category}: pagination exceeded safety limit')
                      print(f'{category}: opening page {pages}: {url}')
                      page.goto(url, wait_until='domcontentloaded', timeout=90000)
                      page.wait_for_timeout(1000)
                      rows = extract_page(page)
                      print(f'{category}: page {pages}: {len(rows)} numbered rows')
                      if not rows:
                          raise RuntimeError(f'{category}: no numbered product rows at {url}')
                      for n,name,href in rows:
                          key = (n,name,href)
                          if key not in seen:
                              seen.add(key)
                              records.append((n,name,href))
                      if len(records) >= EXPECTED[category]:
                          break
                      new_url = next_href(page, page.url)
                      if not new_url:
                          raise RuntimeError(f'{category}: pagination ended at {len(records)} rows, expected {EXPECTED[category]}')
                      if new_url == page.url:
                          raise RuntimeError(f'{category}: pagination loop detected')
                      url = new_url
                      time.sleep(0.5)

                  records.sort(key=lambda x: x[0])
                  names = [name for n,name,href in records]
                  if len(records) != EXPECTED[category]:
                      raise RuntimeError(f'{category}: extracted {len(records)} rows, expected {EXPECTED[category]}')
                  if records[-1][0] != EXPECTED[category]:
                      raise RuntimeError(f'{category}: last site number {records[-1][0]}, expected {EXPECTED[category]}')
                  all_data[category] = names
                  (OUT / f'{category.lower()}-all.txt').write_text('\n'.join(names)+'\n', encoding='utf-8')
                  (OUT / f'{category.lower()}-all.tsv').write_text('\n'.join(f'{n}\t{name}\t{href}' for n,name,href in records)+'\n', encoding='utf-8')
                  print(f'{category}: COMPLETE {len(records)}')

              browser.close()

          # Giant master DOCX, names only, separated into the three requested categories.
          doc = Document()
          sec = doc.sections[0]
          sec.top_margin = Inches(0.55); sec.bottom_margin = Inches(0.55)
          sec.left_margin = Inches(0.55); sec.right_margin = Inches(0.55)
          p = doc.add_paragraph(); p.alignment = WD_ALIGN_PARAGRAPH.CENTER
          r = p.add_run('EFFECTS DATABASE MASTER DIRT PEDAL INDEX'); r.bold = True; r.font.size = Pt(20)
          p = doc.add_paragraph(); p.alignment = WD_ALIGN_PARAGRAPH.CENTER
          r = p.add_run('Every listed Overdrive, Distortion, and Fuzz pedal'); r.italic = True; r.font.size = Pt(11)
          p = doc.add_paragraph(); p.add_run('Source: ').bold = True; p.add_run('Effects Database (effectsdatabase.com)')
          p = doc.add_paragraph(); p.add_run('Extraction date: ').bold = True; p.add_run('2026-09-16')
          p = doc.add_paragraph(); p.add_run('Content: ').bold = True; p.add_run('Pedal names only. No descriptions or model-page text.')
          doc.add_page_break()
          doc.add_heading('MASTER COUNTS', level=1)
          total = 0
          for cat,names in all_data.items():
              doc.add_paragraph(f'{cat}: {len(names):,}')
              total += len(names)
          doc.add_paragraph(f'TOTAL: {total:,}')
          for cat,names in all_data.items():
              doc.add_page_break()
              doc.add_heading(cat.upper(), level=1)
              for i,name in enumerate(names,1):
                  p = doc.add_paragraph()
                  p.paragraph_format.space_after = Pt(0)
                  p.add_run(f'{i}. ').bold = True
                  p.add_run(name)
          doc.save('research/effectsdatabase-master-dirt-pedal-index.docx')
          print('MASTER COUNTS', {k:len(v) for k,v in all_data.items()})
          print('MASTER TOTAL', sum(map(len, all_data.values())))
          PY

      - name: Verify exact expected totals
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          expected = {'overdrive':5414,'distortion':3455,'fuzz':4211}
          total = 0
          for cat,n in expected.items():
              p = Path(f'research/effectsdatabase-master-extract/{cat}-all.txt')
              rows = [x for x in p.read_text(encoding='utf-8').splitlines() if x]
              print(cat, len(rows))
              assert len(rows) == n
              total += len(rows)
          assert total == 13080
          with zipfile.ZipFile('research/effectsdatabase-master-dirt-pedal-index.docx') as z:
              assert z.testzip() is None
              assert 'word/document.xml' in z.namelist()
          print('VERIFIED TOTAL', total)
          PY

      - name: Commit complete master index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/effectsdatabase-master-dirt-pedal-index.docx research/effectsdatabase-master-extract/
          git commit -m 'Add complete Effects Database pedal-name index' || exit 0
          git push

      - name: Upload master document
        uses: actions/upload-artifact@v4
        with:
          name: effects-database-master-dirt-pedal-index
          path: research/effectsdatabase-master-dirt-pedal-index.docx
          retention-days: 30
