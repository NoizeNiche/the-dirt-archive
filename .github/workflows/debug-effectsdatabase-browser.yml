name: Debug Effects Database browser
on:
  push:
    paths:
      - '.github/workflows/debug-effectsdatabase-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe rendered page
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          url='https://www.effectsdatabase.com/type/overdrive'
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36')
              page.goto(url, wait_until='domcontentloaded', timeout=90000)
              page.wait_for_timeout(3000)
              print('URL', page.url)
              print('TITLE', page.title())
              print('LI_COUNT', page.locator('li').count())
              print('MODEL_ANCHORS', page.locator('a[href^="/model/"]').count())
              print('BODY_PREFIX')
              print(page.locator('body').inner_text()[:12000])
              print('ANCHORS')
              for x in page.locator('a[href^="/model/"]').all_inner_texts()[:20]:
                  print(repr(x))
              page.screenshot(path='effectsdatabase-probe.png', full_page=True)
              b.close()
          PY
      - name: Upload probe screenshot
        uses: actions/upload-artifact@v4
        with:
          name: effectsdatabase-browser-probe
          path: effectsdatabase-probe.png
