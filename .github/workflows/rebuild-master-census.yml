name: Rebuild Master Pedal Census

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-census:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build master pedal census
        run: python3 tools/build_master_pedal_census.py

      - name: Commit generated census
        run: |
          git add research/MASTER_PEDAL_CENSUS.csv
          if git diff --cached --quiet -- research/MASTER_PEDAL_CENSUS.csv; then
            echo "Master census is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: generate master pedal census"
          git push
