name: Hourly Site Health

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  health:
    name: Verify live archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Refresh scheduled health checkout
        if: github.event_name == 'schedule'
        run: |
          git fetch origin main --depth=2
          git reset --hard origin/main

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Run hourly health monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/hourly-site-health.js
