name: Build Effects Database master dirt index

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-effectsdatabase-master-index.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests python-docx
      - name: Extract every Effects Database record
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import OrderedDict
          import re, time, requests
          from docx import Document
          from docx.shared import Pt, Inches
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          session=requests.Session()
          session.headers.update({'User-Agent':'The-Dirt-Archive/1.0','Accept':'text/markdown,text/plain;q=0.9,*/*;q=0.8','Accept-Language':'en-US,en;q=0.9'})
          categories=OrderedDict([('Overdrive','https://www.effectsdatabase.com/type/overdrive/pedal'),('Distortion','https://www.effectsdatabase.com/type/distortion'),('Fuzz','https://www.effectsdatabase.com/type/fuzz/pedal')])
          expected_totals={'Overdrive':5414,'Distortion':3455,'Fuzz':4211}
          out=Path('research/effectsdatabase-master-extract'); out.mkdir(parents=True,exist_ok=True)
          all_data=OrderedDict()
          def fetch(url):
              r=session.get('https://r.jina.ai/'+url,timeout=90); r.raise_for_status(); return r.text
          def parse(text):
              pos=text.lower().find('gear in this category'); block=text[pos:] if pos>=0 else text
              rows=[]
              for raw in block.splitlines():
                  line=' '.join(raw.strip().split())
                  m=re.match(r'^(\d+)\.\s+\[([^\]]+)\]\([^\n]*\)$',line)
                  if not m: m=re.match(r'^(\d+)\.\s+(.+)$',line)
                  if m:
                      name=m.group(2).strip()
                      if name and not name.lower().startswith('page '): rows.append((int(m.group(1)),name))
              seen=set(); clean=[]
              for x in rows:
                  if x not in seen: seen.add(x); clean.append(x)
              return clean
          for cat,base in categories.items():
              records=[]
              for page in range(1,100):
                  offset=(page-1)*100
                  url=base if page==1 else f'{base}?from={offset}&page={page}'
                  rows=parse(fetch(url))
                  print(f'{cat}: page {page}, rows={len(rows)}, range={(rows[0],rows[-1]) if rows else None}')
                  if not rows: raise RuntimeError(f'{cat}: empty page {page}')
                  records.extend(rows)
                  if max(n for n,_ in records)>=expected_totals[cat]: break
                  time.sleep(0.2)
              seen=set(); final=[]
              for x in records:
                  if x not in seen: seen.add(x); final.append(x)
              final.sort(key=lambda x:x[0])
              if len(final)!=expected_totals[cat] or final[-1][0]!=expected_totals[cat]:
                  raise RuntimeError(f'{cat}: extracted {len(final)}, last={final[-1][0] if final else None}, expected={expected_totals[cat]}')
              all_data[cat]=final
              (out/f'{cat.lower()}-all.tsv').write_text('\n'.join(f'{n}\t{name}' for n,name in final)+'\n',encoding='utf-8')
          doc=Document(); s=doc.sections[0]; s.top_margin=Inches(.5); s.bottom_margin=Inches(.5); s.left_margin=Inches(.55); s.right_margin=Inches(.55)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER; r=p.add_run('EFFECTS DATABASE MASTER DIRT PEDAL INDEX'); r.bold=True; r.font.size=Pt(20)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER; r=p.add_run('Every listed Overdrive, Distortion, and Fuzz pedal'); r.italic=True; r.font.size=Pt(11)
          p=doc.add_paragraph(); p.add_run('Source: ').bold=True; p.add_run('Effects Database (effectsdatabase.com)')
          p=doc.add_paragraph(); p.add_run('Content: ').bold=True; p.add_run('Pedal names only')
          doc.add_page_break(); doc.add_heading('MASTER COUNTS',level=1)
          for cat,recs in all_data.items(): doc.add_paragraph(f'{cat}: {len(recs):,}')
          doc.add_paragraph(f'TOTAL: {sum(len(v) for v in all_data.values()):,}')
          for cat,recs in all_data.items():
              doc.add_page_break(); doc.add_heading(cat.upper(),level=1)
              for n,name in recs:
                  p=doc.add_paragraph(); p.paragraph_format.space_after=Pt(0); p.add_run(f'{n}. ').bold=True; p.add_run(name)
          doc.save('research/effectsdatabase-master-dirt-pedal-index.docx')
          Path('research/effectsdatabase-master-extract/master.tsv').write_text('\n'.join(f'{cat}\t{n}\t{name}' for cat,recs in all_data.items() for n,name in recs)+'\n',encoding='utf-8')
          print('FINAL COUNTS:',{k:len(v) for k,v in all_data.items()})
          PY
      - name: Verify complete totals
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          exp={'overdrive':5414,'distortion':3455,'fuzz':4211}; total=0
          for cat,n in exp.items():
              rows=[x for x in Path(f'research/effectsdatabase-master-extract/{cat}-all.tsv').read_text(encoding='utf-8').splitlines() if x]
              assert len(rows)==n,(cat,len(rows),n); total+=len(rows)
          assert total==13080
          with zipfile.ZipFile('research/effectsdatabase-master-dirt-pedal-index.docx') as z: assert z.testzip() is None
          print('VERIFIED TOTAL',total)
          PY
      - name: Commit complete master index
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/effectsdatabase-master-dirt-pedal-index.docx research/effectsdatabase-master-extract/
          git commit -m 'Add complete Effects Database pedal-name index' || exit 0
          git push
      - name: Upload master document
        uses: actions/upload-artifact@v4
        with:
          name: effects-database-master-dirt-pedal-index
          path: research/effectsdatabase-master-dirt-pedal-index.docx
          retention-days: 30
