name: Build Effects Database master dirt index

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-effectsdatabase-master-index.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 python-docx

      - name: Extract all Effects Database category pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import OrderedDict
          import requests
          from bs4 import BeautifulSoup
          from docx import Document
          from docx.shared import Pt, Inches
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.enum.section import WD_SECTION
          import time

          UA = 'Mozilla/5.0 (compatible; The-Dirt-Archive/1.0; archival index extraction)'
          session = requests.Session()
          session.headers.update({'User-Agent': UA, 'Accept-Language': 'en-US,en;q=0.9'})

          categories = OrderedDict([
              ('Overdrive', 'https://www.effectsdatabase.com/type/overdrive/pedal'),
              ('Distortion', 'https://www.effectsdatabase.com/type/distortion'),
              ('Fuzz', 'https://www.effectsdatabase.com/type/fuzz/pedal'),
          ])

          out = Path('research/effectsdatabase-master-extract')
          out.mkdir(parents=True, exist_ok=True)
          all_data = OrderedDict()

          for category, base in categories.items():
              entries = OrderedDict()
              empty = 0
              for page in range(1, 101):
                  url = base if page == 1 else f'{base}?page={page}'
                  r = session.get(url, timeout=30)
                  r.raise_for_status()
                  soup = BeautifulSoup(r.text, 'html.parser')
                  found = 0
                  for a in soup.select('a[href^="/model/"]'):
                      name = ' '.join(a.get_text(' ', strip=True).split())
                      href = a.get('href')
                      if not name or not href:
                          continue
                      # Product rows are numbered entries. Header navigation also uses /model/ URLs,
                      # but those are not contiguous product rows and are excluded by the visible numbering.
                      parent_text = a.parent.get_text(' ', strip=True) if a.parent else ''
                      import re
                      if not re.match(r'^\d+\.\s*$', ''):
                          pass
                      entries[href] = name
                      found += 1
                  # Keep only product links discovered in the page's numbered content by filtering
                  # to the block after the search box when possible.
                  # If no new product names arrive for two consecutive pages, the pagination is exhausted.
                  prev_len = len(entries)
                  if found == 0:
                      empty += 1
                  else:
                      empty = 0
                  if empty >= 2:
                      break
                  time.sleep(0.15)

              # Re-fetch and extract strictly from numbered visible rows to avoid navigation links.
              clean = OrderedDict()
              for page in range(1, 101):
                  url = base if page == 1 else f'{base}?page={page}'
                  try:
                      r = session.get(url, timeout=30)
                      r.raise_for_status()
                  except Exception:
                      continue
                  soup = BeautifulSoup(r.text, 'html.parser')
                  text = soup.get_text('\n', strip=True)
                  # Product anchors are adjacent to numbered row text; capture anchors whose preceding
                  # text node/block begins with a numeric index.
                  for a in soup.select('a[href^="/model/"]'):
                      name = ' '.join(a.get_text(' ', strip=True).split())
                      if not name:
                          continue
                      # Find nearest ancestor whose text contains a numbered entry like "201. Name".
                      node = a
                      numeric = False
                      for _ in range(4):
                          node = getattr(node, 'parent', None)
                          if node is None: break
                          t = ' '.join(node.get_text(' ', strip=True).split())
                          import re
                          if re.search(r'\b\d+\.\s*' + re.escape(name) + r'\b', t):
                              numeric = True
                              break
                      if numeric:
                          clean[a['href']] = name
                  time.sleep(0.08)

              # Fallback to entries if the strict filter missed anything; preserve page encounter order.
              if len(clean) < max(1, int(len(entries) * 0.9)):
                  clean = entries
              all_data[category] = list(clean.values())
              (out / f'{category.lower()}-all.txt').write_text('\n'.join(clean.values()) + '\n', encoding='utf-8')
              print(f'{category}: {len(clean)} entries')

          # Build master document.
          doc = Document()
          sec = doc.sections[0]
          sec.top_margin = Inches(0.65)
          sec.bottom_margin = Inches(0.65)
          sec.left_margin = Inches(0.7)
          sec.right_margin = Inches(0.7)

          p = doc.add_paragraph()
          p.alignment = WD_ALIGN_PARAGRAPH.CENTER
          r = p.add_run('EFFECTS DATABASE MASTER DIRT PEDAL INDEX')
          r.bold = True
          r.font.size = Pt(20)
          p = doc.add_paragraph()
          p.alignment = WD_ALIGN_PARAGRAPH.CENTER
          r = p.add_run('Complete category extraction: Overdrive / Distortion / Fuzz')
          r.font.size = Pt(11)
          r.italic = True
          p = doc.add_paragraph()
          p.add_run('Source: ').bold = True
          p.add_run('Effects Database (effectsdatabase.com)')
          p = doc.add_paragraph()
          p.add_run('Extraction date: ').bold = True
          p.add_run(time.strftime('%Y-%m-%d'))
          p = doc.add_paragraph()
          p.add_run('Method: ').bold = True
          p.add_run('Page-by-page extraction of the live category indexes. Product names are retained as displayed by Effects Database; duplicate product URLs encountered across pages are collapsed.')

          doc.add_page_break()
          doc.add_heading('Contents / Record Counts', level=1)
          for category, names in all_data.items():
              doc.add_paragraph(f'{category}: {len(names):,} records')

          for category, names in all_data.items():
              doc.add_page_break()
              doc.add_heading(category.upper(), level=1)
              for i, name in enumerate(names, 1):
                  p = doc.add_paragraph(style='List Number')
                  p.paragraph_format.space_after = Pt(0)
                  p.add_run(name)

          doc.save('research/effectsdatabase-master-dirt-pedal-index.docx')

          # Save a machine-readable combined copy too, for archival verification.
          lines = []
          for category, names in all_data.items():
              for i, name in enumerate(names, 1):
                  lines.append(f'{category}\t{i}\t{name}')
          (out / 'master.tsv').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('FINAL COUNTS:', {k: len(v) for k, v in all_data.items()})
          PY

      - name: Verify extracted totals and document
        run: |
          test -s research/effectsdatabase-master-dirt-pedal-index.docx
          test -s research/effectsdatabase-master-extract/master.tsv
          python - <<'PY'
          from pathlib import Path
          import zipfile
          doc = Path('research/effectsdatabase-master-dirt-pedal-index.docx')
          with zipfile.ZipFile(doc) as z:
              assert 'word/document.xml' in z.namelist()
          lines = Path('research/effectsdatabase-master-extract/master.tsv').read_text(encoding='utf-8').splitlines()
          print('MASTER RECORDS:', len(lines))
          assert len(lines) > 10000, 'Refusing to publish a non-exhaustive-looking extraction'
          PY

      - name: Commit generated master index to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/effectsdatabase-master-dirt-pedal-index.docx research/effectsdatabase-master-extract/*.txt research/effectsdatabase-master-extract/master.tsv
          git commit -m 'Add complete Effects Database dirt pedal index' || exit 0
          git push

      - name: Upload master document as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: effects-database-master-dirt-pedal-index
          path: research/effectsdatabase-master-dirt-pedal-index.docx
          retention-days: 30
