name: Build Effects Database master dirt pedal index

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-effectsdatabase-master-index.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests python-docx
      - name: Extract every Effects Database pedal page
        run: |
          cat > /tmp/build.py <<'PY'
          from collections import OrderedDict
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import re,time,requests
          from docx import Document
          from docx.shared import Pt,Inches
          from docx.enum.text import WD_ALIGN_PARAGRAPH

          C=OrderedDict([
            ('Overdrive',('https://www.effectsdatabase.com/type/overdrive/pedal',53,5365)),
            ('Distortion',('https://www.effectsdatabase.com/type/distortion/pedal',33,3390)),
            ('Fuzz',('https://www.effectsdatabase.com/type/fuzz/pedal',41,4126)),
          ])
          OUT=Path('research/effectsdatabase-master-extract'); OUT.mkdir(parents=True,exist_ok=True)

          def fetch(target):
              s=requests.Session(); s.headers.update({'User-Agent':'The-Dirt-Archive/1.0','Accept':'text/markdown,text/plain,*/*'})
              last=None
              for attempt in range(10):
                  try:
                      r=s.post('https://r.jina.ai/',data={'url':target},timeout=180)
                      if r.status_code==200 and r.text:
                          return r.text
                      last=RuntimeError(f'Reader HTTP {r.status_code}')
                      if r.status_code in (429,500,502,503,504):
                          time.sleep(min(30,2**attempt)); continue
                      r.raise_for_status()
                  except requests.RequestException as e:
                      last=e
                      if attempt==9: raise
                      time.sleep(min(30,2**attempt))
              raise last or RuntimeError('Reader failed')

          def parse(text):
              rows=[]
              for line in text.splitlines():
                  line=' '.join(line.strip().split())
                  m=re.match(r'^(\d+)\.\s+(.*)$',line)
                  if not m: continue
                  rest=m.group(2).strip()
                  u=re.search(r'(?:https?://www\.effectsdatabase\.com)?/model/[^\s)]+',rest)
                  if not u: continue
                  href=u.group(0).rstrip('),.;')
                  if not href.startswith('http'): href='https://www.effectsdatabase.com'+href
                  name=rest[:u.start()].strip().lstrip('[').rstrip(']').rstrip('(').strip()
                  if name: rows.append((name,href))
              seen=set(); out=[]
              for x in rows:
                  if x[1] not in seen:
                      seen.add(x[1]); out.append(x)
              return out

          def one(args):
              cat,base,q=args
              target=base if q==0 else f'{base}?page={q}'
              rows=parse(fetch(target))
              print(f'{cat} page {q}: {len(rows)} rows; first={rows[0] if rows else None}; last={rows[-1] if rows else None}',flush=True)
              if not rows: raise RuntimeError(f'{cat} page {q} empty')
              return q,rows

          data=OrderedDict()
          for cat,(base,last,expected) in C.items():
              pages={}
              with ThreadPoolExecutor(max_workers=4) as ex:
                  fs=[ex.submit(one,(cat,base,q)) for q in range(last+1)]
                  for f in as_completed(fs):
                      q,rows=f.result(); pages[q]=rows
              records=[]
              for q in range(last+1): records.extend(pages[q])
              if len(records)!=expected:
                  raise RuntimeError(f'{cat}: expected {expected}, extracted {len(records)}')
              hrefs=[h for _,h in records]
              if len(set(hrefs))!=len(hrefs):
                  raise RuntimeError(f'{cat}: duplicate model URL')
              data[cat]=records
              (OUT/f'{cat.lower()}-all.txt').write_text('\n'.join(n for n,_ in records)+'\n',encoding='utf-8')
              (OUT/f'{cat.lower()}-all.tsv').write_text('\n'.join(f'{i}\t{n}\t{h}' for i,(n,h) in enumerate(records,1))+'\n',encoding='utf-8')

          total=sum(len(v) for v in data.values())
          assert total==12881
          doc=Document(); sec=doc.sections[0]
          sec.top_margin=Inches(.5); sec.bottom_margin=Inches(.5); sec.left_margin=Inches(.55); sec.right_margin=Inches(.55)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER
          r=p.add_run('EFFECTS DATABASE MASTER DIRT PEDAL INDEX'); r.bold=True; r.font.size=Pt(20)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER
          r=p.add_run('All listed Overdrive, Distortion, and Fuzz pedals'); r.italic=True
          p=doc.add_paragraph(); p.add_run('Source: ').bold=True; p.add_run('Effects Database (effectsdatabase.com)')
          p=doc.add_paragraph(); p.add_run('Extraction date: ').bold=True; p.add_run('2026-09-16')
          p=doc.add_paragraph(); p.add_run('Content: ').bold=True; p.add_run('Pedal names only; category membership retained exactly as indexed.')
          doc.add_page_break(); doc.add_heading('MASTER COUNTS',1)
          for cat,recs in data.items(): doc.add_paragraph(f'{cat}: {len(recs):,}')
          doc.add_paragraph(f'TOTAL CATEGORY ENTRIES: {total:,}')
          for cat,recs in data.items():
              doc.add_page_break(); doc.add_heading(cat.upper(),1)
              for i,(name,_) in enumerate(recs,1):
                  p=doc.add_paragraph(); p.paragraph_format.space_after=Pt(0)
                  p.add_run(f'{i}. ').bold=True; p.add_run(name)
          doc.save('research/effectsdatabase-master-dirt-pedal-index.docx')
          (OUT/'master.tsv').write_text('\n'.join(f'{cat}\t{i}\t{name}\t{href}' for cat,recs in data.items() for i,(name,href) in enumerate(recs,1))+'\n',encoding='utf-8')
          print('FINAL VERIFIED COUNTS', {k:len(v) for k,v in data.items()}, 'TOTAL',total)
          PY
          python /tmp/build.py
      - name: Verify complete totals and DOCX integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          exp={'overdrive':5365,'distortion':3390,'fuzz':4126}; total=0
          for cat,n in exp.items():
              rows=[x for x in Path(f'research/effectsdatabase-master-extract/{cat}-all.txt').read_text(encoding='utf-8').splitlines() if x]
              assert len(rows)==n,(cat,len(rows),n); total+=len(rows)
          assert total==12881
          with zipfile.ZipFile('research/effectsdatabase-master-dirt-pedal-index.docx') as z: assert z.testzip() is None
          print('VERIFIED TOTAL',total)
          PY
      - name: Commit complete master index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/effectsdatabase-master-dirt-pedal-index.docx research/effectsdatabase-master-extract/
          git commit -m 'Add complete Effects Database pedal-name index' || exit 0
          git push
      - name: Upload master document
        uses: actions/upload-artifact@v4
        with:
          name: effects-database-master-dirt-pedal-index
          path: research/effectsdatabase-master-dirt-pedal-index.docx
          retention-days: 30
