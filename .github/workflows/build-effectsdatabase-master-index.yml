name: Build Effects Database master dirt index

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-effectsdatabase-master-index.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 python-docx

      - name: Extract every Effects Database record
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import OrderedDict
          import re, time, requests
          from bs4 import BeautifulSoup
          from docx import Document
          from docx.shared import Pt, Inches
          from docx.enum.text import WD_ALIGN_PARAGRAPH

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'The-Dirt-Archive/1.0',
              'Accept-Language': 'en-US,en;q=0.9',
          })

          categories = OrderedDict([
              ('Overdrive', 'https://www.effectsdatabase.com/type/overdrive/pedal'),
              ('Distortion', 'https://www.effectsdatabase.com/type/distortion'),
              ('Fuzz', 'https://www.effectsdatabase.com/type/fuzz/pedal'),
          ])

          out = Path('research/effectsdatabase-master-extract')
          out.mkdir(parents=True, exist_ok=True)
          all_data = OrderedDict()

          def fetch_via_reader(target_url):
              reader_url = 'https://r.jina.ai/' + target_url
              r = session.get(reader_url, timeout=60)
              r.raise_for_status()
              return r.text

          def extract_page(target_url):
              text = fetch_via_reader(target_url)
              soup = BeautifulSoup(text, 'html.parser')
              plain = soup.get_text('\n', strip=True) if soup.find() else text
              rows = []
              for raw in plain.splitlines():
                  line = ' '.join(raw.strip().split())
                  m = re.match(r'^(\d+)\.\s+(?:\[[^\]]+\]\([^)]*\)|(.+))$', line)
                  if not m:
                      # Jina may return markdown links. Handle both markdown and plain text.
                      m2 = re.match(r'^(\d+)\.\s+\[([^\]]+)\]\([^)]*\)$', line)
                      if m2:
                          rows.append((int(m2.group(1)), m2.group(2).strip()))
                      continue
                  if m.group(2):
                      rows.append((int(m.group(1)), m.group(2).strip()))
              # Also scan raw markdown directly for the common numbered-link form.
              seen = set()
              if not rows:
                  for raw in text.splitlines():
                      line = ' '.join(raw.strip().split())
                      m = re.match(r'^(\d+)\.\s+\[([^\]]+)\]\([^)]*\)$', line)
                      if m:
                          rows.append((int(m.group(1)), m.group(2).strip()))
              clean = []
              for n, name in rows:
                  key = (n, name)
                  if key not in seen:
                      seen.add(key)
                      clean.append((n, name))
              return clean

          for category, base in categories.items():
              records = []
              last_num = 0
              for page in range(1, 101):
                  url = base if page == 1 else f'{base}?page={page}'
                  try:
                      rows = extract_page(url)
                  except Exception as exc:
                      print(f'ERROR {category} page {page}: {exc}')
                      if page == 1:
                          raise
                      break
                  # Keep only plausible product-number rows and require forward progress.
                  new_rows = [(n, name) for n, name in rows if n > last_num]
                  if not new_rows:
                      print(f'{category}: stopping at page {page}; last number {last_num}')
                      break
                  records.extend(new_rows)
                  last_num = max(n for n, _ in new_rows)
                  print(f'{category}: page {page}, +{len(new_rows)}, through #{last_num}')
                  time.sleep(0.2)
              # Preserve exact site order and remove duplicate number/name pairs.
              seen = set(); final=[]
              for n, name in records:
                  if (n, name) not in seen:
                      seen.add((n, name)); final.append((n, name))
              all_data[category] = final
              (out / f'{category.lower()}-all.tsv').write_text(
                  '\n'.join(f'{n}\t{name}' for n, name in final) + '\n', encoding='utf-8')
              print(f'{category}: FINAL {len(final)} records; last site number {max((n for n,_ in final), default=0)}')

          expected_min = {'Overdrive': 5000, 'Distortion': 3000, 'Fuzz': 4000}
          for category, minimum in expected_min.items():
              actual = len(all_data[category])
              if actual < minimum:
                  raise RuntimeError(f'{category} extraction too short: {actual} < {minimum}')

          doc = Document()
          sec = doc.sections[0]
          sec.top_margin = Inches(0.6); sec.bottom_margin = Inches(0.6)
          sec.left_margin = Inches(0.65); sec.right_margin = Inches(0.65)
          p = doc.add_paragraph(); p.alignment = WD_ALIGN_PARAGRAPH.CENTER
          r=p.add_run('EFFECTS DATABASE MASTER DIRT PEDAL INDEX'); r.bold=True; r.font.size=Pt(20)
          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER
          r=p.add_run('Complete Overdrive / Distortion / Fuzz index'); r.italic=True; r.font.size=Pt(11)
          p=doc.add_paragraph(); p.add_run('Source: ').bold=True; p.add_run('Effects Database, effectsdatabase.com')
          p=doc.add_paragraph(); p.add_run('Extraction date: ').bold=True; p.add_run(time.strftime('%Y-%m-%d'))
          p=doc.add_paragraph(); p.add_run('Method: ').bold=True; p.add_run('Every numbered entry from every paginated category index page was collected through a text-reader proxy because the site blocks direct automated requests. Pedal names are preserved as displayed.')
          doc.add_page_break()
          doc.add_heading('MASTER COUNTS', level=1)
          total=0
          for category, records in all_data.items():
              doc.add_paragraph(f'{category}: {len(records):,}')
              total += len(records)
          doc.add_paragraph(f'TOTAL: {total:,}')
          for category, records in all_data.items():
              doc.add_page_break(); doc.add_heading(category.upper(), level=1)
              for n,name in records:
                  p=doc.add_paragraph(); p.paragraph_format.space_after=Pt(0)
                  rr=p.add_run(f'{n}. '); rr.bold=True; p.add_run(name)
          doc.save('research/effectsdatabase-master-dirt-pedal-index.docx')
          Path('research/effectsdatabase-master-extract/master.tsv').write_text(
              '\n'.join(f'{category}\t{n}\t{name}' for category, records in all_data.items() for n,name in records) + '\n', encoding='utf-8')
          print('FINAL COUNTS:', {k:len(v) for k,v in all_data.items()})
          PY

      - name: Verify the master document is genuinely large
        run: |
          test -s research/effectsdatabase-master-dirt-pedal-index.docx
          python - <<'PY'
          from pathlib import Path
          import zipfile
          rows = Path('research/effectsdatabase-master-extract/master.tsv').read_text(encoding='utf-8').splitlines()
          print('MASTER ROWS:', len(rows))
          assert len(rows) > 12000, 'Extraction is unexpectedly incomplete'
          with zipfile.ZipFile('research/effectsdatabase-master-dirt-pedal-index.docx') as z:
              assert 'word/document.xml' in z.namelist()
          PY

      - name: Commit master index to The Dirt Archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/effectsdatabase-master-dirt-pedal-index.docx research/effectsdatabase-master-extract/
          git commit -m 'Add exhaustive Effects Database dirt pedal index' || exit 0
          git push

      - name: Upload master DOCX
        uses: actions/upload-artifact@v4
        with:
          name: effects-database-master-dirt-pedal-index
          path: research/effectsdatabase-master-dirt-pedal-index.docx
          retention-days: 30
