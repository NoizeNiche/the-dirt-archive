name: Validate The Dirt Archive

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'pedal.html'
      - 'pedal-detail.html'
      - 'research/PEDAL_INDEX.json'
      - 'research/PRP_TRACKER.csv'
      - 'research/RESEARCH_QUEUE.json'
      - 'CURRENT_STATE.md'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: dirt-archive-validation-${{ github.ref }}
  # Only the newest validation for a ref matters once newer code has landed.
  cancel-in-progress: true

jobs:
  validate:
    name: Validate archive structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Python image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Validate archive
        run: python scripts/validate-archive.py
      - name: Normalize legacy WebP assets
        run: |
          python - <<'PY'
          import runpy

          module = runpy.run_path("scripts/cache-pedal-images.py")
          normalized = module["normalize_mislabelled_webp_assets"]()
          print(f"Normalized {normalized} legacy image assets.")
          PY
      - name: Verify photo state
        run: python scripts/verify-photo-state.py
