name: Validate The Dirt Archive

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dirt-archive-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate archive structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate archive
        run: python scripts/validate-archive.py
