name: Harvest pedal photos

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/catalog-photo-manifest.js'
      - 'research/catalog-photo-harvest-status-01.tsv'
      - 'public/catalog-variant-photo-manifest.js'
      - 'research/catalog-variant-photo-status-01.tsv'
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harvest core and visible-catalog photo references
        run: python scripts/photo_harvest.py
      - name: Harvest documented production-variant photos
        run: python scripts/variant_photo_harvest.py
      - name: Commit manifests
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: refresh pedal and variant photo manifests'
          file_pattern: 'public/catalog-photo-manifest.js research/catalog-photo-harvest-status-01.tsv public/catalog-variant-photo-manifest.js research/catalog-variant-photo-status-01.tsv'
