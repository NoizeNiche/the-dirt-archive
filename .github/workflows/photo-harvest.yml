name: Harvest pedal photos

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/catalog-photo-manifest.js'
      - 'research/catalog-photo-harvest-status-01.tsv'
      - 'public/catalog-effects-database-photo-manifest.js'
      - 'research/catalog-effects-database-photo-status-01.tsv'
      - 'public/catalog-variant-photo-manifest.js'
      - 'research/catalog-variant-photo-status-01.tsv'
      - 'public/catalog-hardcase-photo-manifest.js'
      - 'research/catalog-hardcase-photo-status-01.tsv'
      - 'public/catalog-builder-logo-manifest.js'
      - 'research/catalog-builder-logo-status-01.tsv'
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:

concurrency:
  group: photo-harvest-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harvest core and visible-catalog photo references
        run: python scripts/photo_harvest.py
      - name: Harvest Effects Database product photos
        run: python scripts/effects_database_photo_harvest.py
      - name: Harvest documented production-variant photos
        run: python scripts/variant_photo_harvest.py
      - name: Harvest hard-case specialist-source photos
        run: python scripts/hard_case_photo_harvest.py
      - name: Harvest builder logo references
        run: python scripts/builder_logo_harvest.py
      - name: Commit manifests
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: refresh pedal, EDB, variant, hard-case, and builder-logo manifests'
          file_pattern: 'public/catalog-photo-manifest.js research/catalog-photo-harvest-status-01.tsv public/catalog-effects-database-photo-manifest.js research/catalog-effects-database-photo-status-01.tsv public/catalog-variant-photo-manifest.js research/catalog-variant-photo-status-01.tsv public/catalog-hardcase-photo-manifest.js research/catalog-hardcase-photo-status-01.tsv public/catalog-builder-logo-manifest.js research/catalog-builder-logo-status-01.tsv'
