name: Build complete Effects Database pedal-name index v7

on:
  push:
    paths:
      - '.github/workflows/build-effectsdatabase-master-index-v7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade requests beautifulsoup4 python-docx
      - name: Extract all pedal pages through proxy fallback
        run: |
          cat > /tmp/build.py <<'PY'
          from collections import OrderedDict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import re,time,requests,zipfile
          from bs4 import BeautifulSoup
          from docx import Document
          from docx.shared import Pt, Inches
          from docx.enum.text import WD_ALIGN_PARAGRAPH

          C=OrderedDict([
            ('Overdrive',('https://www.effectsdatabase.com/type/overdrive/pedal',53,5365)),
            ('Distortion',('https://www.effectsdatabase.com/type/distortion/pedal',33,3390)),
            ('Fuzz',('https://www.effectsdatabase.com/type/fuzz/pedal',41,4126)),
          ])
          OUT=Path('/tmp/out'); OUT.mkdir()

          def parse_html(html):
              soup=BeautifulSoup(html,'html.parser')
              names=[]
              # Effects Database renders the catalog as numbered links. Capture links to /model/ and preserve displayed text.
              for a in soup.select('a[href*="/model/"]'):
                  t=' '.join(a.get_text(' ',strip=True).split())
                  if t and t not in names: names.append(t)
              if len(names)<20: raise ValueError(f'proxy page only yielded {len(names)} model links')
              return names

          def parse_reader(text):
              out=[]
              for raw in text.splitlines():
                  line=' '.join(raw.strip().split())
                  m=re.match(r'^(\d+)\.\s+(.*)$',line)
                  if not m: continue
                  rest=m.group(2).strip()
                  name=rest[1:rest.find('](')] if rest.startswith('[') and '](' in rest else rest
                  if name: out.append(name.strip())
              if not out: raise ValueError('reader yielded no numbered rows')
              return out

          def fetch(cat,base,p):
              target=base if p==0 else f'{base}?page={p}'
              proxies=[
                target.replace('https://www.effectsdatabase.com','https://www-effectsdatabase-com.translate.goog') + ('&' if '?' in target else '?') + '_x_tr_sl=auto&_x_tr_tl=en&_x_tr_hl=en',
                'https://r.jina.ai/'+target,
              ]
              last=None
              for u in proxies:
                  for attempt in range(4):
                      try:
                          r=requests.get(u,timeout=(8,35),headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','Accept':'text/html,text/plain,*/*'}) if 'translate.goog' in u else requests.post('https://r.jina.ai/',data={'url':target},timeout=(8,45),headers={'User-Agent':'The-Dirt-Archive/7.0','Accept':'text/markdown,text/plain,*/*'})
                          if r.status_code==200 and r.text:
                              try:
                                  vals=parse_html(r.text) if 'translate.goog' in u else parse_reader(r.text)
                                  # Expect page numbering: 100 rows except terminal pages.
                                  if len(vals)>=20:
                                      print(f'{cat} page {p}: {len(vals)} via {"proxy" if "translate" in u else "reader"}',flush=True)
                                      return p,vals
                              except Exception as e: last=e
                          else: last=RuntimeError(f'HTTP {r.status_code}')
                      except Exception as e: last=e
                      time.sleep(min(5,2**attempt))
              raise RuntimeError(f'{cat} page {p}: {last}')

          pages={cat:{} for cat in C}
          jobs=[(cat,base,p) for cat,(base,last,exp) in C.items() for p in range(last+1)]
          with ThreadPoolExecutor(max_workers=20) as ex:
              fs=[ex.submit(fetch,*j) for j in jobs]
              for f in as_completed(fs):
                  p,vals=f.result()
                  # derive category from unique page object by task mapping is not safe; use future mapping instead
                  raise RuntimeError('mapping guard')
          PY
          # Replace guard implementation with mapped futures in a clean script.
          python - <<'PY2'
          p=Path('/tmp/build.py')
          t=p.read_text()
          t=t.replace("          with ThreadPoolExecutor(max_workers=20) as ex:\n              fs=[ex.submit(fetch,*j) for j in jobs]\n              for f in as_completed(fs):\n                  p,vals=f.result()\n                  # derive category from unique page object by task mapping is not safe; use future mapping instead\n                  raise RuntimeError('mapping guard')\n", "          with ThreadPoolExecutor(max_workers=20) as ex:\n              fmap={ex.submit(fetch,*j):(j[0],j[2]) for j in jobs}\n              for f in as_completed(fmap):\n                  cat,p=fmap[f]; pp,vals=f.result(); assert pp==p; pages[cat][p]=vals\n          data=OrderedDict()\n          for cat,(base,last,expected) in C.items():\n              names=[]\n              for p in range(last+1): names.extend(pages[cat][p])\n              if len(names)!=expected: raise RuntimeError(f'{cat}: {len(names)} != {expected}')\n              data[cat]=names\n              (OUT/f'{cat.lower()}.txt').write_text('\\n'.join(names)+'\\n',encoding='utf-8')\n          total=sum(len(v) for v in data.values())\n          if total!=12881: raise RuntimeError(f'TOTAL {total}')\n          doc=Document(); s=doc.sections[0]; s.top_margin=s.bottom_margin=Inches(.45); s.left_margin=s.right_margin=Inches(.55)\n          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER; r=p.add_run('EFFECTS DATABASE MASTER DIRT PEDAL INDEX'); r.bold=True; r.font.size=Pt(20)\n          p=doc.add_paragraph(); p.alignment=WD_ALIGN_PARAGRAPH.CENTER; p.add_run('Complete Overdrive / Distortion / Fuzz pedal names').italic=True\n          doc.add_paragraph('Source: Effects Database (effectsdatabase.com)')\n          doc.add_paragraph('Extraction date: September 16, 2026')\n          doc.add_page_break(); doc.add_heading('MASTER COUNTS',1)\n          for cat,names in data.items(): doc.add_paragraph(f'{cat}: {len(names):,}')\n          doc.add_paragraph(f'TOTAL: {total:,}')\n          for cat,names in data.items():\n              doc.add_page_break(); doc.add_heading(cat.upper(),1)\n              for i,name in enumerate(names,1):\n                  q=doc.add_paragraph(); q.paragraph_format.space_after=Pt(0); q.add_run(f'{i}. ').bold=True; q.add_run(name)\n          path=OUT/'effectsdatabase-master-dirt-pedal-index.docx'; doc.save(path)\n          with zipfile.ZipFile(path) as z: assert z.testzip() is None\n          print('VERIFIED', {k:len(v) for k,v in data.items()}, total)\n")
          p.write_text(t)
          PY2
          python /tmp/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: effects-database-master-dirt-pedal-index-v7
          path: /tmp/out/
          retention-days: 30
