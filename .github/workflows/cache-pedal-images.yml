name: Cache pedal images

on:
  # Photo recovery is intentionally cadence-driven. Repository/source edits are
  # consumed by the next scheduled pass, preventing every small maintenance
  # commit from creating another browser-heavy Actions job.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  # A single sentinel file provides a controlled manual kick when scheduled
  # GitHub Actions delivery is delayed. Ordinary repository commits remain free
  # of browser-heavy recovery runs.
  push:
    paths:
      - 'research/PHOTO_RECOVERY_KICK'
permissions:
  contents: write

concurrency:
  group: dirt-image-cache
  # Source/data edits no longer trigger this workflow, so a newer code checkpoint
  # should supersede an obsolete browser worker rather than consume another runner.
  cancel-in-progress: true

jobs:
  cache:
    # Prevent the cache bot from recursively triggering itself from its own commit.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.63.0
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Ensure Chromium is available
        run: |
          if compgen -G "$HOME/.cache/ms-playwright/chromium-*" > /dev/null; then
            echo "Playwright Chromium restored from cache."
          else
            echo "Playwright Chromium cache miss; installing Chromium and dependencies."
            npx playwright install --with-deps chromium
          fi

      - name: Synchronize with latest main before photo recovery
        run: |
          # Queued runs are created against an older SHA. Start every catch-up pass from the actual
          # recovery pass from the newest main so prior cache commits are part
          # of the working tree before any JSON/queue changes are generated.
          git fetch origin main
          git reset --hard origin/main

      - name: Apply curated exact photo source leads
        run: python scripts/apply-photo-source-overrides.py

      - name: Validate recovery script syntax
        run: node --check scripts/browser-photo-cache.mjs

      - name: Recover verified page images
        env:
          # Smaller committed batches keep recovery bounded and make progress visible.
          PHOTO_BROWSER_CACHE_LIMIT: "45"
          PHOTO_BROWSER_CACHE_CONCURRENCY: "7"
          PHOTO_BROWSER_PAGE_TIMEOUT_MS: "7500"
          PHOTO_BROWSER_SEARCH_TIMEOUT_MS: "7500"
          PHOTO_BROWSER_IMAGE_TIMEOUT_MS: "5000"
          PHOTO_BROWSER_CANDIDATE_LIMIT: "6"
          PHOTO_BROWSER_SEARCH_VERIFY_LIMIT: "6"
          # Recovery prioritizes verified curated source pages, then follows the
          # tracker backlog while preserving a bounded share for deep-review cases.
          PHOTO_BROWSER_IMAGE_SEARCH: "true"
          PHOTO_BROWSER_DEEP_REVIEW: "true"
          # Reopen a small bounded batch of automatically exhausted records for one deeper pass.
          PHOTO_BROWSER_REVISIT_PARKED: "true"
          PHOTO_BROWSER_RECOVERY_DEADLINE_MS: "45000"
        run: node scripts/browser-photo-cache.mjs

      - name: Download and cache verified pedal images
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/cache-pedal-images.py

      - name: Synchronize with latest main
        run: |
          # The cache can take a while. Rebase any newer documentation/site
          # commits before creating the cache commit so the result is never
          # based on a stale main branch.
          git stash push -u -m "image-cache-work"
          git fetch origin main
          git rebase origin/main
          git stash pop

      - name: Commit cached images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/sync-prp-tracker.py
          python scripts/sync-photo-backlog.py
          python scripts/refresh-image-cache-report.py
          git add assets/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/IMAGE_CACHE_REPORT.md research/PHOTO_REVIEW_QUEUE.csv research/PHOTO_BACKLOG.csv
          if git diff --cached --quiet; then
            echo "No image cache changes to commit."
            exit 0
          fi
          git commit -m "Archive verified pedal photos locally"

          # Other repository maintenance commits can land between our rebase
          # and the push. Retry by rebasing the complete cache commit instead
          # of throwing away a successful recovery batch.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push race detected; rebasing cache commit (attempt $attempt/5)."
            git fetch origin main
            git rebase origin/main
          done
          echo "Unable to publish the verified photo batch after 5 push attempts."
          exit 1
