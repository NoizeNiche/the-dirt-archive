name: Cache pedal images

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: dirt-image-cache
  cancel-in-progress: true

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Install browser tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Recover verified page images
        env:
          PHOTO_BROWSER_CACHE_LIMIT: "150"
          PHOTO_BROWSER_CACHE_CONCURRENCY: "8"
          PHOTO_BROWSER_CACHE_PRIORITY_COMPANY: "Catalinbread Effects"
          PHOTO_BROWSER_IMAGE_SEARCH: "true"
        run: node scripts/browser-photo-cache.mjs

      - name: Download and cache verified pedal images
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/cache-pedal-images.py

      - name: Synchronize with latest main
        run: |
          # The cache can take a while. Rebase any newer documentation/site
          # commits before creating the cache commit so the result is never
          # based on a stale main branch.
          git stash push -u -m "image-cache-work"
          git fetch origin main
          git rebase origin/main
          git stash pop

      - name: Commit cached images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/sync-prp-tracker.py
          git add assets/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/PRP_TRACKER.csv research/IMAGE_CACHE_REPORT.md
          if git diff --cached --quiet; then
            echo "No image cache changes to commit."
            exit 0
          fi
          # Photo-cache commits change PEDAL_INDEX.json. Update the cache-busting
          # version and both public HTML entry points in the same commit so the
          # newly published image paths cannot be masked by an older JSON URL.
          DATA_VERSION="data-${GITHUB_SHA:0:12}"
          export DATA_VERSION
          python scripts/sync-public-data-version.py
          git add index.html pedal-detail.html research/PEDAL_INDEX.json
          git commit -m "Archive verified pedal photos locally"
          git push

          # Maintenance kick: each operator-triggered main push starts the next
          # bounded photo-recovery batch after the prior batch finishes.
