name: Cache pedal images

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: dirt-image-cache
  cancel-in-progress: true

jobs:
  cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Install browser tooling
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Recover verified page images
        env:
          PHOTO_BROWSER_CACHE_LIMIT: "24"
          PHOTO_BROWSER_CACHE_CONCURRENCY: "3"
        run: node scripts/browser-photo-cache.mjs

      - name: Download and cache verified pedal images
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/cache-pedal-images.py

      - name: Synchronize with latest main
        run: |
          # The cache can take a while. Rebase any newer documentation/site
          # commits before creating the cache commit so the result is never
          # based on a stale main branch.
          git stash push -u -m "image-cache-work"
          git fetch origin main
          git rebase origin/main
          git stash pop

      - name: Commit cached images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/IMAGE_CACHE_REPORT.md
          if git diff --cached --quiet; then
            echo "No image cache changes to commit."
            exit 0
          fi
          git commit -m "Archive verified pedal photos locally"
          git push
