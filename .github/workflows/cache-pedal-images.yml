name: Cache pedal images

on:
  push:
    branches: [main]
    paths:
      - 'research/PEDAL_INDEX.json'
      - 'research/pedals/PEDAL_IMAGES.json'
      - '.github/workflows/cache-pedal-images.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dirt-image-cache
  cancel-in-progress: true

jobs:
  cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download and cache verified pedal images
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python - <<'PY'
          import hashlib
          import io
          import json
          import re
          import time
          import urllib.request
          from pathlib import Path

          from PIL import Image, ImageOps

          ROOT = Path(".")
          INDEX_PATH = ROOT / "research/PEDAL_INDEX.json"
          MANIFEST_PATH = ROOT / "research/pedals/PEDAL_IMAGES.json"
          REPORT_PATH = ROOT / "research/IMAGE_CACHE_REPORT.md"
          ASSET_ROOT = ROOT / "assets/pedals"
          ASSET_ROOT.mkdir(parents=True, exist_ok=True)

          catalog = json.loads(INDEX_PATH.read_text(encoding="utf-8"))
          manifest = json.loads(MANIFEST_PATH.read_text(encoding="utf-8"))

          failures = []
          cached = []
          retained = 0

          def key(builder, pedal):
              return f"{builder}\0{pedal}"

          def slug(text):
              text = str(text or "").strip().lower()
              text = re.sub(r"[^a-z0-9]+", "-", text).strip("-")
              return text or "unknown"

          def pedal_dir(builder, pedal):
              return ASSET_ROOT / slug(builder) / slug(pedal)

          def image_path(entry):
              builder = entry.get("company") or entry.get("builder")
              pedal = entry.get("pedal")
              base = pedal_dir(builder, entry.get("parent_pedal") if entry.get("catalog_role") == "variation" and entry.get("parent_pedal") else pedal)
              if entry.get("catalog_role") == "variation" and entry.get("parent_pedal"):
                  return base / "variants" / f"{slug(entry.get('variation_name') or pedal)}.webp"
              return base / "primary.webp"

          def rel_path(path):
              return "./" + path.as_posix()

          def fetch(url, referer=None):
              headers = {
                  "User-Agent": "Mozilla/5.0 (compatible; The Dirt Archive image cache/1.0)",
                  "Accept": "image/avif,image/webp,image/apng,image/jpeg,image/png,image/*,*/*;q=0.8",
              }
              if referer and referer.startswith("http"):
                  headers["Referer"] = referer
              req = urllib.request.Request(url, headers=headers)
              last_error = None
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=45) as response:
                          data = response.read()
                          if len(data) > 25 * 1024 * 1024:
                              raise RuntimeError("image exceeds 25 MB download limit")
                          return data
                  except Exception as exc:
                      last_error = exc
                      time.sleep(2 ** attempt)
              raise RuntimeError(str(last_error))

          def is_local(path):
              return str(path).startswith("./assets/pedals/") or str(path).startswith("assets/pedals/")

          def cache_entry(entry):
              nonlocal_var = None
              image = entry.get("image")
              if not image:
                  return

              builder = entry.get("company") or entry.get("builder")
              pedal = entry.get("pedal")
              if not builder or not pedal:
                  return

              target = image_path(entry)
              target.parent.mkdir(parents=True, exist_ok=True)

              if is_local(image):
                  existing = ROOT / image.lstrip("./")
                  if existing.exists():
                      if image != rel_path(target):
                          entry["image"] = rel_path(target)
                      retained_list[0] += 1
                      return
                  failures.append((builder, pedal, image, "declared local cache file is missing"))
                  return

              if target.exists():
                  entry["image_source_url"] = image
                  entry["image"] = rel_path(target)
                  retained_list[0] += 1
                  return

              if not image.startswith(("http://", "https://")):
                  failures.append((builder, pedal, image, "unsupported image URL/path"))
                  return

              try:
                  data = fetch(image, entry.get("image_source_page") or entry.get("source_page"))
                  with Image.open(io.BytesIO(data)) as source:
                      img = ImageOps.exif_transpose(source)
                      if img.width <= 0 or img.height <= 0:
                          raise RuntimeError("invalid image dimensions")
                      img = img.convert("RGBA" if "A" in img.getbands() else "RGB")
                      img.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
                      img.save(target, "WEBP", quality=88, method=6)

                  entry["image_source_url"] = image
                  entry["image"] = rel_path(target)
                  cached.append((builder, pedal, rel_path(target)))
              except Exception as exc:
                  failures.append((builder, pedal, image, str(exc)))

          # Mutable counters are used because cache_entry is nested and module scope
          # does not permit a top-level nonlocal declaration.
          retained_list = [0]

          # Cache the catalog's canonical image records.
          for entry in catalog.get("pedals", []):
              cache_entry(entry)

          # Mirror the canonical image path into the internal photo manifest.
          catalog_by_key = {
              key(x.get("company"), x.get("pedal")): x
              for x in catalog.get("pedals", [])
          }
          for entry in manifest:
              source = catalog_by_key.get(key(entry.get("company") or entry.get("builder"), entry.get("pedal")))
              if not source:
                  continue
              if source.get("image"):
                  entry["image"] = source.get("image")
              if source.get("image_source_url"):
                  entry["image_source_url"] = source.get("image_source_url")

          # Remove any stale empty directories left by prior cache attempts.
          for directory in sorted(ASSET_ROOT.rglob("*"), reverse=True):
              if directory.is_dir():
                  try:
                      directory.rmdir()
                  except OSError:
                      pass

          INDEX_PATH.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          MANIFEST_PATH.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          lines = [
              "# Pedal Image Cache Report",
              "",
              f"- Cached in this run: **{len(cached)}**",
              f"- Local images retained/reorganized: **{retained_list[0]}**",
              f"- Download failures: **{len(failures)}**",
              "",
              "## Storage layout",
              "",
              "- Primary image: `assets/pedals/{builder}/{pedal}/primary.webp`",
              "- Colorway/edition image: `assets/pedals/{builder}/{pedal}/variants/{variant}.webp`",
              "- Original source URL remains stored as `image_source_url`.",
              "",
          ]
          if cached:
              lines += ["## Newly cached", ""]
              lines += [f"- {b} - {p} -> `{path}`" for b, p, path in cached]
              lines += [""]
          if failures:
              lines += ["## Still external / failed", ""]
              lines += [f"- {b} - {p}: {reason} (`{url}`)" for b, p, url, reason in failures]
              lines += [
                  "",
                  "These records remain externally referenced until a later cache run succeeds.",
              ]
          else:
              lines += ["All pictured pedal images are locally cached."]
          REPORT_PATH.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print(f"Cached {len(cached)} new images; retained/reorganized {retained_list[0]}; {len(failures)} failures.")
          PY

      - name: Synchronize with latest main
        run: |
          # The cache can take a while. Rebase any newer documentation/site
          # commits before creating the cache commit so the result is never
          # based on a stale main branch.
          git stash push -u -m "image-cache-work"
          git fetch origin main
          git rebase origin/main
          git stash pop || true

      - name: Commit cached images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pedals research/PEDAL_INDEX.json research/pedals/PEDAL_IMAGES.json research/IMAGE_CACHE_REPORT.md
          if git diff --cached --quiet; then
            echo "No image cache changes to commit."
            exit 0
          fi
          git commit -m "Archive verified pedal photos locally"
          git push
