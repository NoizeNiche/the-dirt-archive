<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Dirt Archive</title>
<style>
:root{--bg:#f3f0e8;--panel:#fffdf8;--ink:#111;--muted:#716c63;--line:#d9d2c7;--accent:#dfff38}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.wrap{width:min(1440px,calc(100% - 28px));margin:auto}
header{padding:26px 0 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(243,240,232,.95);backdrop-filter:blur(12px);z-index:5}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}.brand{margin:0;font-size:clamp(2.4rem,6vw,5.5rem);line-height:.88;letter-spacing:-.065em;text-transform:uppercase;font-weight:950}.tag{margin:8px 0 0;color:var(--muted);font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.search{width:min(620px,100%);border:2px solid var(--ink);border-radius:999px;background:var(--panel);padding:15px 18px;outline:0}.search:focus{box-shadow:0 0 0 4px var(--accent)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font-size:1.4rem;letter-spacing:-.04em}.stat span{font-size:.68rem;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.08em}
main{padding:20px 0 60px}.layout{display:grid;grid-template-columns:280px 1fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px}.companies{padding:12px;position:sticky;top:165px;max-height:calc(100vh - 185px);overflow:auto}.heading{font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:8px}.company{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-weight:750}.company:hover{background:#eee9df}.company.active{background:var(--accent)}.count{color:var(--muted);font-size:.72rem;font-weight:900}.results{padding:16px}.resulthead{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:14px}.title{margin:0;font-size:clamp(1.5rem,3vw,2.5rem);letter-spacing:-.05em}.meta{color:var(--muted);font-size:.8rem;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer}.card:hover{border-color:#999286;box-shadow:0 8px 18px rgba(0,0,0,.07);transform:translateY(-1px)}.name{display:block;font-weight:850;letter-spacing:-.02em;margin-bottom:10px}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:4px 7px;border-radius:999px;background:#eee9df}.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:10;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.detail{width:min(920px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px}.detailtop{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}.detailcompany{font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}.detailname{margin:0;font-size:clamp(2rem,5vw,4rem);line-height:.9;letter-spacing:-.06em}.close{width:40px;height:40px;border:0;border-radius:50%;background:#eee9df;cursor:pointer;font-size:1.2rem;font-weight:900}.detailgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}.box{border:1px solid var(--line);border-radius:16px;background:#fff;padding:15px}.label{font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}.info{line-height:1.6;color:#2b2823}.photo{aspect-ratio:4/3;display:grid;place-items:center;text-align:center;border:2px dashed #bdb5a8;border-radius:13px;background:#f7f4ee;color:var(--muted);font-weight:800;padding:20px}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.top{flex-direction:column;align-items:stretch}.search{width:100%}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.companies{position:static;max-height:none}.grid{grid-template-columns:1fr}.detailgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><div class="top"><div><h1 class="brand">The Dirt Archive</h1><p class="tag">Company → Pedal → Pedal Info → Photo</p></div><input id="search" class="search" type="search" placeholder="Search company or pedal…"></div><div class="stats" id="stats"></div></div></header>
<main class="wrap"><div class="layout"><aside class="panel companies"><div class="heading">Companies <span id="companyCount"></span></div><div id="companies"></div></aside><section class="panel results"><div class="resulthead"><h2 class="title" id="title">All pedals</h2><div class="meta" id="meta">Loading…</div></div><div class="grid" id="grid"></div></section></div></main>
<div class="modal" id="modal"><div class="detail"><div class="detailtop"><div><div class="detailcompany" id="dcompany"></div><h2 class="detailname" id="dname"></h2><div class="chips" id="dtypes" style="margin-top:11px"></div></div><button class="close" id="close">×</button></div><div class="detailgrid"><div class="box"><div class="label">Pedal info</div><div class="info" id="dinfo"></div></div><div class="box"><div class="label">Photo of pedal</div><div class="photo">Photo goes here.<br>The pedal image belongs to this record.</div></div></div></div></div>
<script>
const DATA=['./research/MASTER_PEDAL_CENSUS.csv','./research/SCRAPE_A_CENSUS.csv'];let items=[],company=null,q='';
const $=id=>document.getElementById(id);
function csv(s){let out=[],r=[],f='',quote=false;for(let i=0;i<s.length;i++){let c=s[i],n=s[i+1];if(quote){if(c==='"'&&n==='"'){f+='"';i++}else if(c==='"')quote=false;else f+=c}else if(c==='"')quote=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f.replace(/\r$/,''));out.push(r);r=[];f=''}else f+=c}if(f||r.length){r.push(f.replace(/\r$/,''));out.push(r)}let h=out.shift()||[];return out.filter(x=>x.some(Boolean)).map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()])))}
function group(rows){let m=new Map();for(const x of rows){if(!x.Builder||!x.Pedal)continue;let k=x.Builder+'\u0000'+x.Pedal;if(!m.has(k))m.set(k,{company:x.Builder,pedal:x.Pedal,types:new Set});if(x.Type)m.get(k).types.add(x.Type)}return [...m.values()].map(x=>({...x,types:[...x.types].sort()})).sort((a,b)=>a.company.localeCompare(b.company)||a.pedal.localeCompare(b.pedal))}
function esc(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function render(){let companies=new Map();for(const x of items)companies.set(x.company,(companies.get(x.company)||0)+1);let c=[...companies.entries()].sort((a,b)=>a[0].localeCompare(b[0]));$('companyCount').textContent=c.length?' '+c.length:'';let visible=c.filter(([x])=>!q||x.toLowerCase().includes(q.toLowerCase()));$('companies').innerHTML='<button class="company '+(company===null?'active':'')+'" data-c=""><span>All companies</span><span class="count">'+items.length+'</span></button>'+visible.map(([x,n])=>'<button class="company '+(company===x?'active':'')+'" data-c="'+esc(x)+'"><span>'+esc(x)+'</span><span class="count">'+n+'</span></button>').join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{company=b.dataset.c||null;render()});let v=items.filter(x=>(company===null||x.company===company)&&(!q||x.company.toLowerCase().includes(q.toLowerCase())||x.pedal.toLowerCase().includes(q.toLowerCase())));$('title').textContent=company|| (q?'Search: '+q:'All pedals');$('meta').textContent=v.length.toLocaleString()+' pedal'+(v.length===1?'':'s');$('grid').innerHTML=v.length?v.map((x,i)=>'<button class="card" data-i="'+i+'"><span class="name">'+esc(x.pedal)+'</span><span class="chips">'+x.types.map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+'</span></button>').join(''):'<div class="empty">No pedals match that search.</div>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>open(v[+b.dataset.i]));let n=t=>items.filter(x=>x.types.includes(t)).length;$('stats').innerHTML=[['Companies',c.length],['Pedals',items.length],['Overdrive',n('Overdrive')],['Distortion',n('Distortion')],['Fuzz',n('Fuzz')]].map(x=>'<div class="stat"><b>'+x[1].toLocaleString()+'</b><span>'+x[0]+'</span></div>').join('')}
function open(x){$('dcompany').textContent=x.company;$('dname').textContent=x.pedal;$('dtypes').innerHTML=x.types.map(t=>'<span class="chip">'+esc(t)+'</span>').join('');$('dinfo').textContent='This is the '+x.pedal+' record from '+x.company+'. The archive stores the pedal here first. Detailed pedal information and the actual pedal photo can be added directly to this record.';$('modal').classList.add('open')}
$('search').oninput=e=>{q=e.target.value.trim();render()};$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};document.onkeydown=e=>{if(e.key==='Escape')$('modal').classList.remove('open')};
Promise.all(DATA.map(u=>fetch(u).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}))).then(ts=>{items=group(ts.flatMap(csv));render()}).catch(e=>{$('meta').textContent='Catalog unavailable';$('grid').innerHTML='<div class="empty">The catalog data could not be loaded.</div>';console.error(e)});
</script>
</body></html>
