  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      background: #ffd400;

      display: flex;

      text-align: center;
      font-size: clamp(3rem, 11.5vw, 12rem);
