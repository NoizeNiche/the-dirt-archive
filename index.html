<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Dirt Archive</title>
<style>
:root{--bg:#f3f0e8;--panel:#fffdf8;--ink:#111;--muted:#716c63;--line:#d9d2c7;--accent:#dfff38}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{color:inherit}
.wrap{width:min(1440px,calc(100% - 28px));margin:auto}
header{padding:26px 0 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(243,240,232,.95);backdrop-filter:blur(12px);z-index:5}
.top{display:flex;justify-content:space-between;gap:20px;align-items:end}
.brand{margin:0;font-size:clamp(2.4rem,6vw,5.5rem);line-height:.88;letter-spacing:-.065em;text-transform:uppercase;font-weight:950}
.tag{margin:8px 0 0;color:var(--muted);font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.search{width:min(620px,100%);border:2px solid var(--ink);border-radius:999px;background:var(--panel);padding:15px 18px;outline:0}
.search:focus{box-shadow:0 0 0 4px var(--accent)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.4rem;letter-spacing:-.04em}
.stat span{font-size:.68rem;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.08em}

main{padding:20px 0 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px}
.browse{padding:12px;display:grid;grid-template-columns:auto minmax(220px,360px);gap:12px;align-items:center}
.browseLabel,.builderLabel{font-size:.68rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.typeMenu{display:flex;gap:7px;flex-wrap:wrap}
.typeButton,.allButton{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-size:.76rem;font-weight:950;text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.typeButton:hover,.allButton:hover{border-color:#999286}
.typeButton.active,.allButton.active{background:var(--accent);border-color:var(--ink)}
.builderWrap{display:grid;gap:5px}
.builderSelect{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-weight:800;outline:0}
.builderSelect:focus{box-shadow:0 0 0 3px var(--accent)}
.results{margin-top:16px;padding:16px}
.resulthead{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:14px}
.title{margin:0;font-size:clamp(1.5rem,3vw,2.5rem);letter-spacing:-.05em}
.meta{color:var(--muted);font-size:.8rem;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{display:block;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;text-decoration:none;cursor:pointer}
.card:hover{border-color:#999286;box-shadow:0 8px 18px rgba(0,0,0,.07);transform:translateY(-1px)}
.name{display:block;font-weight:850;letter-spacing:-.02em;margin-bottom:10px}
.builderName{display:block;color:var(--muted);font-size:.68rem;font-weight:900;text-transform:uppercase;letter-spacing:.07em;margin-top:-4px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:4px 7px;border-radius:999px;background:#eee9df}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
.hint{margin:9px 0 0;color:var(--muted);font-size:.74rem;line-height:1.45}
@media(max-width:900px){.browse{grid-template-columns:1fr}.builderWrap{max-width:none}.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.top{flex-direction:column;align-items:stretch}.search{width:100%}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.resulthead{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1 class="brand">The Dirt Archive</h1>
        <p class="tag">Company → Pedal → Pedal Info → Photo</p>
      </div>
      <input id="search" class="search" type="search" placeholder="Search builder or pedal…">
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main class="wrap">
  <section class="panel browse">
    <div>
      <div class="browseLabel">Browse dirt</div>
      <div class="typeMenu" id="typeMenu" style="margin-top:6px"></div>
      <p class="hint">Pick a dirt type, then choose a builder. The pedal list changes immediately.</p>
    </div>
    <div class="builderWrap">
      <label class="builderLabel" for="builderSelect">Builder</label>
      <select id="builderSelect" class="builderSelect"></select>
    </div>
  </section>

  <section class="panel results">
    <div class="resulthead">
      <h2 class="title" id="title">All Pedals</h2>
      <div class="meta" id="meta">Loading…</div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<script>
const DATA=[
  './research/MASTER_PEDAL_CENSUS.csv',
  './research/SCRAPE_A_CENSUS.csv',
  './research/SCRAPE_B_CENSUS.csv',
  './research/SCRAPE_C_CENSUS.csv'
];

let items=[];
const initialParams=new URLSearchParams(location.search);
let selectedType=initialParams.get('type')||'All';
let selectedBuilder=initialParams.get('builder')||'';
let q=initialParams.get('q')||'';
if(!['All','Overdrive','Distortion','Fuzz'].includes(selectedType))selectedType='All';

const $=id=>document.getElementById(id);

function csv(s){
  let out=[],r=[],f='',quote=false;
  for(let i=0;i<s.length;i++){
    const c=s[i],n=s[i+1];
    if(quote){
      if(c==='"'&&n==='"'){f+='"';i++}
      else if(c==='"')quote=false;
      else f+=c;
    }else if(c==='"')quote=true;
    else if(c===','){r.push(f);f=''}
    else if(c==='\n'){r.push(f.replace(/\r$/,''));out.push(r);r=[];f=''}
    else f+=c;
  }
  if(f||r.length){r.push(f.replace(/\r$/,''));out.push(r)}
  const h=out.shift()||[];
  return out
    .filter(x=>x.some(Boolean))
    .map(x=>Object.fromEntries(h.map((k,i)=>[k,(x[i]||'').trim()])));
}

function group(rows){
  const m=new Map();
  for(const x of rows){
    if(!x.Builder||!x.Pedal)continue;
    const k=x.Builder+'\u0000'+x.Pedal;
    if(!m.has(k))m.set(k,{company:x.Builder,pedal:x.Pedal,types:new Set});
    if(x.Type)m.get(k).types.add(x.Type);
  }
  return [...m.values()]
    .map(x=>({...x,types:[...x.types].sort()}))
    .sort((a,b)=>a.company.localeCompare(b.company)||a.pedal.localeCompare(b.pedal));
}

function esc(x){
  return String(x)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function slugParams(x){
  const p=new URLSearchParams({builder:x.company,pedal:x.pedal});
  return './pedal.html?'+p.toString();
}

function typeMatches(x){
  return selectedType==='All'||x.types.includes(selectedType);
}

function searchMatches(x){
  if(!q)return true;
  const needle=q.toLowerCase();
  return x.company.toLowerCase().includes(needle)||x.pedal.toLowerCase().includes(needle);
}

function getBuilders(){
  return [...new Set(
    items.filter(typeMatches).map(x=>x.company)
  )].sort((a,b)=>a.localeCompare(b));
}

function renderTypeMenu(){
  const types=['All','Overdrive','Distortion','Fuzz'];
  $('typeMenu').innerHTML=types.map(t=>
    '<button class="typeButton '+(selectedType===t?'active':'')+'" data-type="'+t+'">'+t+(t==='All'?' Pedals':'')+'</button>'
  ).join('');
  document.querySelectorAll('[data-type]').forEach(btn=>btn.onclick=()=>{
    selectedType=btn.dataset.type;
    selectedBuilder='';
    syncUrl();
    render();
  });
}

function renderBuilderSelect(){
  const builders=getBuilders();
  if(selectedBuilder&&!builders.includes(selectedBuilder))selectedBuilder='';
  $('builderSelect').innerHTML=
    '<option value="">All builders ('+builders.length+')</option>'+
    builders.map(b=>'<option value="'+esc(b)+'">'+esc(b)+'</option>').join('');
  $('builderSelect').value=selectedBuilder;
}

function syncUrl(){
  const p=new URLSearchParams();
  if(selectedType!=='All')p.set('type',selectedType);
  if(selectedBuilder)p.set('builder',selectedBuilder);
  if(q)p.set('q',q);
  const target=p.toString()?('./index.html?'+p.toString()):'./index.html';
  history.replaceState({},'',target);
}

function filteredItems(){
  return items.filter(x=>
    typeMatches(x)&&
    (!selectedBuilder||x.company===selectedBuilder)&&
    searchMatches(x)
  );
}

function render(){
  if(selectedBuilder && !getBuilders().includes(selectedBuilder))selectedBuilder='';
  renderTypeMenu();
  renderBuilderSelect();

  const allVisible=filteredItems();
  const builderCount=new Set(allVisible.map(x=>x.company)).size;

  let title='All Pedals';
  if(selectedType!=='All')title=selectedType;
  if(selectedBuilder)title=selectedBuilder;
  if(selectedBuilder&&selectedType!=='All')title=selectedBuilder+' · '+selectedType;
  if(q)title='Search: '+q;

  $('title').textContent=title;
  $('meta').textContent=
    allVisible.length.toLocaleString()+' pedal'+(allVisible.length===1?'':'s')+
    ' · '+builderCount.toLocaleString()+' builder'+(builderCount===1?'':'s');

  $('grid').innerHTML=allVisible.length
    ? allVisible.map(x=>
      '<a class="card" href="'+slugParams(x)+'">'+
        '<span class="name">'+esc(x.pedal)+'</span>'+
        '<span class="builderName">'+esc(x.company)+'</span>'+
        '<span class="chips">'+x.types.map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+'</span>'+
      '</a>'
    ).join('')
    : '<div class="empty">No pedals match those selections.</div>';

  const uniquePedals=items.length;
  const counts={Overdrive:new Set(),Distortion:new Set(),Fuzz:new Set()};
  for(const x of items){
    for(const t of x.types)if(counts[t])counts[t].add(x.company+'\u0000'+x.pedal);
  }
  const companies=new Set(items.map(x=>x.company));
  $('stats').innerHTML=[
    ['Companies',companies.size],
    ['Pedals',uniquePedals],
    ['Overdrive',counts.Overdrive.size],
    ['Distortion',counts.Distortion.size],
    ['Fuzz',counts.Fuzz.size]
  ].map(x=>'<div class="stat"><b>'+x[1].toLocaleString()+'</b><span>'+x[0]+'</span></div>').join('');
}

$('search').oninput=e=>{q=e.target.value.trim();syncUrl();render()};
$('builderSelect').onchange=e=>{selectedBuilder=e.target.value;syncUrl();render()};

Promise.all(
  DATA.map(u=>fetch(u).then(r=>{
    if(!r.ok)throw Error(r.status);
    return r.text();
  }))
)
.then(ts=>{
  items=group(ts.flatMap(csv));
  render();
  syncUrl();
})
.catch(e=>{
  $('meta').textContent='Catalog unavailable';
  $('grid').innerHTML='<div class="empty">The catalog data could not be loaded.</div>';
  console.error(e);
});
</script>
</body>
</html>
